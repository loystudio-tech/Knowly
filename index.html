function isoDate(d) { const z = (n) => String(n).padStart(2, '0'); return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}`; }
function parseISO(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(s, n) { const d = parseISO(s); d.setDate(d.getDate() + n); return isoDate(d); }
function daysUntil(s) { return Math.round((parseISO(s) - parseISO(todayISO())) / 864e5); }

const DB = {
  db: null,
  open() {
    return new Promise((res) => {
      try {
        const r = indexedDB.open('knowly', 1);
        r.onupgradeneeded = () => { for (const s of STORES) if (!r.result.objectStoreNames.contains(s)) r.result.createObjectStore(s, { keyPath: 'id' }); };
        r.onsuccess = () => { this.db = r.result; res(true); };
        r.onerror = () => res(false);
      } catch (e) { res(false); }
    });

  tx(store, mode) { return this.db.transaction(store, mode).objectStore(store); },
  all(store) { return new Promise((res) => { if (!this.db) return res([]); const r = this.tx(store, 'readonly').getAll(); r.onsuccess = () => res(r.result || []); r.onerror = () => res([]); }); },

/* ---------------- markdown + math ---------------- */
function md(src) {
  if (src == null || src === '') return '';
  const maths = [];
  const ph = (x, d) => { maths.push([x, d]); return `MATHPH${maths.length - 1}END`; };
  let s = String(src)
    .replace(/\$\$([\s\S]+?)\$\$/g, (m, x) => ph(x, true))
    .replace(/\\\[([\s\S]+?)\\\]/g, (m, x) => ph(x, true))
    .replace(/\\\(([\s\S]+?)\\\)/g, (m, x) => ph(x, false))
    .replace(/\$([^$\n]+?)\$/g, (m, x) => (/^\s|\s$/.test(x) ? m : ph(x, false)));
  let html;
  try { html = window.marked ? marked.parse(s, { breaks: true, gfm: true }) : '<p>' + esc(s).replace(/\n/g, '<br>') + '</p>'; } catch (e) { html = '<p>' + esc(s) + '</p>'; }
  html = html.replace(/MATHPH(\d+)END/g, (m, i) => {
    const [x, d] = maths[+i];
    if (window.katex) { try { return katex.renderToString(x, { displayMode: d, throwOnError: false, output: 'html' }); } catch (e) {} }
    return `<code>${esc(x)}</code>`;
  });
  return window.DOMPurify ? DOMPurify.sanitize(html) : html;
}
function safeSvg(svg) {
  if (!svg || !/<svg[\s>]/i.test(svg)) return '';
  if (!window.DOMPurify) return '';
  return DOMPurify.sanitize(svg, { USE_PROFILES: { svg: true, svgFilters: true } });
}

function toast(msg, err) {

  t.className = 'toast ' + kind;

}
function confetti() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = document.createElement('canvas'); c.className = 'confetti'; document.body.appendChild(c);
  const ctx = c.getContext('2d'), dpr = devicePixelRatio || 1;
  c.width = innerWidth * dpr; c.height = innerHeight * dpr; ctx.scale(dpr, dpr);
  const cols = ['#a78bfa', '#8b5cf6', '#e879f9', '#fbbf24', '#34d399', '#60a5fa'];
  const ps = Array.from({ length: 140 }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 200, y: innerHeight * .55, vx: (Math.random() - .5) * 16, vy: -Math.random() * 16 - 6, r: Math.random() * 6 + 4, c: cols[(Math.random() * cols.length) | 0], a: Math.random() * 6, va: (Math.random() - .5) * .4 }));
  const t0 = performance.now();
  const tick = (t) => {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of ps) { p.vy += .45; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore(); }
    if (t - t0 < 2600) requestAnimationFrame(tick); else c.remove();
  };
  requestAnimationFrame(tick);
}
function openModal(html, { cls = '', onClose, closable = true } = {}) {
  const ov = document.createElement('div');

  ov.innerHTML = `<div class="modal ${cls}">${closable ? `<button class="icon-btn x" data-close>${ic('x')}</button>` : ''}${html}</div>`;
  document.body.appendChild(ov);

  const onKey = (e) => { if (e.key === 'Escape' && closable) close(); };

}

/* ---------------- files → content blocks ---------------- */
const MAX_SOURCES = 10;
function readAsDataURL(file) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); }); }
function readAsText(file) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsText(file); }); }
function loadImg(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
async function fileToSource(file) {
  const name = file.name || 'archivo';
  const type = file.type || '';
  if (type.startsWith('image/') || /\.(heic|heif)$/i.test(name)) {
    const url = await readAsDataURL(file);
    let img;
    try { img = await loadImg(url); } catch (e) { throw new Error(`No puedo abrir "${name}". Si es HEIC, conviértela a JPG.`); }
    const max = 1600, sc = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
    const data = c.toDataURL('image/jpeg', 0.85);
    return { id: uid(), kind: 'image', name, mime: 'image/jpeg', data: data.split(',')[1] };
  }
  if (type === 'application/pdf' || /\.pdf$/i.test(name)) {
    if (file.size > 25e6) throw new Error(`"${name}" pesa demasiado (máx. 25 MB).`);
    const url = await readAsDataURL(file);
    return { id: uid(), kind: 'pdf', name, mime: 'application/pdf', data: url.split(',')[1] };
  }
  if (type.startsWith('text/') || /\.(txt|md|csv|json|html?)$/i.test(name)) {
    return { id: uid(), kind: 'text', name, mime: 'text/plain', data: (await readAsText(file)).slice(0, 200000) };
  }
  throw new Error(`"${name}": formato no soportado. Usa fotos, PDF o texto (Word/PPT → expórtalo a PDF).`);
}
async function filesToSources(files, current = []) {
  const out = [];
  for (const f of files) {
    if (current.length + out.length >= MAX_SOURCES) { toast(`Máximo ${MAX_SOURCES} fuentes por set`, true); break; }
    try { out.push(await fileToSource(f)); } catch (e) { toast(e.message, true); }
  }
  return out;
}
function sourceBlock(s) {
  if (s.kind === 'image') return { type: 'image', source: { type: 'base64', media_type: s.mime, data: s.data } };
  if (s.kind === 'pdf') return { type: 'document', source: { type: 'base64', media_type: 'application/pdf', data: s.data } };
  return { type: 'text', text: `--- Fuente: ${s.name} ---\n${s.data}` };
}
function sourcesBlocks(sources, cache) {
  const b = (sources || []).map(sourceBlock);
  if (cache && b.length) b[b.length - 1] = { ...b[b.length - 1], cache_control: { type: 'ephemeral' } };
  return b;
}
const srcThumb = (s) => s.kind === 'image' ? `data:${s.mime};base64,${s.data}` : '';
function attChip(s) {
  return `<div class="att" data-id="${s.id}">${s.kind === 'image' ? `<img src="${srcThumb(s)}" alt="">` : `<div class="ficon">${ic(s.kind === 'pdf' ? 'file' : 'text')}</div>`}<span>${esc(s.name)}</span><button title="Quitar" data-rm="${s.id}">${ic('x')}</button></div>`;
}

/* ---------------- AI ---------------- */
let AI_BUSY = 0;
async function ai({ system, messages, schema, max_tokens = 8000, model, onText, signal, skills }) {
  if (skills && skills.length) {
    system = (system || '') + skillsSystem(skills);
    const blocks = skills.flatMap((s) => (s.sources && s.sources.length ? [{ type: 'text', text: `Material de referencia de la skill /${s.slug} («${s.name}»):` }, ...s.sources.map(sourceBlock)] : []));
    if (blocks.length) {
      blocks[blocks.length - 1] = { ...blocks[blocks.length - 1], cache_control: { type: 'ephemeral' } };
      messages = [{ role: 'user', content: [...blocks, { type: 'text', text: 'Este es el material de referencia de mis skills. Úsalo como modelo de método, formato y estilo.' }] }, { role: 'assistant', content: 'Entendido. Seguiré exactamente ese método y ese formato.' }, ...messages];
    }
  }
  const body = { model: model || SETTINGS.model, max_tokens, messages, stream: true };
  if (system) body.system = system;
  if (schema) body.output_config = { format: { type: 'json_schema', schema } };
  const direct = SETTINGS.mode === 'direct';
  if (direct && !SETTINGS.apiKey) { openSettings(); throw new Error('Pon tu API key de Anthropic en Ajustes.'); }
  const url = direct ? 'https://api.anthropic.com/v1/messages' : '/api/ai';
  const headers = { 'content-type': 'application/json' };
  if (direct) { headers['x-api-key'] = SETTINGS.apiKey; headers['anthropic-version'] = '2023-06-01'; headers['anthropic-dangerous-direct-browser-access'] = 'true'; }
  else headers['x-app-password'] = SETTINGS.password || '';
  AI_BUSY++;
  try {
    let res;
    try { res = await fetch(url, { method: 'POST', headers, body: JSON.stringify(body), signal }); }
    catch (e) { if (e.name === 'AbortError') throw e; throw new Error(direct ? 'No se pudo conectar con Anthropic. Revisa tu internet.' : 'No se pudo conectar con /api/ai. Si abres el archivo en local, usa «Clave directa» en Ajustes.'); }
    if (!res.ok) {
      const t = await res.text();
      let msg = t.slice(0, 300);
      try { const j = JSON.parse(t); msg = j.error?.message || j.error || msg; } catch (e) {}
      if (res.status === 404 && !direct) msg = 'No encuentro /api/ai. Despliega en Netlify o usa «Clave directa» en Ajustes.';
      if (res.status === 401) msg = direct ? 'API key no válida (Ajustes).' : 'Contraseña incorrecta. Ponla en Ajustes.';
      if (res.status === 413) msg = 'El material es demasiado grande. Prueba con menos fotos o un PDF más corto.';
      if (res.status === 529 || res.status === 503) msg = 'La IA está saturada ahora mismo. Prueba en un momento.';
      if (res.status === 401 || res.status === 403) setTimeout(openSettings, 300);
      throw new Error(msg);
    }
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '', text = '', stop = null;
    const handle = (chunk) => {
      for (const line of chunk.split('\n')) {
        if (!line.startsWith('data:')) continue;
        const d = line.slice(5).trim();
        if (!d || d === '[DONE]') continue;
        let ev; try { ev = JSON.parse(d); } catch (e) { continue; }
        if (ev.type === 'content_block_delta' && ev.delta && ev.delta.type === 'text_delta') { text += ev.delta.text; onText && onText(text); }
        else if (ev.type === 'message_delta') stop = ev.delta && ev.delta.stop_reason;
        else if (ev.type === 'error') throw new Error((ev.error && ev.error.message) || 'Error de la IA');
      }
    };
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true }).replace(/\r\n/g, '\n');
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) { handle(buf.slice(0, i)); buf = buf.slice(i + 2); }
    }
    if (buf.trim()) handle(buf);
    if (stop === 'refusal') throw new Error('La IA no ha querido responder a esto.');
    if (schema) {
      if (stop === 'max_tokens') throw new Error('La respuesta salió demasiado larga. Prueba con menos material o divide el set.');
      try { return JSON.parse(text); }
      catch (e) { const a = text.indexOf('{'), b = text.lastIndexOf('}'); try { return JSON.parse(text.slice(a, b + 1)); } catch (e2) { throw new Error('La IA devolvió un formato raro. Inténtalo otra vez.'); } }
    }
    return text;
  } finally { AI_BUSY--; }
}

async function generating(title, fn, { expect = 6000, steps } = {}) {
  const ctrl = new AbortController();
  const STEPS = steps || ['Leyendo tu material', 'Pensando la estructura', 'Escribiendo el contenido', 'Repasando y guardando'];
  const m = openModal(`<div class="gen"><div class="gen-orb"><div>${ic('spark')}</div></div><h2>${esc(title)}</h2><p class="lead" id="gst">Esto suele tardar entre 20 y 60 segundos.</p><div class="gen-steps">${STEPS.map((s, k) => `<div data-s="${k}" class="${k === 0 ? 'on' : ''}"><i></i>${esc(s)}</div>`).join('')}</div><div class="bar"><i id="gbar" style="width:3%"></i></div><p class="muted" id="gch" style="font-size:13px">&nbsp;</p><button class="btn btn-ghost btn-sm" id="gcancel">Cancelar</button></div>`, { closable: false, cls: 'mid' });
  const stepTo = (k) => $$('[data-s]', m.el).forEach((d) => { const i = +d.dataset.s; d.className = i < k ? 'done' : i === k ? 'on' : ''; });
  $('#gcancel', m.el).onclick = () => ctrl.abort();
  const set = (status) => { const s = $('#gst', m.el); if (s && status) s.textContent = status; };
  const prog = (txt) => {

    if (c) c.textContent = `${n.toLocaleString('es')} caracteres generados`;

  catch (e) { if (e.name === 'AbortError') { toast('Cancelado'); return null; } toast(e.message, true); return null; }

function subjectsList() { return [...new Set(ST.sets.map((s) => s.subject).concat(ST.exams.map((e) => e.subject)).filter(Boolean))]; }

}
function allTopics(set) { return set.sections.flatMap((s) => s.topics); }

async function genSet({ sources, title, color, focus, custom }, opts) {
  const subs = subjectsList();
  const prompt = `Crea un set de estudio a partir del material anterior.
Enfoque del estudiante: ${focus.length ? focus.map((f) => FOCUS_LABELS[f]).join(', ') : 'general'}.

- overview: resumen general en markdown (120-220 palabras), qué se aprende y por qué importa.
- sections: de 2 a 4 secciones ordenadas como se aprenderían; cada una con 1 a 4 temas concretos.

  - review: repaso rápido en markdown, 4-6 puntos clave para memorizar.
Basa todo en el material. Si es una foto de pizarra o apuntes a mano, interpreta bien la letra; si falta contexto esencial para entenderlo, complétalo brevemente.`;
  const content = [...sourcesBlocks(sources), { type: 'text', text: prompt }];

function topicStats(t) {
  const fc = t.cards.length ? t.cards.filter((c) => c.known === true).length / t.cards.length : null;

  const ans = t.quiz.filter((q) => q.picked !== null);
  const qz = ans.length ? ans.filter((q) => q.picked === q.answer).length / ans.length : null;
  const parts = [fcTried ? fc : null, qz].filter((x) => x !== null);
  const mastery = parts.length ? Math.round((parts.reduce((a, b) => a + b, 0) / parts.length) * 100) : 0;
  const status = !parts.length ? 'new' : mastery >= 80 ? 'mastered' : 'review';
  return { mastery, status, tried: parts.length > 0 };
}

function examMastery(e) { if (!e.topics || !e.topics.length) return 0; return Math.round(e.topics.reduce((a, t) => a + (t.mastery || 0), 0) / e.topics.length); }

/* =================== spaced repetition =================== */
function srs(card, known) {
  card.ease = card.ease || 2.4;
  if (known) { card.ivl = !card.ivl ? 1 : card.ivl === 1 ? 3 : Math.round(card.ivl * card.ease); card.ease = Math.min(3, card.ease + 0.05); }
  else { card.ivl = 0; card.ease = Math.max(1.3, card.ease - 0.2); }
  card.due = addDays(todayISO(), card.ivl || 0);
}
function dueCards() {
  const t = todayISO(), out = [];
  for (const s of ST.sets) for (const tp of allTopics(s)) for (const c of tp.cards) if (c.due && c.due <= t) out.push({ c, s, tp });
  return out;
}
function newCards(limit = 20) {
  const out = [];
  for (const s of [...ST.sets].sort((a, b) => (b.lastOpenedAt || 0) - (a.lastOpenedAt || 0))) for (const tp of allTopics(s)) for (const c of tp.cards) if (!c.due && out.length < limit) out.push({ c, s, tp });

function flashRunner(el, cards, { onMark, onDone, title = 'Flashcards' } = {}) {
  let i = 0;

  const draw = () => {
    if (i >= order.length) {
      const known = cards.filter((c) => c.known === true).length;
      el.innerHTML = `<div class="runner"><div class="score card"><div class="big">${known}/${cards.length}</div><h3>¡Ronda terminada!</h3><p class="muted">Tarjetas que ya dominas. Repasa las demás hasta tenerlas todas.</p><div class="row" style="justify-content:center;margin-top:16px"><button class="btn btn-ghost" id="again">${ic('refresh')} Repasar todas</button>${known < cards.length ? `<button class="btn btn-primary" id="weak">Solo las que fallo</button>` : ''}</div></div></div>`;
      $('#again', el).onclick = () => { i = 0; order.splice(0, order.length, ...cards.map((_, k) => k)); draw(); };
      const w = $('#weak', el); if (w) w.onclick = () => { order.splice(0, order.length, ...cards.map((c, k) => (c.known === true ? -1 : k)).filter((k) => k >= 0)); i = 0; draw(); };
      onDone && onDone();
      return;
    }
    const c = cards[order[i]];
    el.innerHTML = `<div class="runner"><div class="runner-top"><b>${esc(title)}</b><div class="bar"><i style="width:${(i / order.length) * 100}%"></i></div><span class="muted">${i + 1}/${order.length}</span></div>
      <div class="flip" id="flip" tabindex="0"><div class="flip-in"><div class="face"><small>Pregunta</small><div class="md">${md(c.front)}</div><p class="muted" style="font-size:13px;font-weight:500;margin-top:20px">Toca para girar</p></div><div class="face back"><small>Respuesta</small><div class="md">${md(c.back)}</div></div></div></div>
      <div class="fc-btns"><button class="btn btn-ghost" id="prev" ${i === 0 ? 'disabled' : ''}>${ic('left')}</button><button class="btn btn-line" id="say" title="Escuchar">${ic('vol')}</button><button class="btn btn-danger" id="no">Repasar</button><button class="btn btn-primary" id="yes">${ic('check')} Lo sé</button></div></div>`;
    const flip = $('#flip', el);

    $('#no', el).onclick = () => { c.known = false; srs(c, false); logActivity(); onMark && onMark(c, false); i++; draw(); };
    $('#yes', el).onclick = () => { c.known = true; srs(c, true); logActivity(); onMark && onMark(c, true); i++; draw(); };

  const key = (e) => { if (!el.isConnected) return document.removeEventListener('keydown', key); if (e.target.matches('input,textarea')) return; const f = $('#flip', el); if (!f) return; if (e.code === 'Space') { e.preventDefault(); f.classList.toggle('on'); } if (e.key === 'ArrowRight') $('#yes', el)?.click(); if (e.key === 'ArrowLeft') $('#no', el)?.click(); };

    $$('.opt', el).forEach((b) => (b.onclick = () => { q.picked = +b.dataset.k; logActivity(); onAnswer && onAnswer(q, q.picked === q.answer); draw(); }));
    const n = $('#next', el); if (n) { n.onclick = () => { i++; draw(); }; n.focus(); }
  };

function chatPanel(el, { title, context, history, persist, suggestions = [], lang = 'es-ES' }) {
  let busy = false, voiceMode = false, rec = null;
  const draw = () => {
    el.innerHTML = `<div class="chat-head"><b>${esc(title)}</b><button class="icon-btn" id="cnew" title="Nuevo chat">${ic('edit')}</button><button class="icon-btn chat-close" id="cclose" title="Cerrar">${ic('x')}</button></div>
      <div class="msgs" id="msgs">${history.length ? history.map((m) => m.role === 'user' ? `<div class="msg u">${esc(m.content)}</div>` : `<div class="msg a"><div class="md">${md(m.content)}</div></div>`).join('') : `<div class="chat-hello"><div class="logo">${LOGO()}</div><h3>¡Hola! ¿En qué te ayudo?</h3><p>Pregúntame lo que quieras sobre este material.</p><div class="sugs">${suggestions.map((s) => `<button>${esc(s)}</button>`).join('')}</div></div>`}</div>
      <div class="chat-in"><div class="box"><input id="cin" placeholder="Pregunta o escribe / para usar una skill" autocomplete="off"><button class="icon-btn" id="csend">${ic('send')}</button></div><button class="sq-btn ${voiceMode ? 'mic-on' : ''}" id="cmic" title="Modo voz: habla y te responde en voz alta">${ic('mic')}</button></div>`;
    const msgs = $('#msgs', el); msgs.scrollTop = msgs.scrollHeight;
    slashAssist($('#cin', el));
    $('#csend', el).onclick = () => send($('#cin', el).value);
    $('#cin', el).onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(e.target.value); } };
    $$('.sugs button', el).forEach((b) => (b.onclick = () => send(b.textContent)));
    $('#cnew', el).onclick = () => { history.length = 0; persist(); draw(); };
    $('#cclose', el).onclick = () => el.classList.remove('open');
    $('#cmic', el).onclick = toggleVoice;
  };
  const toggleVoice = () => {
    if (voiceMode) { voiceMode = false; rec && rec.stop(); Speech.stop(); draw(); return; }
    voiceMode = true; draw(); listen();
  };
  const listen = () => {
    if (!voiceMode) return;
    const inp = $('#cin', el);
    rec = dictate({ lang, onText: (f, i) => { if (inp) inp.value = f + i; }, onEnd: (t) => { if (t && voiceMode) send(t); else if (voiceMode) { voiceMode = false; draw(); } } });
    if (!rec) { voiceMode = false; draw(); }
  };
  const send = async (q) => {
    q = (q || '').trim(); if (!q || busy) return;
    busy = true;
    history.push({ role: 'user', content: q });
    draw();
    const msgs = $('#msgs', el);
    const bubble = document.createElement('div'); bubble.className = 'msg a'; bubble.innerHTML = '<div class="md cursor"></div>';
    msgs.appendChild(bubble); msgs.scrollTop = msgs.scrollHeight;
    try {
      const ctx = await context();
      const msgsApi = [...(ctx.prefix || []), ...history.slice(-16).map((m) => ({ role: m.role, content: m.content }))];
      if (msgsApi[0] && msgsApi[0].role !== 'user') msgsApi.shift();
      const lastQ = parseSkills(q);
      if (lastQ.skills.length) msgsApi[msgsApi.length - 1] = { role: 'user', content: lastQ.text || q };
      const text = await ai({ system: ctx.system, skills: lastQ.skills, messages: msgsApi, max_tokens: 3000, onText: (t) => { $('.md', bubble).innerHTML = md(t); msgs.scrollTop = msgs.scrollHeight; } });
      history.push({ role: 'assistant', content: text });
      persist();
      if (voiceMode) { await Speech.say(plain(text), { lang }); listen(); }
    } catch (e) { history.pop(); toast(e.message, true); voiceMode = false; }
    busy = false; draw();
  };
  draw();
  return { send };
}

/* =================== reminders =================== */
function upcoming(days = 7) {
  const out = [];
  for (const e of ST.events) if (!e.done && daysUntil(e.date) >= 0 && daysUntil(e.date) <= days) out.push({ kind: 'event', id: e.id, title: e.title, type: e.type, date: e.date, subject: e.subject });
  for (const x of ST.exams) if (x.date && daysUntil(x.date) >= 0 && daysUntil(x.date) <= days) out.push({ kind: 'exam', id: x.id, title: x.title, type: 'exam', date: x.date, subject: x.subject });
  return out.sort((a, b) => a.date.localeCompare(b.date));
}
function remindersHTML() {

function notifyDue() {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  let sent = {}; try { sent = JSON.parse(localStorage.getItem('knowly.notified') || '{}'); } catch (e) {}
  for (const u of upcoming(1)) {
    const k = u.id + ':' + todayISO();

}
function solutionHTML(t, streaming) {
  const lines = t.split('\n');
  let final = '', rest = t;
  const m = /^\s*\**\s*RESPUESTA\s*:?\**\s*:?\s*(.*)$/i.exec(lines[0] || '');
  if (m) { final = m[1]; rest = lines.slice(1).join('\n'); }
  return `${final ? `<div class="final"><small>Respuesta final</small><div class="v md">${md(final)}</div></div>` : ''}<div class="md sol ${streaming ? 'cursor' : ''}">${md(rest)}</div>`;
}

  };

  const h = byId('history', id);
  if (!h) return go('/');
  v.innerHTML = `<div class="page"><div class="row between no-print" style="max-width:1180px;margin:0 auto 18px"><a class="back" href="#/?tool=board">${ic('left')} Volver</a><div class="row"><button class="btn btn-ghost btn-sm" id="regen">${ic('refresh')} Rehacer</button><button class="btn btn-ghost btn-sm" onclick="print()">${ic('print')} Imprimir</button></div></div><div id="bwrap"></div></div>`;
  const wrap = $('#bwrap', v);
  const make = async () => {
    wrap.innerHTML = `<div class="board-wrap"><div class="paper"><h2>Preparando la clase…</h2><p style="font-size:24px" id="bprog">El profe está pensando cómo explicártelo ✏️</p></div></div>`;
    const ctrl = new AbortController(); CLEANUP.push(() => ctrl.abort());
    try {
      h.board = await genBoard([...sourcesBlocks(h.sources), { type: 'text', text: h.question ? `Tema o pregunta: ${h.question}` : 'Explica el contenido del archivo.' }], { skills: skillsByIds(h.skillIds), signal: ctrl.signal, onText: (t) => { const p = $('#bprog', v); if (p) p.textContent = `Escribiendo la clase… (${t.length.toLocaleString('es')} caracteres)`; } });
      await save('history', h);
      const p = boardPlayer(wrap, h.board); CLEANUP.push(p.stop);
    } catch (e) { if (e.name !== 'AbortError') wrap.innerHTML = `<div class="card empty"><p style="color:var(--bad)">${esc(e.message)}</p><button class="btn btn-primary" id="rt">Reintentar</button></div>`; const r = $('#rt', v); if (r) r.onclick = make; }
  };
  $('#regen', v).onclick = make;
  if (h.board) { const p = boardPlayer(wrap, h.board); CLEANUP.push(p.stop); } else make();
}

function setCounts(s) { const ts = allTopics(s); return { topics: ts.length, cards: ts.reduce((a, t) => a + t.cards.length, 0), quiz: ts.reduce((a, t) => a + t.quiz.length, 0) }; }
function pageStudy(v, _, q) {

  const subj = q.s || '';
  const subjects = [...new Set(ST.sets.map((s) => s.subject))].sort();
  const shown = sets.filter((s) => !subj || s.subject === subj);
  const last = sets[0];
  v.innerHTML = `<div class="page narrow">
    <div id="rem">${remindersHTML()}</div>
    ${last ? `<h2 class="sec-title" style="margin-top:0">Continúa donde lo dejaste</h2>
    <div class="hub-top"><div class="card jump"><div class="grow"><h3>${esc(last.emoji || '')} ${esc(last.title)}</h3><div class="meta"><span>${ic('cards')} ${setCounts(last).cards} flashcards</span><span>${ic('list')} ${setCounts(last).quiz} preguntas</span><span class="grow"></span><span>${setMastery(last)}% dominado</span></div><div class="bar"><i style="width:${setMastery(last)}%"></i></div></div><a class="btn btn-primary btn-lg" href="#/set/${last.id}">Seguir aprendiendo</a></div>${reviewCardHTML()}</div>` : `<div class="card jump"><div class="grow"><h3>Empieza tu primer set de estudio</h3><p class="muted" style="margin:0;font-size:16px">Sube fotos de la pizarra, del libro o tus apuntes. ${APP_NAME} los organiza por materia y te prepara guías, flashcards, quizzes y más.</p></div><button class="btn btn-primary btn-lg" id="first">${ic('plus')} Crear set</button></div>`}
    <h2 class="sec-title">Herramientas rápidas</h2>
    <div class="qtools">${QUICK.map((t) => `<button class="qt" data-qt="${t.id}" style="background:${t.color}"><div><h3>${t.label}</h3><p>${t.desc}</p></div><div class="qt-art" style="color:${t.color}">${ic(t.icon)}</div></button>`).join('')}</div>
    <div class="sec-head"><h2 class="sec-title">Tus sets de estudio</h2>${shown.length > 3 ? `<span class="muted">${shown.length} sets</span>` : ''}</div>
    ${subjects.length ? `<div class="subjects"><button class="chip ${!subj ? 'on' : ''}" data-s="">${ic('folder')} Todas</button>${subjects.map((s) => `<button class="chip ${subj === s ? 'on' : ''}" data-s="${esc(s)}">${esc(s)}<span class="count">${ST.sets.filter((x) => x.subject === s).length}</span></button>`).join('')}</div>` : ''}

  bindReminders(v);
  const nb = () => createSetFlow({});
  $('#newset', v).onclick = nb; const f = $('#first', v); if (f) f.onclick = nb;
  $$('[data-s]', v).forEach((b) => (b.onclick = () => go('/study' + (b.dataset.s ? '?s=' + encodeURIComponent(b.dataset.s) : ''))));
  $$('[data-qt]', v).forEach((b) => (b.onclick = () => {
    const id = b.dataset.qt;
    if (id === 'solver') return go('/?tool=solver');
    if (id === 'predict') return newExamFlow({});
    createSetFlow({ preset: id });
  }));
}
function reviewCardHTML() {
  const due = dueCards().length, st = streak();
  return `<div class="review-card"><div class="row" style="gap:8px;opacity:.9">${ic('repeat')}<b>Repaso de hoy</b>${st ? `<span class="grow"></span><span class="row" style="gap:4px">${ic('flame')}${st} ${st === 1 ? 'día' : 'días'}</span>` : ''}</div><div class="n">${due}</div><p>${due ? 'tarjetas listas para repasar' : 'Nada pendiente. Aprende tarjetas nuevas.'}</p><a class="btn btn-white btn-sm" href="#/review">${due ? 'Empezar repaso' : 'Ir a repaso'}</a></div>`;
}
function setCardHTML(s) {
  const c = setCounts(s), m = setMastery(s);
  return `<a class="card set-card spot" href="#/set/${s.id}"><span class="emoji" style="background:${s.color}26">${esc(s.emoji || '📘')}</span><h3>${esc(s.title)}</h3><div class="sub"><span class="pill" style="background:${s.color}22;color:${s.color}">${esc(s.subject)}</span><span>${timeAgo(s.createdAt)}</span></div><div class="foot"><div class="bar"><i style="width:${m}%"></i></div><span>${c.topics} temas</span><span>${c.cards} tarjetas</span><span class="grow"></span><span>${m}%</span></div></a>`;
}

/* =================== CREATE SET FLOW =================== */
function createSetFlow({ sources = [], preset = '', custom = '' }) {
  let srcs = [...sources];
  let tab = 'files';
  const m = openModal(`<h2>Crear desde</h2>
    <div class="src-tabs">${[['files', 'file', 'Archivos', '#4f8bff'], ['text', 'text', 'Texto', '#a06cf5'], ['camera', 'camera', 'Cámara', '#f2625d'], ['notes', 'mic', 'Apuntes en vivo', '#2fa8f5']].map(([k, i, l, c]) => `<button class="src-tab ${k === tab ? 'on' : ''}" data-tab="${k}"><span class="src-ico" style="background:${c}">${ic(i)}</span>${l}</button>`).join('')}</div>
    <div id="tabbody"></div>
    <div class="attach-list" id="slist" style="margin-top:14px"></div>
    <textarea class="inp" id="custom" rows="2" style="margin-top:16px;border-radius:20px;padding:16px 18px;font-size:16px;color:var(--accent2)" placeholder="Personaliza el contenido (opcional): «preguntas tipo selectividad», «vocabulario para flashcards»… o escribe / para usar una skill">${esc(custom)}</textarea>
    <div class="row between" style="margin-top:16px"><span class="muted row" style="gap:6px">${ic('info')} Cada set puede incluir hasta ${MAX_SOURCES} fuentes</span><button class="btn btn-primary" id="next" disabled>Continuar ${ic('right')}</button></div>`, { cls: 'wide' });
  const el = m.el;
  const paintList = () => {
    $('#slist', el).innerHTML = srcs.map(attChip).join('');
    $$('[data-rm]', el).forEach((b) => (b.onclick = () => { srcs = srcs.filter((s) => s.id !== b.dataset.rm); paintList(); }));
    $('#next', el).disabled = !srcs.length;
  };
  const add = async (files) => { srcs = srcs.concat(await filesToSources(files, srcs)); paintList(); };
  const paintTab = () => {
    $$('[data-tab]', el).forEach((b) => b.classList.toggle('on', b.dataset.tab === tab));
    const tb = $('#tabbody', el);
    if (tab === 'files') {
      tb.innerHTML = `<div class="drop" id="drop"><div class="drop-art"><div style="background:#f0b03a;transform:rotate(-12deg)">${ic('img')}</div><div style="background:#4f8bff;transform:rotate(-5deg)">W</div><div style="background:#a06cf5;z-index:1">T</div><div style="background:#f2625d;transform:rotate(5deg)">PDF</div><div style="background:#ff8a3d;transform:rotate(12deg)">P</div></div><h3>Arrastra tus archivos aquí</h3><p class="muted">Fotos (JPG, PNG, HEIC en iPhone/iPad, WebP), PDF y TXT. Word/PowerPoint: expórtalos a PDF.</p><label class="btn btn-ghost" style="margin-top:8px">Elegir archivos<input type="file" multiple accept="image/*,application/pdf,.txt,.md" hidden id="fin"></label></div>`;
      const d = $('#drop', tb);
      d.ondragover = (e) => { e.preventDefault(); d.classList.add('drag'); };
      d.ondragleave = () => d.classList.remove('drag');
      d.ondrop = (e) => { e.preventDefault(); d.classList.remove('drag'); add([...e.dataTransfer.files]); };
      $('#fin', tb).onchange = (e) => { add([...e.target.files]); e.target.value = ''; };
    } else if (tab === 'text') {
      tb.innerHTML = `<textarea class="inp" id="tin" rows="9" placeholder="Pega aquí tus apuntes, un texto del libro, vocabulario…" style="border-radius:20px;padding:18px;font-size:16px"></textarea><div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn btn-soft btn-sm" id="tadd">${ic('plus')} Añadir texto</button></div>`;
      $('#tadd', tb).onclick = () => { const t = $('#tin', tb).value.trim(); if (!t) return; if (srcs.length >= MAX_SOURCES) return toast('Máximo de fuentes alcanzado', true); srcs.push({ id: uid(), kind: 'text', name: t.slice(0, 30) + (t.length > 30 ? '…' : ''), mime: 'text/plain', data: t }); $('#tin', tb).value = ''; paintList(); };
    } else if (tab === 'camera') {
      tb.innerHTML = `<div class="drop"><span class="src-ico" style="background:#f2625d;margin:0 auto;width:70px;height:70px">${ic('camera')}</span><h3>Haz fotos a la pizarra o al libro</h3><p class="muted">En el móvil o iPad se abre la cámara. Puedes hacer varias seguidas.</p><label class="btn btn-primary" style="margin-top:8px">${ic('camera')} Abrir cámara<input type="file" accept="image/*" capture="environment" hidden id="cin2"></label></div>`;
      $('#cin2', tb).onchange = (e) => { add([...e.target.files]); e.target.value = ''; };
    } else {
      const notes = [...ST.notes].sort((a, b) => b.createdAt - a.createdAt);
      tb.innerHTML = notes.length ? `<div style="max-height:300px;overflow:auto">${notes.map((n) => `<button class="note-item" data-note="${n.id}"><b>${esc(n.title)}</b><br><small>${timeAgo(n.createdAt)} · ${words(n.text)} palabras</small></button>`).join('')}</div>` : `<div class="drop"><h3>Aún no tienes apuntes en vivo</h3><p class="muted">Graba la clase y ${APP_NAME} la transcribe.</p><a class="btn btn-primary" href="#/notes" style="margin-top:8px">${ic('mic')} Ir a Apuntes en vivo</a></div>`;
      $$('[data-note]', tb).forEach((b) => (b.onclick = () => { const n = byId('notes', b.dataset.note); if (srcs.length >= MAX_SOURCES) return; srcs.push({ id: uid(), kind: 'text', name: n.title, mime: 'text/plain', data: n.text }); paintList(); }));
      $$('a', tb).forEach((a) => a.addEventListener('click', () => m.close()));
    }
  };
  $$('[data-tab]', el).forEach((b) => (b.onclick = () => { tab = b.dataset.tab; paintTab(); }));
  paintTab(); paintList();
  slashAssist($('#custom', el));
  $('#next', el).onclick = () => { const c = $('#custom', el).value.trim(); m.close(); nameSetFlow({ sources: srcs, preset, custom: c }); };
}
function nameSetFlow({ sources, preset, custom }) {
  let color = SET_COLORS[ST.sets.length % SET_COLORS.length];
  const pre = { flash: ['memo'], quiz: ['exam'], guide: ['understand'], cheat: ['exam'] }[preset] || [];
  const m = openModal(`<h2>Ponle nombre a tu set</h2><p class="lead">Un título que resuma el tema o el objetivo.</p>
    <div class="title-inp"><i id="tcol" style="background:${color}"></i><input id="tname" placeholder="Déjalo vacío y la IA elegirá un nombre"></div>
    <label class="lbl" style="margin-top:0">Color del set</label><div class="colors">${SET_COLORS.map((c) => `<button data-c="${c}" style="background:${c};color:${c}" class="${c === color ? 'on' : ''}">${c === color ? ic('check') : ''}</button>`).join('')}</div>
    <label class="lbl" style="margin-top:22px">¿Para qué lo quieres? (opcional)</label>
    <div class="checks">${Object.entries(FOCUS_LABELS).map(([k, l]) => `<label class="check"><input type="checkbox" value="${k}" ${pre.includes(k) ? 'checked' : ''}> ${l}</label>`).join('')}</div>
    <div class="row" style="justify-content:center;margin-top:30px"><button class="btn btn-primary btn-lg" id="create" style="min-width:280px">Crear set</button></div>`, { cls: 'mid' });
  const el = m.el;
  $$('[data-c]', el).forEach((b) => (b.onclick = () => { color = b.dataset.c; $$('[data-c]', el).forEach((x) => { x.classList.toggle('on', x === b); x.innerHTML = x === b ? ic('check') : ''; }); $('#tcol', el).style.background = color; }));
  $('#create', el).onclick = async () => {
    const title = $('#tname', el).value.trim();
    const focus = $$('.checks input:checked', el).map((i) => i.value);
    m.close();
    const ps = parseSkills(custom);
    const set = await generating('Creando tu set de estudio', (o) => genSet({ sources, title, color, focus, custom: ps.text }, { ...o, skills: ps.skills }), { expect: 9000, steps: ['Leyendo tu material', 'Detectando la materia', 'Escribiendo guías y temas', 'Ordenándolo en carpetas'] });
    if (!set) return;
    set.skillIds = ps.skills.map((s) => s.id);
    await save('sets', set);
    toast(`Guardado en «${set.subject}»`);
    setTimeout(() => runAutomations('upload', { set }), 600);
    go(`/set/${set.id}${preset && ['flash', 'quiz', 'cheat', 'guide'].includes(preset) ? '?go=' + preset : ''}`);
  };
}

/* =================== SET PAGE =================== */
function pageSet(v, id, q) {
  const set = byId('sets', id);
  if (!set) return go('/study');
  set.lastOpenedAt = Date.now(); save('sets', set);
  const first = allTopics(set)[0];
  const st = { view: q.v || (first ? 'topic' : 'overview'), topic: q.t || (first && first.id), left: 'topics', filter: 'all', guideTab: 'guide', open: false, closed: {} };
  if (q.go === 'cheat') st.view = 'cheat';
  v.innerHTML = `<div class="set-layout"><section class="pane set-left" id="left"></section><section class="pane set-center" id="center"></section><section class="pane chat" id="chat"></section></div><button class="chat-fab" id="fab">${ic('chat')}</button>`;
  const left = $('#left', v), center = $('#center', v), chatEl = $('#chat', v);
  $('#fab', v).onclick = () => chatEl.classList.toggle('open');
  const topic = () => allTopics(set).find((t) => t.id === st.topic);
  const persist = () => save('sets', set);

  const drawLeft = () => {
    const ts = allTopics(set);
    const stats = ts.map((t) => topicStats(t).status);
    const cnt = { all: ts.length, review: stats.filter((s) => s === 'review').length, mastered: stats.filter((s) => s === 'mastered').length, new: stats.filter((s) => s === 'new').length };
    left.innerHTML = `<div class="row between"><a class="back" href="#/study">${ic('left')} Atrás</a><div class="row" style="gap:2px"><button class="icon-btn" id="ren" title="Renombrar">${ic('edit')}</button><button class="icon-btn" id="del" title="Borrar set">${ic('trash')}</button></div></div>
      <h1>${esc(set.emoji || '')} ${esc(set.title)}</h1>
      <div class="tabs"><button class="${st.left === 'topics' ? 'on' : ''}" data-l="topics">Temas</button><button class="${st.left === 'sources' ? 'on' : ''}" data-l="sources">Fuentes</button></div>
      ${st.left === 'topics' ? `<div class="filters">${[['all', 'Todos'], ['review', 'A repasar'], ['mastered', 'Dominados'], ['new', 'Sin empezar']].map(([k, l]) => `<button class="${st.filter === k ? 'on' : ''}" data-f="${k}">${l}<span class="count">${cnt[k]}</span></button>`).join('')}</div>
      <button class="side-item ${st.view === 'overview' ? 'on' : ''}" data-v="overview">${ic('layers')} Resumen general</button>
      <button class="side-item ${st.view === 'mock' ? 'on' : ''}" data-v="mock">${ic('target')} Simulacro de examen</button>
      <button class="side-item ${st.view === 'cheat' ? 'on' : ''}" data-v="cheat">${ic('cheat')} Chuleta</button>
      ${(set.docs || []).map((d) => `<button class="side-item ${st.view === 'doc' && st.doc === d.id ? 'on' : ''}" data-doc="${d.id}">${ic('zap')} <span class="grow" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(d.title)}</span></button>`).join('')}
      ${set.sections.map((sec, si) => { const vis = sec.topics.filter((t) => st.filter === 'all' || topicStats(t).status === st.filter); if (!vis.length) return ''; return `<button class="sec-h ${st.closed[sec.id] ? 'closed' : ''}" data-sec="${sec.id}"><span class="grow">Sección ${si + 1}: ${esc(sec.title)}</span>${ic('down')}</button>${st.closed[sec.id] ? '' : vis.map((t) => { const s = topicStats(t).status; return `<button class="topic ${st.view !== 'overview' && st.view !== 'mock' && st.view !== 'cheat' && st.topic === t.id ? 'on' : ''}" data-t="${t.id}"><span class="dot ${s}"></span><span class="grow">${esc(t.title)}</span></button>`; }).join('')}`; }).join('')}`
      : `<div class="sources-grid">${set.sources.map((s) => `<button class="src-thumb" data-src="${s.id}">${s.kind === 'image' ? `<img src="${srcThumb(s)}" alt="">` : `<span class="ph">${ic(s.kind === 'pdf' ? 'file' : 'text')}</span>`}<div>${esc(s.name)}</div></button>`).join('')}</div>${!set.sources.length ? '<p class="muted">Sin fuentes.</p>' : ''}`}`;
    $$('[data-l]', left).forEach((b) => (b.onclick = () => { st.left = b.dataset.l; drawLeft(); }));
    $$('[data-f]', left).forEach((b) => (b.onclick = () => { st.filter = b.dataset.f; drawLeft(); }));
    $$('[data-v]', left).forEach((b) => (b.onclick = () => { st.view = b.dataset.v; drawAll(); }));
    $$('[data-doc]', left).forEach((b) => (b.onclick = () => { st.view = 'doc'; st.doc = b.dataset.doc; drawAll(); }));
    $$('[data-t]', left).forEach((b) => (b.onclick = () => { st.view = 'topic'; st.topic = b.dataset.t; st.open = false; drawAll(); if (innerWidth < 820) center.scrollIntoView({ behavior: 'smooth' }); }));
    $$('[data-sec]', left).forEach((b) => (b.onclick = () => { st.closed[b.dataset.sec] = !st.closed[b.dataset.sec]; drawLeft(); }));
    $$('[data-src]', left).forEach((b) => (b.onclick = () => { const s = set.sources.find((x) => x.id === b.dataset.src); if (s.kind === 'image') openModal(`<img src="${srcThumb(s)}" style="width:100%;border-radius:14px" alt="">`, { cls: 'wide' }); else if (s.kind === 'text') openModal(`<h2>${esc(s.name)}</h2><div class="md" style="white-space:pre-wrap">${esc(s.data)}</div>`, { cls: 'mid' }); else toast('PDF guardado como fuente'); }));
    $('#ren', left).onclick = () => { const n = prompt('Nuevo nombre del set', set.title); if (n && n.trim()) { set.title = n.trim(); const sb = prompt('Materia', set.subject); if (sb && sb.trim()) set.subject = sb.trim(); persist(); drawLeft(); } };
    $('#del', left).onclick = async () => { if (await confirmBox(`Se borrará «${set.title}» con todo su contenido.`)) { await remove('sets', set.id); go('/study'); } };
  };

  const busyBtn = (b, label = 'Generando…') => { b.disabled = true; b.innerHTML = `<span class="spin"></span> ${label}`; };
  const drawCenter = () => {
    Speech.stop();
    const t = topic();
    if (st.view === 'overview') {
      const c = setCounts(set);
      center.innerHTML = `<div class="topic-head"><div class="grow"><span class="pill" style="background:${set.color}22;color:${set.color};margin-bottom:12px">${esc(set.subject)}</span><h2>${esc(set.emoji || '')} ${esc(set.title)}</h2><p class="muted">${c.topics} temas · ${c.cards} flashcards · ${c.quiz} preguntas</p></div>${ring(setMastery(set))}</div>
        <div class="guide-box"><div class="md">${md(set.overview)}</div></div>
        <h2 style="font-size:24px;margin-bottom:16px">Aprende a tu manera</h2>
        <div class="practice">
          <div class="pcard"><h3>${ic('head')} Podcast</h3><p class="muted" style="margin:0">Dos voces te explican el set mientras vas en el bus.</p><button class="btn btn-primary" id="pod">${set.podcast ? 'Escuchar' : 'Crear podcast'}</button></div>
          <div class="pcard"><h3>${ic('board')} Clase en pizarra</h3><p class="muted" style="margin:0">Explicación animada paso a paso con voz.</p><button class="btn btn-primary" id="brd">${set.boards && set.boards.all ? 'Ver clase' : 'Crear clase'}</button></div>
          <div class="pcard"><h3>${ic('target')} Simulacro</h3><p class="muted" style="margin:0">Examen de prueba con todos los temas.</p><button class="btn btn-ghost" data-go="mock">Ir al simulacro</button></div>
          <div class="pcard"><h3>${ic('exam')} Plan de examen</h3><p class="muted" style="margin:0">¿Tienes examen de esto? Predicción de temas y plan diario.</p><button class="btn btn-ghost" id="toexam">Crear plan</button></div>
        </div>`;
      $('#pod', center).onclick = async (e) => {
        if (!set.podcast) { busyBtn(e.currentTarget); try { set.podcast = await genPodcast(setText(set)); await persist(); } catch (err) { toast(err.message, true); } drawCenter(); }

    case 'improve': return `Mejora la redacción de este texto (claridad, fluidez, vocabulario, conectores) sin cambiar el significado ni el idioma. Nivel: ${opt || 'el del autor'}. Devuelve el texto mejorado y después "### Qué he mejorado" con 3-5 puntos para aprender.\n\nTEXTO:\n${text}`;
    case 'paraphrase': return `Parafrasea este texto con estilo ${opt || 'estándar'}, en el mismo idioma, conservando todas las ideas. Devuelve solo la paráfrasis.\n\nTEXTO:\n${text}`;

    case 'explain': return `Explícame este texto de forma sencilla: idea principal, explicación párrafo a párrafo, vocabulario difícil (con definición) y 3 preguntas para comprobar que lo he entendido.\n\nTEXTO:\n${text}`;

const WRITING_OPTS = { improve: ['Mi nivel', 'Más formal', 'Académico'], paraphrase: ['Estándar', 'Formal', 'Sencillo', 'Creativo'], summary: ['Párrafo + puntos', 'Solo puntos', 'Una frase'], cite: ['APA 7', 'MLA 9', 'Chicago', 'Harvard', 'ISO 690'] };

/* =================== slash assist (/skill autocomplete) =================== */
function slashAssist(input, onChange) {
  if (!input || input._slash) return; input._slash = true;
  let box = null, items = [], idx = 0, frag = null;
  const close = () => { if (box) { box.remove(); box = null; } frag = null; };
  const caretWord = () => {
    const pos = input.selectionStart ?? input.value.length;
    const before = input.value.slice(0, pos);
    const m = /(^|\s)\/([a-z0-9-]*)$/i.exec(before);
    return m ? { start: pos - m[2].length - 1, end: pos, q: m[2].toLowerCase() } : null;
  };
  const pick = (s) => {
    if (!frag) return;
    if (!s) { close(); go('/skills?new=1'); return; }
    const v = input.value;
    input.value = v.slice(0, frag.start) + '/' + s.slug + ' ' + v.slice(frag.end);
    const p = frag.start + s.slug.length + 2; input.setSelectionRange(p, p);
    close(); input.dispatchEvent(new Event('input', { bubbles: true })); input.focus();
  };
  const render = () => {
    frag = caretWord();
    if (!frag) return close();
    const nq = frag.q;
    items = ST.skills.filter((s) => !nq || s.slug.includes(nq) || s.name.toLowerCase().includes(nq)).sort((a, b) => (b.uses || 0) - (a.uses || 0)).slice(0, 8);
    idx = Math.min(idx, Math.max(0, items.length - 1));
    if (!box) { box = document.createElement('div'); box.className = 'slash'; document.body.appendChild(box); }
    const r = input.getBoundingClientRect();
    const up = r.bottom + 310 > innerHeight;
    box.style.left = Math.max(8, Math.min(r.left, innerWidth - 430)) + 'px';
    box.style.top = up ? '' : r.bottom + 6 + 'px';
    box.style.bottom = up ? innerHeight - r.top + 6 + 'px' : '';
    box.innerHTML = `<div class="head">Skills</div>${items.length ? items.map((s, k) => `<button class="it ${k === idx ? 'on' : ''}" data-k="${k}"><span class="sk-ico">${esc(s.emoji || '✨')}</span><span class="grow"><b>/${esc(s.slug)}</b><small>${esc(s.description || s.name)}</small></span></button>`).join('') : ''}<button class="it" data-new><span class="sk-ico" style="background:var(--card3);color:var(--text)">${ic('plus')}</span><span class="grow"><b>Crear skill</b><small>Enséñale a ${APP_NAME} cómo quieres las cosas</small></span></button>`;
    $$('[data-k]', box).forEach((b) => b.addEventListener('mousedown', (e) => { e.preventDefault(); pick(items[+b.dataset.k]); }));
    $('[data-new]', box).addEventListener('mousedown', (e) => { e.preventDefault(); pick(null); });
  };
  input.addEventListener('input', () => { render(); onChange && onChange(); });
  input.addEventListener('blur', () => setTimeout(close, 120));
  (input.parentElement || input).addEventListener('keydown', (e) => {
    if (!box || e.target !== input) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); e.stopImmediatePropagation(); idx = (idx + (e.key === 'ArrowDown' ? 1 : -1) + Math.max(1, items.length)) % Math.max(1, items.length); render(); }
    else if ((e.key === 'Enter' || e.key === 'Tab') && items.length) { e.preventDefault(); e.stopImmediatePropagation(); pick(items[idx]); }
    else if (e.key === 'Escape') { e.stopImmediatePropagation(); close(); }
  }, true);
}

function openInk(onUse) {

  const strokes = []; let cur = null;
  const m = openModal(`<h2>Escribe a mano</h2><p class="lead">Con Apple Pencil, el dedo o el ratón. Luego lo resuelvo o lo uso como apunte.</p>

    <div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-primary" id="kuse">${ic('check')} Usar</button></div>`, { cls: 'wide' });
  const cv = $('#ink', m.el), ctx = cv.getContext('2d');

    for (let k = 1; k < s.pts.length; k++) { const a = s.pts[k - 1], b = s.pts[k]; ctx.lineWidth = s.eraser ? 22 : s.width * (0.45 + (b.p || 0.5)); ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
    ctx.globalCompositeOperation = 'source-over';

  const redraw = () => { ctx.clearRect(0, 0, cv.width, cv.height); strokes.forEach(drawStroke); };

  cv.addEventListener('pointerdown', (e) => { e.preventDefault(); cv.setPointerCapture(e.pointerId); cur = { color, width, eraser: eraser || e.button === 5, pts: [pt(e)] }; strokes.push(cur); });

  const end = () => { cur = null; };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
  $$('[data-c]', m.el).forEach((b) => (b.onclick = () => { color = b.dataset.c; eraser = false; $$('[data-c]', m.el).forEach((x) => x.classList.toggle('on', x === b)); $('#kpen', m.el).classList.add('on'); $('#kera', m.el).classList.remove('on'); }));
  $('#kpen', m.el).onclick = () => { eraser = false; $('#kpen', m.el).classList.add('on'); $('#kera', m.el).classList.remove('on'); };
  $('#kera', m.el).onclick = () => { eraser = true; $('#kera', m.el).classList.add('on'); $('#kpen', m.el).classList.remove('on'); };
  $('#kpen', m.el).classList.add('on');
  $('#kundo', m.el).onclick = () => { strokes.pop(); redraw(); };
  $('#kclr', m.el).onclick = () => { strokes.length = 0; redraw(); };
  $('#kuse', m.el).onclick = () => {
    if (!strokes.length) return toast('Escribe algo primero', true);
    const out = document.createElement('canvas'); out.width = cv.width; out.height = cv.height;
    const o = out.getContext('2d'); o.fillStyle = '#fff'; o.fillRect(0, 0, out.width, out.height); o.drawImage(cv, 0, 0);

}

/* =================== background jobs (automations) =================== */
const Jobs = {
  list: [], running: false, el: null, min: false,
  add(label, fn) { this.list.push({ id: uid(), label, fn, st: 'wait' }); this.paint(); this.run(); },
  async run() {
    if (this.running) return; this.running = true;
    let j;
    while ((j = this.list.find((x) => x.st === 'wait'))) {
      j.st = 'run'; this.paint();
      try { await j.fn(); j.st = 'ok'; } catch (e) { j.st = 'err'; j.err = e.message; console.warn('auto', e); }
      this.paint();
    }
    this.running = false;
    setTimeout(() => { if (!this.running && this.list.every((x) => x.st !== 'wait' && x.st !== 'run')) { this.list = []; this.paint(); } }, 7000);
  },
  paint() {
    if (!this.list.length) { this.el && this.el.remove(); this.el = null; return; }
    if (!this.el) { this.el = document.createElement('div'); this.el.className = 'jobs no-print'; document.body.appendChild(this.el); }
    const done = this.list.filter((x) => x.st === 'ok' || x.st === 'err').length;
    const busy = this.list.some((x) => x.st === 'run');
    this.el.classList.toggle('min', this.min);
    this.el.innerHTML = `<div class="jobs-head">${busy ? '<span class="spin" style="color:var(--accent2)"></span>' : `<span style="color:var(--good)">${ic('check')}</span>`}<span class="grow">${busy ? 'Automatizando…' : 'Automatizaciones hechas'} ${done}/${this.list.length}</span>${ic(this.min ? 'right' : 'down')}</div><div class="jobs-list">${this.list.map((x) => `<div class="job ${x.st}" title="${esc(x.err || '')}"><span class="st">${x.st === 'run' ? '<span class="spin" style="width:14px;height:14px"></span>' : x.st === 'ok' ? ic('check') : x.st === 'err' ? ic('x') : ic('clock')}</span><span class="grow">${esc(x.label)}</span></div>`).join('')}</div>`;
    $('.jobs-head', this.el).onclick = () => { this.min = !this.min; this.paint(); };
  },
};

      const out = await ai({ system: SYS(), max_tokens: 8000, skills: skill ? [skill] : [], messages: [{ role: 'user', content: [...sourcesBlocks(set.sources, true), { type: 'text', text: `${setText(set, t)}\n\n${t ? `(El estudiante ha sacado un ${ctx.pct}% en "${t.title}".)\n` : ''}${act.prompt || 'Aplica la skill a este material.'}` }] }] });

function checkDaily() {
  const now = new Date(), hm = now.toTimeString().slice(0, 5), t = todayISO();
  for (const a of ST.automations) {
    if (!a.enabled || a.trigger.type !== 'daily') continue;

  }
}

function heatHTML() {
  const a = activity(); const days = 16 * 7;
  const start = parseISO(todayISO()); start.setDate(start.getDate() - days + 1);
  const off = (start.getDay() + 6) % 7; start.setDate(start.getDate() - off);
  let html = '';
  for (let k = 0; k < days + off; k++) { const d = new Date(start); d.setDate(d.getDate() + k); const s = isoDate(d); const n = a[s] || 0; const l = n === 0 ? '' : n < 5 ? 'l1' : n < 15 ? 'l2' : n < 30 ? 'l3' : 'l4'; html += `<i class="${l}" title="${fmtDate(s)}: ${n} repasos"></i>`; }
  return html;
}

  const t = TRIGGERS[a.trigger.type];
  const cond = a.trigger.type === 'daily' ? ` a las ${a.trigger.time || '08:00'}` : a.trigger.type === 'quiz_low' ? ` (<${a.trigger.threshold || 60}%)` : '';
  return `<div class="flow"><span class="tr">${ic(t.icon)} ${t.label}${cond}${a.trigger.subject ? ` · ${esc(a.trigger.subject)}` : ''}</span>${ic('right')}${a.actions.map((x) => `<span class="ac">${ic((ACTIONS[x.type] || {}).icon || 'zap')} ${esc(actionLabel(x))}</span>`).join('')}</div>`;
}
function autoForm(auto, tpl) {
  const isNew = !auto;
  const a = auto ? JSON.parse(JSON.stringify(auto)) : { id: uid(), name: '', enabled: true, createdAt: Date.now(), runs: [], ...(tpl ? JSON.parse(JSON.stringify(tpl)) : { trigger: { type: 'upload', subject: '' }, actions: [{ type: 'flashcards' }] }) };
  const m = openModal(`<h2>${isNew ? 'Nueva automatización' : 'Editar automatización'}</h2><p class="lead">Elige cuándo se activa y qué hace. Se ejecuta sola en segundo plano.</p>
    ${isNew ? `<div class="tpl-row">${AUTO_TEMPLATES.map((t, k) => `<button class="tpl" data-tp="${k}"><b>${esc(t.name)}</b><small>${TRIGGERS[t.trigger.type].label}</small></button>`).join('')}</div>` : ''}
    <label class="lbl">Nombre</label><input class="inp" id="an" value="${esc(a.name)}" placeholder="Ej: Pack de mates">
    <label class="lbl">Cuando…</label><div class="trig-grid" id="atr"></div><div id="acond"></div>
    <label class="lbl">Haz esto…</label><div id="aacts"></div><button class="btn btn-soft btn-sm" id="aadd">${ic('plus')} Añadir acción</button>
    <div class="row" style="justify-content:flex-end;margin-top:24px"><button class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-primary" id="asave">${ic('check')} Guardar</button></div>`, { cls: 'mid' });
  const el = m.el;
  const subjList = `<datalist id="asubj">${subjectsList().map((s) => `<option value="${esc(s)}">`).join('')}</datalist>`;
  const paint = () => {
    $('#atr', el).innerHTML = Object.entries(TRIGGERS).map(([k, t]) => `<button class="trig ${a.trigger.type === k ? 'on' : ''}" data-t="${k}"><span class="src-ico" style="width:40px;height:40px;background:${a.trigger.type === k ? 'var(--grad)' : 'var(--card3)'}">${ic(t.icon)}</span><span><b>${t.label}</b><small>${t.desc}</small></span></button>`).join('');
    const ty = a.trigger.type;
    $('#acond', el).innerHTML = `<div class="row wrap" style="margin-top:12px;gap:12px">${ty !== 'daily' ? `<div class="grow"><label class="lbl" style="margin-top:0">Solo para la materia (opcional)</label><input class="inp" id="asub" list="asubj" value="${esc(a.trigger.subject || '')}" placeholder="Todas">${subjList}</div>` : ''}${ty === 'quiz_low' ? `<div style="width:170px"><label class="lbl" style="margin-top:0">Nota por debajo de</label><input class="inp" type="number" id="ath" min="10" max="100" value="${a.trigger.threshold || 60}"></div>` : ''}${ty === 'daily' ? `<div style="width:170px"><label class="lbl" style="margin-top:0">Hora</label><input class="inp" type="time" id="atime" value="${a.trigger.time || '08:00'}"></div><p class="hint grow">Se ejecuta cuando abres ${APP_NAME} a partir de esa hora (una vez al día).</p>` : ''}</div>`;
    const valid = Object.entries(ACTIONS).filter(([, d]) => d.on.includes(ty));
    a.actions = a.actions.filter((x) => ACTIONS[x.type] && ACTIONS[x.type].on.includes(ty));
    if (!a.actions.length) a.actions.push({ type: valid[0][0] });
    $('#aacts', el).innerHTML = a.actions.map((x, k) => { const d = ACTIONS[x.type]; return `<div class="act-row" data-k="${k}"><span class="num">${k + 1}</span><select class="inp" data-f="type">${valid.map(([v, dd]) => `<option value="${v}" ${v === x.type ? 'selected' : ''}>${dd.label}</option>`).join('')}</select>${d.days ? `<input class="inp" type="number" min="1" max="60" data-f="days" value="${x.days || 7}" style="max-width:110px" title="Días"><span class="muted">días</span>` : ''}${d.skill ? `<select class="inp" data-f="skillId"><option value="">Elige skill…</option>${ST.skills.map((s) => `<option value="${s.id}" ${s.id === x.skillId ? 'selected' : ''}>/${esc(s.slug)}</option>`).join('')}</select>` : ''}<button class="icon-btn" data-del="${k}" title="Quitar">${ic('x')}</button>${d.prompt ? `<textarea class="inp" rows="2" data-f="prompt" placeholder="${d.skill ? 'Qué hacer con la skill. Ej: Hazme 5 ejercicios como estos' : 'Ej: Hazme un resumen en 10 puntos y una lista de fechas importantes'}">${esc(x.prompt || '')}</textarea>` : ''}${d.text ? `<input class="inp" data-f="text" value="${esc(x.text || '')}" placeholder="Mensaje. Puedes usar {titulo} y {materia}" style="flex-basis:100%">` : ''}</div>`; }).join('');
    $$('[data-t]', el).forEach((b) => (b.onclick = () => { collect(); a.trigger.type = b.dataset.t; paint(); }));
    $$('#aacts [data-f]', el).forEach((inp) => (inp.onchange = () => { collect(); if (inp.dataset.f === 'type') paint(); }));
    $$('[data-del]', el).forEach((b) => (b.onclick = () => { collect(); a.actions.splice(+b.dataset.del, 1); paint(); }));
  };
  const collect = () => {
    a.name = $('#an', el).value.trim();
    const sub = $('#asub', el); if (sub) a.trigger.subject = sub.value.trim();
    const th = $('#ath', el); if (th) a.trigger.threshold = clamp(+th.value || 60, 1, 100);
    const tm = $('#atime', el); if (tm) a.trigger.time = tm.value || '08:00';
    $$('.act-row', el).forEach((row) => { const x = a.actions[+row.dataset.k]; if (!x) return; $$('[data-f]', row).forEach((inp) => { x[inp.dataset.f] = inp.dataset.f === 'days' ? +inp.value : inp.value; }); });
  };
  $('#aadd', el).onclick = () => { collect(); const valid = Object.entries(ACTIONS).filter(([, d]) => d.on.includes(a.trigger.type)); a.actions.push({ type: valid[Math.min(a.actions.length, valid.length - 1)][0] }); paint(); };
  $$('[data-tp]', el).forEach((b) => (b.onclick = () => { const t = JSON.parse(JSON.stringify(AUTO_TEMPLATES[+b.dataset.tp])); a.trigger = t.trigger; a.actions = t.actions; $('#an', el).value = t.name; paint(); }));
  $('#asave', el).onclick = async () => {
    collect();
    if (!a.name) a.name = TRIGGERS[a.trigger.type].label + ' → ' + actionLabel(a.actions[0]);
    if (a.actions.some((x) => x.type === 'skill' && !x.skillId)) return toast('Elige qué skill aplicar', true);
    await save('automations', a); m.close(); toast(isNew ? 'Automatización creada' : 'Guardada'); route();
  };
  paint();
}
function pageAutomations(v) {
  const list = [...ST.automations].sort((a, b) => b.createdAt - a.createdAt);
  v.innerHTML = `<div class="page narrow">
    <div class="hero"><div class="grow"><h1>Automatizaciones<span>Que se haga solo.</span></h1><p>«Cada vez que subo apuntes de Mates, créame flashcards y 5 ejercicios con mi skill». Elige el momento y las acciones, y ${APP_NAME} lo hace en segundo plano.</p></div><button class="btn btn-primary btn-lg" id="anew">${ic('plus')} Nueva automatización</button></div>
    ${list.length ? list.map((a) => `<div class="card auto-card" style="margin-bottom:14px"><button class="switch ${a.enabled ? 'on' : ''}" data-sw="${a.id}" aria-label="Activar"></button><div class="grow"><h3>${esc(a.name)}</h3>${autoFlowHTML(a)}<div class="runs">${a.runs && a.runs.length ? `Última vez ${timeAgo(a.runs[0].at)} · ${a.runs[0].ok ? 'bien' : 'error: ' + esc(a.runs[0].msg)}` : 'Aún no se ha ejecutado'}</div></div><div class="row" style="gap:4px">${a.trigger.type !== 'exam_added' ? `<button class="btn btn-ghost btn-sm" data-try="${a.id}" title="Probar ahora">${ic('play')} Probar</button>` : ''}<button class="icon-btn" data-ed="${a.id}">${ic('edit')}</button><button class="icon-btn" data-dl="${a.id}">${ic('trash')}</button></div></div>`).join('')
    : `<h2 class="sec-title" style="margin-top:0">Ideas para empezar</h2><div class="sk-grid">${AUTO_TEMPLATES.map((t, k) => `<button class="card sk-card spot" data-tp="${k}" style="text-align:left"><h3 style="font-size:18px">${esc(t.name)}</h3>${autoFlowHTML({ ...t, actions: t.actions })}</button>`).join('')}</div>`}</div>`;
  $('#anew', v).onclick = () => autoForm();
  $$('[data-tp]', v).forEach((b) => (b.onclick = () => autoForm(null, AUTO_TEMPLATES[+b.dataset.tp])));
  $$('[data-sw]', v).forEach((b) => (b.onclick = async () => { const a = byId('automations', b.dataset.sw); a.enabled = !a.enabled; await save('automations', a); b.classList.toggle('on', a.enabled); }));
  $$('[data-ed]', v).forEach((b) => (b.onclick = () => autoForm(byId('automations', b.dataset.ed))));
  $$('[data-dl]', v).forEach((b) => (b.onclick = async () => { if (await confirmBox('Se borrará esta automatización.')) { await remove('automations', b.dataset.dl); route(); } }));
  $$('[data-try]', v).forEach((b) => (b.onclick = () => {
    const a = byId('automations', b.dataset.try);
    const set = [...ST.sets].sort((x, y) => (y.lastOpenedAt || 0) - (x.lastOpenedAt || 0)).find((s) => !a.trigger.subject || s.subject.toLowerCase() === a.trigger.subject.toLowerCase());
    if (a.trigger.type !== 'daily' && !set) return toast('Necesitas al menos un set de estudio para probarla', true);
    const ctx = { set, topic: set && allTopics(set)[0], pct: 0 };
    a.actions.forEach((act) => Jobs.add(actionLabel(act) + (set ? ' · ' + set.title : ''), async () => { try { await execAction(act, ctx, a); logRun(a, true, actionLabel(act)); } catch (e) { logRun(a, false, e.message); throw e; } }));
  }));
}

/* =================== ⌘K command palette =================== */
function norm(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
function openPalette() {
  if ($('.pal')) return;
  const base = [
    ...NAV.map(([h, i, l]) => ({ sec: 'Ir a', icon: ic(i), label: l, run: () => go(h) })),
    { sec: 'Acciones', icon: ic('solver'), label: 'Resolver un problema', run: () => go('/?tool=solver') },
    { sec: 'Acciones', icon: ic('plus'), label: 'Nuevo set de estudio', run: () => createSetFlow({}) },
    { sec: 'Acciones', icon: ic('exam'), label: 'Nueva predicción de examen', run: () => newExamFlow({}) },
    { sec: 'Acciones', icon: ic('slash'), label: 'Nueva skill', run: () => skillForm() },
    { sec: 'Acciones', icon: ic('zap'), label: 'Nueva automatización', run: () => autoForm() },
    { sec: 'Acciones', icon: ic('draw'), label: 'Escribir a mano y resolver', run: () => openInk(async (s) => { const h = { id: uid(), kind: 'solve', question: '', sources: [s], answer: '', chat: [], skillIds: [], createdAt: Date.now() }; await save('history', h); go('/solve/' + h.id); }) },
    { sec: 'Acciones', icon: ic(SETTINGS.theme === 'dark' ? 'sun' : 'moon'), label: 'Cambiar tema claro/oscuro', run: () => $('#sbtheme').click() },
    { sec: 'Acciones', icon: ic('sliders'), label: 'Ajustes', run: () => openSettings() },
    ...ST.sets.map((s) => ({ sec: 'Sets', icon: esc(s.emoji || '📘'), label: s.title, hint: s.subject, run: () => go('/set/' + s.id) })),
    ...ST.exams.map((e) => ({ sec: 'Exámenes', icon: ic('exam'), label: e.title, hint: fmtDate(e.date), run: () => go('/exam/' + e.id) })),
    ...ST.skills.map((s) => ({ sec: 'Skills', icon: esc(s.emoji || '✨'), label: `/${s.slug} · ${s.name}`, hint: 'Usar en el Solver', run: () => go(`/?tool=solver&skill=${encodeURIComponent(s.slug)}`) })),
  ];
  const m = openModal(`<div class="pal-in">${ic('search')}<input id="pq" placeholder="Busca sets, exámenes, skills o acciones…" autocomplete="off"><kbd>esc</kbd></div><div class="pal-list" id="pl"></div><div class="pal-foot"><span><kbd>↑</kbd> <kbd>↓</kbd> moverte</span><span><kbd>↵</kbd> abrir</span><span><kbd>⌘</kbd> <kbd>K</kbd> abrir/cerrar</span></div>`, { cls: 'pal', closable: true });
  m.el.parentElement.classList.add('pal-ov');
  $('.x', m.el)?.remove();
  let res = [], idx = 0;
  const paint = () => {
    const q = norm($('#pq', m.el).value.trim());
    res = (q ? base.filter((x) => norm(x.label + ' ' + (x.hint || '') + ' ' + x.sec).includes(q)) : base.filter((x) => x.sec !== 'Sets' || true).slice(0, 40)).slice(0, 60);
    idx = Math.min(idx, Math.max(0, res.length - 1));
    let last = '';
    $('#pl', m.el).innerHTML = res.length ? res.map((x, k) => { const head = x.sec !== last ? `<div class="pal-sec">${x.sec}</div>` : ''; last = x.sec; return `${head}<button class="pal-it ${k === idx ? 'on' : ''}" data-k="${k}"><span class="pi">${x.icon}</span><span class="grow" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(x.label)}</span>${x.hint ? `<small>${esc(x.hint)}</small>` : ''}</button>`; }).join('') : '<p class="empty">Sin resultados</p>';
    $$('[data-k]', m.el).forEach((b) => { b.onclick = () => { m.close(); res[+b.dataset.k].run(); }; b.onmousemove = () => { if (idx !== +b.dataset.k) { idx = +b.dataset.k; $$('.pal-it', m.el).forEach((x) => x.classList.toggle('on', +x.dataset.k === idx)); } }; });
    $('.pal-it.on', m.el)?.scrollIntoView({ block: 'nearest' });
  };
  const inp = $('#pq', m.el);
  inp.oninput = () => { idx = 0; paint(); };
  inp.onkeydown = (e) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); idx = Math.min(res.length - 1, idx + 1); paint(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); idx = Math.max(0, idx - 1); paint(); }
    else if (e.key === 'Enter' && res[idx]) { e.preventDefault(); const r = res[idx]; m.close(); r.run(); }
  };
  paint(); setTimeout(() => inp.focus(), 30);
}

/* =================== mobile "más" sheet =================== */
function openMore() {
  const items = [['/notes', 'mic', 'Apuntes en vivo'], ['/writing', 'pen', 'Escritura IA'], ['/calendar', 'cal', 'Calendario'], ['/skills', 'slash', 'Skills'], ['/automations', 'zap', 'Automatizaciones'], ['/review', 'repeat', 'Repaso diario']];
  const m = openModal(`<div style="width:42px;height:5px;border-radius:9px;background:var(--line2);margin:0 auto 12px"></div><div class="sheet-grid">${items.map(([h, i, l]) => `<a href="#${h}">${ic(i)}${l}</a>`).join('')}<button id="msearch">${ic('search')}Buscar</button><button id="mset2">${ic('sliders')}Ajustes</button></div>`, { cls: 'sheet', closable: true });
  m.el.parentElement.classList.add('sheet-ov'); $('.x', m.el)?.remove();
  $$('a', m.el).forEach((a) => a.addEventListener('click', () => m.close()));
  $('#msearch', m.el).onclick = () => { m.close(); openPalette(); };
  $('#mset2', m.el).onclick = () => { m.close(); openSettings(); };
}
</script>
