/* =========================================================
   NEW: source menu, Deberes, Mochila, Automations (blocks), alerts
   ========================================================= */
:root{--good:#2fb86b;--warn:#f2902d;--bad:#e5484d;--good-soft:rgba(47,184,107,.16);--warn-soft:rgba(242,144,45,.16);--bad-soft:rgba(229,72,77,.16)}
.ev.read{background:rgba(160,108,245,.18);color:#a98bff}.ev.study{background:rgba(47,168,245,.16);color:#4db3f5}
:root[data-theme="light"] .ev.read{color:#7c3aed}:root[data-theme="light"] .ev.study{color:#0a7bc4}

/* ---------- "Crear desde" menu ---------- */
.sbox .src-tabs{grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 16px}
.sbox .src-tabs.n2{grid-template-columns:repeat(2,1fr)}.sbox .src-tabs.n4{grid-template-columns:repeat(4,1fr)}
.sbox .src-tabs.n5{grid-template-columns:repeat(5,1fr)}.sbox .src-tabs.n6{grid-template-columns:repeat(6,1fr)}
.sbox .src-tab{padding:13px 6px;font-size:14.5px;gap:8px;border-radius:12px}
.sbox .src-ico{width:34px;height:34px;border-radius:10px}
.sbox .src-ico svg{width:19px;height:19px}
.sbody{position:relative;min-height:60px}
.sbody.busy>*:not(.busy-msg){opacity:.35;pointer-events:none}
.busy-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:600;color:var(--accent2);text-align:center;padding:10px}
.busy-msg:empty{display:none}
.sbody .drop.left{text-align:left;padding:22px 24px}
.sbody .drop.left h3{margin:12px 0 4px}
.sbody textarea.inp{border-radius:16px;padding:16px;font-size:16px}
.link-row{display:flex;gap:10px;align-items:center;margin-top:14px}
.link-row .li{color:var(--muted);display:grid;place-items:center}
.link-row .inp{flex:1}
details.alt{margin-top:16px;border-top:1px solid var(--line2);padding-top:12px}
details.alt summary{cursor:pointer;color:var(--accent2);font-weight:600;font-size:14.5px}
details.alt .inp{margin-top:8px}
.sbox-hint{display:flex;align-items:center;gap:6px;font-size:13px;margin-top:8px}
.sbox-hint svg{width:15px;height:15px}
.custom-inp{margin-top:16px;border-radius:20px;padding:16px 18px;font-size:16px;color:var(--accent2)}
.frames{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.frames figure{margin:0;border-radius:12px;overflow:hidden;background:var(--card2)}
.frames img{width:100%;display:block}.frames figcaption{padding:5px 8px;font-size:12.5px;color:var(--muted)}
.drop.quick{padding:22px 14px;margin-bottom:8px}
.drop.quick h3{font-size:17px;margin:0 0 4px}
.drop.drag{outline:2px dashed var(--accent);outline-offset:-8px}

/* ---------- bell + alerts ---------- */
.bell{position:relative}
.bell-dot{position:absolute;top:2px;right:2px;min-width:17px;height:17px;border-radius:99px;background:var(--bad);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px;line-height:1}
.alert-list{display:flex;flex-direction:column;gap:8px;max-height:60vh;overflow:auto}
.al{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--card2);border:1px solid var(--line)}
.al.read{opacity:.7}
.al-ico{width:36px;height:36px;border-radius:11px;background:var(--accent-soft);color:var(--accent2);display:grid;place-items:center;flex:none}
.al-ico svg{width:19px;height:19px}
.al b{font-size:15px}.al .muted{font-size:13.5px}.al small{font-size:12px}
.sidebar .sb-bottom{gap:6px}

/* ---------- callouts, steps ---------- */
.callout{display:flex;align-items:flex-start;gap:14px;padding:14px 18px;border-radius:18px;background:var(--accent-soft);border:1px solid var(--accent-soft2);margin-bottom:18px;flex-wrap:wrap}
.callout.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.callout .ci{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--accent2);flex:none}
.callout.warn .ci{background:color-mix(in srgb,var(--warn) 25%,transparent);color:var(--warn)}
.callout .md p:last-child{margin-bottom:0}.callout .md{font-size:15.5px}
.try-box{border:1px solid var(--line2);border-radius:20px;padding:18px 20px;background:var(--card);margin-bottom:6px}
.steps{display:flex;flex-direction:column;gap:10px}
.stepc{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border-radius:18px;background:var(--card);border:1px solid var(--line2);animation:pop .25s var(--ease)}
.stepc .sn{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13.5px;flex:none;margin-top:2px}
.stepc .md{font-size:16px}.stepc .md p:last-child{margin-bottom:0}
.step-act{display:flex;flex-direction:column;gap:6px;align-items:flex-end;flex:none}
.answer-box{margin-top:16px;padding:16px 20px;border-radius:18px;background:var(--good-soft);border:1px solid color-mix(in srgb,var(--good) 40%,transparent)}
.answer-box b{color:var(--good);display:block;margin-bottom:6px}
.done-toggle{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:99px;border:1px solid var(--line2);cursor:pointer;font-weight:600;font-size:14.5px;white-space:nowrap;color:var(--text2);flex:none}
.done-toggle input{display:none}.done-toggle svg{width:17px;height:17px;opacity:.4}
.done-toggle.on{background:var(--good-soft);border-color:var(--good);color:var(--good)}.done-toggle.on svg{opacity:1}
.reading p{font-size:18px;line-height:2}
.sent{cursor:pointer;border-radius:6px;padding:2px 0;transition:background .15s}
.sent:hover{background:var(--accent-soft)}.sent.now{background:var(--accent-soft2);color:var(--text)}
.vocab{display:flex;flex-direction:column;gap:8px}
.vrow{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.vex{color:var(--text2);font-size:14.5px;margin-top:4px;display:flex;align-items:center;gap:6px}
.icon-btn.sm{width:28px;height:28px}.icon-btn.sm svg{width:15px;height:15px}
.col{display:flex;flex-direction:column}
.sources-sec{margin-top:18px;border-top:1px solid var(--line);padding-top:12px}

/* ---------- Deberes ---------- */
.hw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.hw-card{padding:18px 20px;display:block;color:inherit;text-decoration:none}
.hw-top{display:flex;gap:14px;align-items:flex-start}
.hw-ico{width:44px;height:44px;border-radius:13px;background:var(--accent-soft);color:var(--accent2);display:grid;place-items:center;flex:none}
.hw-ico svg{width:22px;height:22px}
.hw-top b{font-size:17px;display:block;margin-bottom:6px}
.hw-sub{display:flex;gap:6px;flex-wrap:wrap}
.hw-foot{display:flex;align-items:center;gap:12px;margin-top:16px;font-size:13px}.hw-foot .bar{flex:1}
.hw-card.prep{border-style:dashed}.hw-card.err .hw-ico{background:var(--bad-soft);color:var(--bad)}
.bar.indet{margin-top:14px;position:relative}.bar.indet>i{position:absolute;width:35%;animation:indet 1.3s ease-in-out infinite}
@keyframes indet{0%{left:-35%}100%{left:100%}}

/* ---------- Mochila ---------- */
.bp-page{max-width:1240px;margin:0 auto}
.bp-drop{margin-bottom:12px}
.bp-sorting{display:flex;align-items:center;gap:14px;padding:14px 18px;margin-bottom:12px;border-radius:18px}
.bp-sorting.err{border-color:var(--bad)}
.bp-layout{display:grid;grid-template-columns:230px 1fr;gap:24px;margin-top:20px;align-items:start}
.bp-side,.bp-main{min-width:0}
.bp-side{display:flex;flex-direction:column;gap:4px;position:sticky;top:12px}
.bp-side .side-item{display:flex;align-items:center;gap:10px}
.dotc{width:11px;height:11px;border-radius:50%;flex:none;display:inline-block}
.bp-kinds{margin-bottom:16px;overflow-x:auto;flex-wrap:nowrap}.bp-kinds button{white-space:nowrap;flex:none;padding:9px 14px}
.bp-kinds small{opacity:.6;margin-left:4px}
.bp-head{margin-bottom:12px}
.bp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.bp-card{position:relative;border-radius:18px;background:var(--card);border:1px solid var(--line);overflow:hidden;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s;outline:none}
.bp-card:hover,.bp-card:focus-visible{transform:translateY(-2px);border-color:var(--line2);box-shadow:var(--shadow-sm)}
.bp-card.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.bp-card.wait .bp-th{opacity:.6}
.bp-th{height:140px;background:var(--card2);position:relative;overflow:hidden}
.bp-th img{width:100%;height:100%;object-fit:cover;display:block}
.bp-ph{height:100%;display:grid;place-items:center;color:var(--accent2);padding:12px}
.bp-ph small{color:var(--text2);font-size:12px;line-height:1.4;max-height:100px;overflow:hidden;display:block}
.bp-ph svg{width:34px;height:34px}
.bp-wait{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.25);color:#fff}.bp-wait.err{color:var(--bad);background:rgba(0,0,0,.4)}
.bp-pick{position:absolute;top:8px;left:8px;width:26px;height:26px;border-radius:8px;background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.8);display:grid;place-items:center;color:#fff;z-index:2;opacity:0;transition:opacity .15s}
.bp-card:hover .bp-pick,.bp-card.sel .bp-pick,.bp-layout:has(.bp-card.sel) .bp-pick{opacity:1}
.bp-card.sel .bp-pick{background:var(--accent);border-color:var(--accent)}.bp-pick svg{width:16px;height:16px}
.bp-info{padding:11px 13px 13px;display:flex;flex-direction:column;gap:6px}
.bp-info b{font-size:14.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bp-tags{display:flex;gap:5px;flex-wrap:wrap}.bp-tags .pill{font-size:11.5px;padding:3px 9px}
.bp-bar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:max-content;z-index:40;display:flex;align-items:center;gap:8px;flex-wrap:wrap;max-width:min(1100px,calc(100vw - 24px));padding:10px 14px;border-radius:20px;background:var(--panel);border:1px solid var(--line2);box-shadow:var(--shadow)}
.bp-bar .btn{white-space:nowrap}
.empty-state{text-align:center;padding:60px 20px}
.es-ico{width:68px;height:68px;border-radius:20px;background:var(--accent-soft);color:var(--accent2);display:inline-grid;place-items:center;margin-bottom:14px}.es-ico svg{width:32px;height:32px}
.cls-list{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow:auto}
.cls-row{display:flex;align-items:center;gap:10px}.cls-row input[type=color]{width:38px;height:38px;border:0;border-radius:10px;background:none;padding:0;cursor:pointer;flex:none}
.cls-row .inp{flex:1}.cls-al{font-size:13px;margin:-4px 0 4px 48px}
.bp-detail{display:grid;grid-template-columns:1.1fr 1fr;gap:24px}
.bp-prev img{width:100%;border-radius:14px;display:block;max-height:70vh;object-fit:contain;background:var(--card2)}

/* ---------- Automations: blocks ---------- */
.flow .ac{background:color-mix(in srgb,var(--bc,var(--accent)) 18%,transparent);color:var(--bc,var(--accent2))}
.flow .ac.cond{--bc:#e0a82e}
.abm{max-width:1060px}
.ab-head{display:flex;gap:16px;align-items:center;margin-bottom:12px;flex-wrap:wrap}.ab-mode{min-width:230px}
.ab-body{display:grid;grid-template-columns:1fr;gap:16px;margin-top:14px}
.ab-body.with-pal{grid-template-columns:230px 1fr}
.ab-pal{display:flex;flex-direction:column;gap:12px;max-height:56vh;overflow:auto;padding-right:4px}
.ab-pal:empty{display:none}
.ab-pal h4{font-size:13px;color:var(--muted);font-weight:600;margin:0}
.pal-group{display:flex;flex-direction:column;gap:6px}.pal-group small{color:var(--muted);font-size:12px;font-weight:600}
.pal-blk{display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:12px;background:color-mix(in srgb,var(--bc) 18%,var(--card));border-left:5px solid var(--bc);font-size:13.5px;font-weight:600;cursor:grab;touch-action:none;user-select:none}
.pal-blk svg{width:16px;height:16px;color:var(--bc);flex:none}
.ab-canvas{background:var(--card2);border:1px solid var(--line);border-radius:20px;padding:16px;max-height:56vh;overflow:auto;min-width:0}
.blk{border-radius:14px;background:color-mix(in srgb,var(--bc) 14%,var(--card));border-left:6px solid var(--bc);margin-bottom:8px;animation:pop .2s var(--ease)}
.blk.hat{border-radius:22px 22px 14px 14px;margin-bottom:10px}
.blk-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 10px 9px 12px;min-height:46px}
.ab-ico{width:28px;height:28px;border-radius:9px;background:color-mix(in srgb,var(--bc) 30%,transparent);color:var(--bc);display:grid;place-items:center;flex:none}.ab-ico svg{width:16px;height:16px}
.ab-pal [data-new],.ab-grip{user-select:none;-webkit-user-select:none}
.ab-pal [data-new]{touch-action:none;cursor:grab}
.ab-grip{cursor:grab;color:var(--muted);display:grid;place-items:center;touch-action:none;padding:4px 2px}.ab-grip svg{width:18px;height:18px}
.ab-t{font-size:14px;color:var(--text2)}.ab-t.b{font-weight:700;color:var(--text)}
.ab-p{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
.ab-ctl{margin-left:auto;display:flex;gap:2px}
.bi{background:var(--card);border:1px solid var(--line2);border-radius:9px;padding:6px 9px;color:var(--text);font:inherit;font-size:14px;outline:none;max-width:100%}
.bi:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.bi.num{width:68px}.bi.long{width:min(420px,100%);resize:vertical}
.act-sel{max-width:320px;font-weight:600}
.dow{display:inline-flex;gap:3px}.dow button{width:28px;height:28px;border-radius:8px;background:var(--card);border:1px solid var(--line2);font-size:12px;font-weight:700;color:var(--muted)}.dow button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.slot{display:flex;flex-direction:column;min-height:36px;border-radius:12px;position:relative}
.slot.hot{background:var(--accent-soft)}
.ifb .branch{margin:0 10px 10px 22px;padding:8px 10px;border-radius:12px;background:color-mix(in srgb,var(--bc) 10%,var(--card2));border:1px dashed color-mix(in srgb,var(--bc) 50%,transparent)}
.ifb .branch>.ab-t{display:block;margin-bottom:6px}
.ab-add{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:10px;border:1px dashed var(--line2);color:var(--accent2);font-weight:600;font-size:13.5px;margin-top:2px}
.ab-add:hover{background:var(--accent-soft)}.ab-add svg{width:14px;height:14px}
.ab-menu{display:flex;flex-direction:column;gap:4px;margin:6px 0 4px;padding:8px;border-radius:14px;background:var(--panel);border:1px solid var(--line2);box-shadow:var(--shadow);max-height:260px;overflow:auto;position:relative;z-index:5}
.ab-menu button{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;text-align:left;font-size:14px;font-weight:600;border-left:4px solid var(--bc)}
.ab-menu button:hover{background:var(--card2)}.ab-menu svg{width:16px;height:16px;color:var(--bc)}
.ab-drop{height:6px;border-radius:4px;background:var(--accent);margin:2px 0 4px;box-shadow:0 0 0 3px var(--accent-soft)}
.ab-ghost{position:fixed;left:0;top:0;z-index:9999;pointer-events:none;padding:8px 14px;border-radius:12px;background:var(--accent);color:#fff;font-weight:600;font-size:14px;box-shadow:var(--shadow);opacity:.95}
body.ab-dragging{cursor:grabbing;user-select:none;-webkit-user-select:none}
.ab-note{display:flex;align-items:center;gap:8px;font-size:13.5px;margin:12px 0 0}.ab-note svg{width:16px;height:16px;flex:none}

/* ---------- responsive ---------- */
@media (max-width:900px){
  .bp-layout{grid-template-columns:minmax(0,1fr)}
  .bp-side{flex-direction:row;overflow-x:auto;position:static;padding-bottom:6px}.bp-side .side-item{white-space:nowrap;flex:none;width:auto}.bp-side .btn{flex:none;margin-top:0!important}
  .bp-detail{grid-template-columns:1fr}
  .ab-body.with-pal{grid-template-columns:1fr}.ab-pal{max-height:none;flex-direction:row;overflow-x:auto;flex-wrap:nowrap}.ab-pal h4{display:none}

}
@media (max-width:700px){

  .sbox .src-tab{font-size:13px;padding:11px 4px}
  .link-row{flex-wrap:wrap}.link-row .inp{flex-basis:100%}
  .bp-grid{grid-template-columns:repeat(2,1fr);gap:10px}.bp-th{height:112px}
  .bp-bar{bottom:76px;border-radius:16px;left:12px;right:12px;transform:none;width:auto;max-width:none;flex-wrap:nowrap;overflow-x:auto}.bp-bar>*{flex:none}.bp-bar .grow{display:none}.bp-bar .btn{padding:0 10px}
  .drop .btn-ghost{padding:0 16px;font-size:15px}
  .hw-grid{grid-template-columns:1fr}
  .stepc{flex-wrap:wrap}.step-act{flex-direction:row;width:100%;justify-content:flex-end}
  .ab-head{flex-direction:column;align-items:stretch}
  .topic-head{flex-wrap:wrap;gap:14px}
}

function addDays(s, n) { const d = parseISO(s); d.setDate(d.getDate() + n); return isoDate(d); }

  all(store) { return new Promise((res) => { if (!this.db) return res([]); const r = this.tx(store, 'readonly').getAll(); r.onsuccess = () => res(r.result || []); r.onerror = () => res([]); }); },

  del(store, id) { return new Promise((res) => { if (!this.db) return res(); const r = this.tx(store, 'readwrite').delete(id); r.onsuccess = r.onerror = () => res(); }); },
  clear(store) { return new Promise((res) => { if (!this.db) return res(); const r = this.tx(store, 'readwrite').clear(); r.onsuccess = r.onerror = () => res(); }); },
};
async function loadAll() { for (const s of STORES) ST[s] = await DB.all(s); }
function save(store, obj) { obj.updatedAt = Date.now(); const i = ST[store].findIndex((x) => x.id === obj.id); if (i >= 0) ST[store][i] = obj; else ST[store].push(obj); return DB.put(store, obj); }
function remove(store, id) { ST[store] = ST[store].filter((x) => x.id !== id); return DB.del(store, id); }

/* ---------------- markdown + math ---------------- */
function md(src) {
  if (src == null || src === '') return '';
  const maths = [];
  const ph = (x, d) => { maths.push([x, d]); return `MATHPH${maths.length - 1}END`; };
  let s = String(src)
    .replace(/\$\$([\s\S]+?)\$\$/g, (m, x) => ph(x, true))
    .replace(/\\\[([\s\S]+?)\\\]/g, (m, x) => ph(x, true))
    .replace(/\\\(([\s\S]+?)\\\)/g, (m, x) => ph(x, false))
    .replace(/\$([^$\n]+?)\$/g, (m, x) => (/^\s|\s$/.test(x) ? m : ph(x, false)));
  let html;
  try { html = window.marked ? marked.parse(s, { breaks: true, gfm: true }) : '<p>' + esc(s).replace(/\n/g, '<br>') + '</p>'; } catch (e) { html = '<p>' + esc(s) + '</p>'; }
  html = html.replace(/MATHPH(\d+)END/g, (m, i) => {
    const [x, d] = maths[+i];
    if (window.katex) { try { return katex.renderToString(x, { displayMode: d, throwOnError: false, output: 'html' }); } catch (e) {} }
    return `<code>${esc(x)}</code>`;
  });
  return window.DOMPurify ? DOMPurify.sanitize(html) : html;
}
function safeSvg(svg) {
  if (!svg || !/<svg[\s>]/i.test(svg)) return '';
  if (!window.DOMPurify) return '';
  return DOMPurify.sanitize(svg, { USE_PROFILES: { svg: true, svgFilters: true } });
}

function toast(msg, err) {

}
function confetti() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = document.createElement('canvas'); c.className = 'confetti'; document.body.appendChild(c);
  const ctx = c.getContext('2d'), dpr = devicePixelRatio || 1;
  c.width = innerWidth * dpr; c.height = innerHeight * dpr; ctx.scale(dpr, dpr);
  const cols = ['#a78bfa', '#8b5cf6', '#e879f9', '#fbbf24', '#34d399', '#60a5fa'];
  const ps = Array.from({ length: 140 }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 200, y: innerHeight * .55, vx: (Math.random() - .5) * 16, vy: -Math.random() * 16 - 6, r: Math.random() * 6 + 4, c: cols[(Math.random() * cols.length) | 0], a: Math.random() * 6, va: (Math.random() - .5) * .4 }));
  const t0 = performance.now();
  const tick = (t) => {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of ps) { p.vy += .45; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore(); }
    if (t - t0 < 2600) requestAnimationFrame(tick); else c.remove();
  };
  requestAnimationFrame(tick);
}
function openModal(html, { cls = '', onClose, closable = true } = {}) {

}

/* ---------------- files → content blocks ---------------- */
const MAX_SOURCES = 10;
function readAsDataURL(file) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); }); }
function readAsText(file) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsText(file); }); }
function loadImg(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
async function fileToSource(file) {
  const name = file.name || 'archivo';
  const type = file.type || '';
  if (type.startsWith('image/') || /\.(heic|heif)$/i.test(name)) {
    const url = await readAsDataURL(file);
    let img;
    try { img = await loadImg(url); } catch (e) { throw new Error(`No puedo abrir "${name}". Si es HEIC, conviértela a JPG.`); }
    const max = 1600, sc = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
    const data = c.toDataURL('image/jpeg', 0.85);
    return { id: uid(), kind: 'image', name, mime: 'image/jpeg', data: data.split(',')[1] };
  }
  if (type === 'application/pdf' || /\.pdf$/i.test(name)) {
    if (file.size > 25e6) throw new Error(`"${name}" pesa demasiado (máx. 25 MB).`);
    const url = await readAsDataURL(file);
    return { id: uid(), kind: 'pdf', name, mime: 'application/pdf', data: url.split(',')[1] };
  }
  if (type.startsWith('video/') || VIDEO_RE.test(name)) return videoToSource(file);
  if (/\.docx$/i.test(name)) return officeToSource(file, 'docx');
  if (/\.pptx$/i.test(name)) return officeToSource(file, 'pptx');
  if (/\.(srt|vtt)$/i.test(name)) return subsToSource(file);
  if (type.startsWith('audio/') || /\.(mp3|m4a|wav|aac|ogg|flac)$/i.test(name)) throw new Error(`"${name}": Claude no puede escuchar audio. Sube la transcripción (.txt, .srt, .vtt) o pégala en «Texto».`);
  if (type.startsWith('text/') || /\.(txt|md|csv|json|html?)$/i.test(name)) {
    return { id: uid(), kind: 'text', name, mime: 'text/plain', data: (await readAsText(file)).slice(0, 200000) };
  }
  throw new Error(`"${name}": formato no soportado. Usa fotos, PDF, Word, PowerPoint, texto o vídeo (los .doc/.ppt antiguos expórtalos a PDF).`);
}
async function filesToSources(files, current = [], max = MAX_SOURCES) {
  const out = [];
  for (const f of files) {
    if (current.length + out.length >= max) { toast(`Máximo ${max} fuentes`, true); break; }
    try { out.push(await fileToSource(f)); } catch (e) { toast(e.message, true); }
  }
  return out;
}
function sourceBlock(s) {
  if (s.kind === 'image') return [{ type: 'image', source: { type: 'base64', media_type: s.mime, data: s.data } }];
  if (s.kind === 'pdf') return [{ type: 'document', source: { type: 'base64', media_type: 'application/pdf', data: s.data } }];
  if (s.kind === 'video') return [{ type: 'text', text: `--- Fuente: vídeo «${s.name}» (${s.meta || 'fotogramas'}). A continuación, fotogramas en orden cronológico. El audio no está disponible: apóyate en lo que se ve (pizarra, diapositivas, texto en pantalla). ---` }, ...(s.frames || []).flatMap((f, i) => [{ type: 'text', text: `Fotograma ${i + 1} · ${f.t}` }, { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: f.data } }])];
  return [{ type: 'text', text: `--- Fuente: ${s.name} ---\n${s.data}` }];
}
function sourcesBlocks(sources, cache) {
  const b = (sources || []).flatMap(sourceBlock);
  if (cache && b.length) b[b.length - 1] = { ...b[b.length - 1], cache_control: { type: 'ephemeral' } };

}
const srcThumb = (s) => s.kind === 'image' ? `data:${s.mime};base64,${s.data}` : s.kind === 'video' && s.frames && s.frames[0] ? `data:image/jpeg;base64,${s.frames[0].data}` : '';
const srcIcon = (s) => ({ pdf: 'file', video: 'video', web: 'globe', youtube: 'youtube' }[s.kind] || (s.origin && { youtube: 'youtube', web: 'globe', drive: 'drive' }[s.origin]) || 'text');

/* ---------------- AI ---------------- */
let AI_BUSY = 0;
async function ai({ system, messages, schema, max_tokens = 8000, model, onText, signal, skills }) {
  if (skills && skills.length) {
    system = (system || '') + skillsSystem(skills);
    const blocks = skills.flatMap((s) => (s.sources && s.sources.length ? [{ type: 'text', text: `Material de referencia de la skill /${s.slug} («${s.name}»):` }, ...s.sources.flatMap(sourceBlock)] : []));
    if (blocks.length) {
      blocks[blocks.length - 1] = { ...blocks[blocks.length - 1], cache_control: { type: 'ephemeral' } };
      messages = [{ role: 'user', content: [...blocks, { type: 'text', text: 'Este es el material de referencia de mis skills. Úsalo como modelo de método, formato y estilo.' }] }, { role: 'assistant', content: 'Entendido. Seguiré exactamente ese método y ese formato.' }, ...messages];
    }
  }
  const body = { model: model || SETTINGS.model, max_tokens, messages, stream: true };
  if (system) body.system = system;
  if (schema) body.output_config = { format: { type: 'json_schema', schema } };
  const direct = SETTINGS.mode === 'direct';
  if (direct && !SETTINGS.apiKey) { openSettings(); throw new Error('Pon tu API key de Anthropic en Ajustes.'); }
  const url = direct ? 'https://api.anthropic.com/v1/messages' : '/api/ai';
  const headers = { 'content-type': 'application/json' };
  if (direct) { headers['x-api-key'] = SETTINGS.apiKey; headers['anthropic-version'] = '2023-06-01'; headers['anthropic-dangerous-direct-browser-access'] = 'true'; }
  else headers['x-app-password'] = SETTINGS.password || '';
  AI_BUSY++;
  try {
    let res;
    try { res = await fetch(url, { method: 'POST', headers, body: JSON.stringify(body), signal }); }
    catch (e) { if (e.name === 'AbortError') throw e; throw new Error(direct ? 'No se pudo conectar con Anthropic. Revisa tu internet.' : 'No se pudo conectar con /api/ai. Si abres el archivo en local, usa «Clave directa» en Ajustes.'); }
    if (!res.ok) {
      const t = await res.text();
      let msg = t.slice(0, 300);
      try { const j = JSON.parse(t); msg = j.error?.message || j.error || msg; } catch (e) {}
      if (res.status === 404 && !direct) msg = 'Este alojamiento no tiene el servidor de la IA (/api/ai). Usa «Clave directa» en Ajustes o despliega en Netlify, Vercel o Cloudflare (mira el README).';
      if (res.status === 401) msg = direct ? 'API key no válida (Ajustes).' : 'Contraseña incorrecta. Ponla en Ajustes.';
      if (res.status === 413) msg = 'El material es demasiado grande. Prueba con menos fotos o un PDF más corto.';
      if (res.status === 529 || res.status === 503) msg = 'La IA está saturada ahora mismo. Prueba en un momento.';
      if (res.status === 401 || res.status === 403) setTimeout(openSettings, 300);
      throw new Error(msg);
    }
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '', text = '', stop = null;
    const handle = (chunk) => {
      for (const line of chunk.split('\n')) {
        if (!line.startsWith('data:')) continue;
        const d = line.slice(5).trim();
        if (!d || d === '[DONE]') continue;
        let ev; try { ev = JSON.parse(d); } catch (e) { continue; }
        if (ev.type === 'content_block_delta' && ev.delta && ev.delta.type === 'text_delta') { text += ev.delta.text; onText && onText(text); }
        else if (ev.type === 'message_delta') stop = ev.delta && ev.delta.stop_reason;
        else if (ev.type === 'error') throw new Error((ev.error && ev.error.message) || 'Error de la IA');
      }
    };
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true }).replace(/\r\n/g, '\n');
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) { handle(buf.slice(0, i)); buf = buf.slice(i + 2); }
    }
    if (buf.trim()) handle(buf);
    if (stop === 'refusal') throw new Error('La IA no ha querido responder a esto.');
    if (schema) {
      if (stop === 'max_tokens') throw new Error('La respuesta salió demasiado larga. Prueba con menos material o divide el set.');
      try { return JSON.parse(text); }
      catch (e) { const a = text.indexOf('{'), b = text.lastIndexOf('}'); try { return JSON.parse(text.slice(a, b + 1)); } catch (e2) { throw new Error('La IA devolvió un formato raro. Inténtalo otra vez.'); } }
    }
    return text;
  } finally { AI_BUSY--; }
}

/* progress modal wrapper for long generations */
async function generating(title, fn, { expect = 6000, steps } = {}) {
  const ctrl = new AbortController();
  const STEPS = steps || ['Leyendo tu material', 'Pensando la estructura', 'Escribiendo el contenido', 'Repasando y guardando'];
  const m = openModal(`<div class="gen"><div class="gen-orb"><div>${ic('spark')}</div></div><h2>${esc(title)}</h2><p class="lead" id="gst">Esto suele tardar entre 20 y 60 segundos.</p><div class="gen-steps">${STEPS.map((s, k) => `<div data-s="${k}" class="${k === 0 ? 'on' : ''}"><i></i>${esc(s)}</div>`).join('')}</div><div class="bar"><i id="gbar" style="width:3%"></i></div><p class="muted" id="gch" style="font-size:13px">&nbsp;</p><button class="btn btn-ghost btn-sm" id="gcancel">Cancelar</button></div>`, { closable: false, cls: 'mid' });
  const stepTo = (k) => $$('[data-s]', m.el).forEach((d) => { const i = +d.dataset.s; d.className = i < k ? 'done' : i === k ? 'on' : ''; });
  $('#gcancel', m.el).onclick = () => ctrl.abort();
  const set = (status) => { const s = $('#gst', m.el); if (s && status) s.textContent = status; };

  catch (e) { if (e.name === 'AbortError') { toast('Cancelado'); return null; } toast(e.message, true); return null; }

const mmss = (sec) => { sec = Math.max(0, Math.floor(sec)); const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0'); };

/* ---------- video → frames ---------- */
async function videoToSource(file) {
  if (file.size > 3e9) throw new Error(`"${file.name}" pesa demasiado (máx. 3 GB).`);
  const url = URL.createObjectURL(file);
  const v = document.createElement('video');
  v.muted = true; v.playsInline = true; v.preload = 'auto'; v.src = url;
  const fail = (m) => new Error(m);
  try {
    await new Promise((res, rej) => {
      const to = setTimeout(() => rej(fail('El vídeo tarda demasiado en abrirse.')), 25000);
      v.onloadeddata = () => { clearTimeout(to); res(); };
      v.onerror = () => { clearTimeout(to); rej(fail(`Tu navegador no puede leer "${file.name}". Prueba con MP4 (H.264) o abre Knowly en Safari/Chrome.`)); };
    });
    const dur = v.duration;
    if (!isFinite(dur) || dur <= 0) throw fail('No puedo saber cuánto dura ese vídeo.');
    const n = dur < 14 ? clamp(Math.ceil(dur / 3), 1, 5) : clamp(Math.round(dur / 20), 6, 16);
    const times = Array.from({ length: n }, (_, i) => Math.min(dur - 0.05, (dur * (i + 0.5)) / n));
    const sc = Math.min(1, 1024 / Math.max(v.videoWidth || 1024, v.videoHeight || 1024));
    const c = document.createElement('canvas'); c.width = Math.round((v.videoWidth || 1024) * sc); c.height = Math.round((v.videoHeight || 576) * sc);
    const ctx = c.getContext('2d', { willReadFrequently: true });
    const sig = document.createElement('canvas'); sig.width = sig.height = 16; const sctx = sig.getContext('2d', { willReadFrequently: true });
    const frames = []; let last = null;
    for (const t of times) {
      await new Promise((res) => { const to = setTimeout(res, 9000); v.onseeked = () => { clearTimeout(to); res(); }; v.currentTime = t; });
      ctx.drawImage(v, 0, 0, c.width, c.height);
      sctx.drawImage(c, 0, 0, 16, 16);
      const px = sctx.getImageData(0, 0, 16, 16).data; const g = [];
      for (let i = 0; i < px.length; i += 4) g.push((px[i] + px[i + 1] + px[i + 2]) / 3);
      if (last) { const diff = g.reduce((a, x, i) => a + Math.abs(x - last[i]), 0) / g.length; if (diff < 2.5) continue; }   // same slide as before
      last = g;
      frames.push({ t: mmss(t), data: c.toDataURL('image/jpeg', 0.72).split(',')[1] });
    }
    if (!frames.length) throw fail('No he podido sacar imágenes de ese vídeo.');
    return { id: uid(), kind: 'video', name: file.name || 'Vídeo', mime: 'video/*', data: '', frames, dur, meta: `${mmss(dur)} de duración · ${frames.length} fotogramas` };
  } finally { URL.revokeObjectURL(url); v.removeAttribute('src'); v.load(); }
}

function parseSubs(raw) {
  const toSec = (s) => { const p = s.replace(',', '.').split(':').map(parseFloat); return p.length === 3 ? p[0] * 3600 + p[1] * 60 + p[2] : p[0] * 60 + p[1]; };

    const ls = block.split('\n'); const i = ls.findIndex((l) => l.includes('-->')); if (i < 0) continue;

  if (!res.ok) throw new Error((j.error && j.error.message) || 'No se pudo leer ese enlace.');
  if (j.text != null) return { id: uid(), kind: 'text', name: (j.title || url).slice(0, 80), mime: 'text/plain', origin: kind, url, data: j.text };
  const bin = atob(j.b64); const u8 = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  const file = new File([u8], j.title || 'archivo', { type: j.mime || 'application/octet-stream' });
  const s = await fileToSource(file); s.origin = kind; s.url = url; return s;
}

/* =================== speech =================== */
const Speech = {
  voices: [], gen: 0,
  ok: 'speechSynthesis' in window,
  init() { if (!this.ok) return; const load = () => { this.voices = speechSynthesis.getVoices(); }; load(); speechSynthesis.onvoiceschanged = load; },
  score(v) { const n = v.name.toLowerCase(); let s = 0; if (/natural|neural|premium|enhanced|mejorada|siri|google/.test(n)) s += 3; if (v.localService) s += 1; if (/novelty|whisper|bad|bells|zarvox|albert|jester|organ|trinoids|bubbles|boing|cellos|wobble|superstar|grandma|grandpa|eddy|flo|reed|rocko|sandy|shelley/.test(n)) s -= 6; return s; },
  list(lang = 'es-ES') { const l = lang.slice(0, 2).toLowerCase(); return this.voices.filter((v) => v.lang.toLowerCase().replace('_', '-').startsWith(l)).sort((a, b) => this.score(b) - this.score(a) || (b.lang.toLowerCase() === lang.toLowerCase()) - (a.lang.toLowerCase() === lang.toLowerCase())); },
  pick(lang, idx = 0) {
    const vs = this.list(lang), code = lang.slice(0, 2).toLowerCase();
    if (idx === 0) { const name = (SETTINGS.voices || {})[code] || (code === 'es' ? SETTINGS.voice : ''); const v = name && this.voices.find((x) => x.name === name); if (v) return v; }
    return vs[idx % Math.max(1, vs.length)] || null;
  },
  chunks(text) { return (String(text).match(/[^.!?;:\n]+[.!?;:]*\s*|\n+/g) || [text]).map((s) => s.trim()).filter(Boolean).reduce((a, s) => { if (a.length && (a[a.length - 1] + ' ' + s).length < 180) a[a.length - 1] += ' ' + s; else a.push(s); return a; }, []); },
  async say(text, { lang = 'es-ES', idx = 0, pitch = 1 } = {}) {
    if (!this.ok || !text) return;
    const my = this.gen;
    const voice = this.pick(lang, idx);
    const multiVoice = this.list(lang).length > 1;
    for (const part of this.chunks(text)) {
      if (my !== this.gen) return;
      await new Promise((res) => {
        const u = new SpeechSynthesisUtterance(part);
        u.lang = voice ? voice.lang : lang; if (voice) u.voice = voice;
        u.rate = SETTINGS.rate || 1; u.pitch = multiVoice ? 1 : pitch;
        u.onend = u.onerror = () => res();
        speechSynthesis.speak(u);
        const keep = setInterval(() => { if (!speechSynthesis.speaking) { clearInterval(keep); res(); } }, 400);
      });
    }
  },
  stop() { this.gen++; if (this.ok) speechSynthesis.cancel(); },
};
Speech.init();
function plain(s) {
  return String(s || '').replace(/\$\$?([^$]+)\$\$?/g, '$1').replace(/\\frac\{([^}]*)\}\{([^}]*)\}/g, '$1 entre $2').replace(/\\cdot|\\times/g, ' por ').replace(/\\sqrt\{([^}]*)\}/g, 'raíz de $1').replace(/\^2/g, ' al cuadrado').replace(/\^\{?([^}\s]+)\}?/g, ' elevado a $1').replace(/\\[a-zA-Z]+/g, ' ').replace(/[*_#`>|{}]/g, '').replace(/\[(.*?)\]\(.*?\)/g, '$1').replace(/\s+/g, ' ').trim();
}

/* speech recognition */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function dictate({ lang = 'es-ES', continuous = false, onText, onEnd }) {
  if (!SR) { toast('Tu navegador no permite dictado por voz (prueba Chrome o Safari).', true); return null; }
  const r = new SR();
  r.lang = lang; r.continuous = continuous; r.interimResults = true;
  let finalText = '', stopped = false;
  r.onresult = (e) => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) { const t = e.results[i][0].transcript; if (e.results[i].isFinal) finalText += t + ' '; else interim += t; }
    onText && onText(finalText, interim);
  };
  r.onerror = (e) => { if (e.error === 'not-allowed') { toast('Permite el micrófono para dictar.', true); stopped = true; } };
  r.onend = () => { if (continuous && !stopped) { try { r.start(); } catch (e) {} } else onEnd && onEnd(finalText.trim()); };
  try { r.start(); } catch (e) {}
  return { stop() { stopped = true; try { r.stop(); } catch (e) {} }, get text() { return finalText; } };
}

/* =================== flashcards runner =================== */
function flashRunner(el, cards, { onMark, onDone, title = 'Flashcards' } = {}) {
  let i = 0;
  const order = cards.map((_, k) => k);
  const draw = () => {
    if (i >= order.length) {
      const known = cards.filter((c) => c.known === true).length;
      el.innerHTML = `<div class="runner"><div class="score card"><div class="big">${known}/${cards.length}</div><h3>¡Ronda terminada!</h3><p class="muted">Tarjetas que ya dominas. Repasa las demás hasta tenerlas todas.</p><div class="row" style="justify-content:center;margin-top:16px"><button class="btn btn-ghost" id="again">${ic('refresh')} Repasar todas</button>${known < cards.length ? `<button class="btn btn-primary" id="weak">Solo las que fallo</button>` : ''}</div></div></div>`;
      $('#again', el).onclick = () => { i = 0; order.splice(0, order.length, ...cards.map((_, k) => k)); draw(); };
      const w = $('#weak', el); if (w) w.onclick = () => { order.splice(0, order.length, ...cards.map((c, k) => (c.known === true ? -1 : k)).filter((k) => k >= 0)); i = 0; draw(); };
      onDone && onDone();
      return;
    }
    const c = cards[order[i]];
    el.innerHTML = `<div class="runner"><div class="runner-top"><b>${esc(title)}</b><div class="bar"><i style="width:${(i / order.length) * 100}%"></i></div><span class="muted">${i + 1}/${order.length}</span></div>
      <div class="flip" id="flip" tabindex="0"><div class="flip-in"><div class="face"><small>Pregunta</small><div class="md">${md(c.front)}</div><p class="muted" style="font-size:13px;font-weight:500;margin-top:20px">Toca para girar</p></div><div class="face back"><small>Respuesta</small><div class="md">${md(c.back)}</div></div></div></div>
      <div class="fc-btns"><button class="btn btn-ghost" id="prev" ${i === 0 ? 'disabled' : ''}>${ic('left')}</button><button class="btn btn-line" id="say" title="Escuchar">${ic('vol')}</button><button class="btn btn-danger" id="no">Repasar</button><button class="btn btn-primary" id="yes">${ic('check')} Lo sé</button></div></div>`;
    const flip = $('#flip', el);
    flip.onclick = () => flip.classList.toggle('on');
    $('#prev', el).onclick = () => { i = Math.max(0, i - 1); draw(); };
    $('#say', el).onclick = (e) => { e.stopPropagation(); Speech.stop(); Speech.say(plain(flip.classList.contains('on') ? c.back : c.front)); };
    $('#no', el).onclick = () => { c.known = false; srs(c, false); logActivity(); onMark && onMark(c, false); i++; draw(); };
    $('#yes', el).onclick = () => { c.known = true; srs(c, true); logActivity(); onMark && onMark(c, true); i++; draw(); };
  };
  const key = (e) => { if (!el.isConnected) return document.removeEventListener('keydown', key); if (e.target.matches('input,textarea')) return; const f = $('#flip', el); if (!f) return; if (e.code === 'Space') { e.preventDefault(); f.classList.toggle('on'); } if (e.key === 'ArrowRight') $('#yes', el)?.click(); if (e.key === 'ArrowLeft') $('#no', el)?.click(); };
  document.addEventListener('keydown', key);
  draw();
}

/* =================== quiz runner =================== */
function quizRunner(el, qs, { onAnswer, onDone, title = 'Quiz', review = false } = {}) {
  let startReview = review;
  let i = 0;
  const draw = () => {
    if (i >= qs.length) {
      const ok = qs.filter((q) => q.picked === q.answer).length;
      const pct = Math.round((ok / qs.length) * 100);
      el.innerHTML = `<div class="runner"><div class="score card"><div class="big">${pct}%</div><h3>${ok} de ${qs.length} correctas</h3><p class="muted">${pct >= 80 ? '¡Muy bien! Lo tienes dominado.' : pct >= 50 ? 'Vas bien. Repasa los fallos y vuelve a intentarlo.' : 'Toca repasar. Mira las explicaciones de los fallos.'}</p><div class="row" style="justify-content:center;margin-top:16px;flex-wrap:wrap"><button class="btn btn-ghost" id="rev">Revisar respuestas</button><button class="btn btn-primary" id="again">${ic('refresh')} Repetir</button></div></div></div>`;
      $('#again', el).onclick = () => { qs.forEach((q) => (q.picked = null)); i = 0; draw(); };
      $('#rev', el).onclick = () => { el.innerHTML = `<div class="runner">${qs.map((q, k) => `<div class="card" style="padding:20px 22px;margin-bottom:14px"><div class="row between"><b>Pregunta ${k + 1}</b><span class="pill ${q.picked === q.answer ? 'good' : 'bad'}">${q.picked === q.answer ? 'Correcta' : 'Fallada'}</span></div><div class="md" style="margin:10px 0">${md(q.question)}</div><p style="margin:0 0 6px"><b>Respuesta:</b> ${md(q.options[q.answer]).replace(/^<p>|<\/p>\s*$/g, '')}</p><div class="md muted">${md(q.explanation)}</div></div>`).join('')}<div class="row" style="justify-content:center"><button class="btn btn-primary" id="back2">Volver</button></div></div>`; $('#back2', el).onclick = draw; };
      if (pct >= 80 && !review) confetti();
      review = false;
      onDone && onDone(pct);
      return;
    }
    const q = qs[i];
    const answered = q.picked !== null && q.picked !== undefined;
    el.innerHTML = `<div class="runner"><div class="runner-top"><b>${esc(title)}</b><div class="bar"><i style="width:${(i / qs.length) * 100}%"></i></div><span class="muted">${i + 1}/${qs.length}</span></div>
      ${q.topic ? `<span class="pill acc" style="margin-bottom:12px">${esc(q.topic)}</span>` : ''}
      <div class="qtext"><div class="md">${md(q.question)}</div></div>

// Knowly has no server that can send e-mail, so reminders live here: a bell with scheduled alerts,

async function addAlert({ title, body = '', href = '', at = '', kind = 'info' }) {
  const a = { id: uid(), title, body, href, kind, at: at || todayISO(), createdAt: Date.now(), read: false, shown: false };
  await save('alerts', a); refreshBell(); return a;
}
const alertsVisible = () => ST.alerts.filter((a) => a.at <= todayISO()).sort((a, b) => (b.at + b.createdAt).localeCompare(a.at + a.createdAt));

}
function fireAlerts() {
  const canNotify = 'Notification' in window && Notification.permission === 'granted';
  let changed = false;
  for (const a of ST.alerts) {
    if (a.at > todayISO() || a.shown) continue;
    a.shown = true; save('alerts', a); changed = true;
    if (canNotify && !a.read) { try { const n = new Notification(a.title, { body: a.body || APP_NAME }); n.onclick = () => { window.focus(); if (a.href) location.hash = a.href; }; } catch (e) {} }
  }

  for (const a of ST.alerts) if (a.at < addDays(todayISO(), -60)) remove('alerts', a.id);
  if (changed) refreshBell();
}
// events with a time of day (reading, study…): remind when the hour arrives while the app is open
function checkTimedEvents() {
  const now = new Date(), t = todayISO(), hm = now.toTimeString().slice(0, 5);
  for (const e of ST.events) {
    if (e.done || e.date !== t || !e.time || e.timedFired === t) continue;
    if (hm >= e.time && hm <= addMinutes(e.time, 90)) {
      e.timedFired = t; save('events', e);

    }

/* ---------- .ics export ---------- */
const icsEsc = (s) => String(s || '').replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/,/g, '\\,').replace(/;/g, '\\;');
function icsFold(line) { const out = []; while (line.length > 72) { out.push(line.slice(0, 72)); line = ' ' + line.slice(72); } out.push(line); return out.join('\r\n'); }
// items: [{ uid, title, date:'YYYY-MM-DD', time:'HH:MM'|'', minutes, desc, alarms:[minutes before the start; negative = after] }]
// All-day events: the start is 00:00, so "3 days before at 9:00" is 3*1440-540 minutes before.
const alarmDaysBefore = (d) => d * 1440 - 540;
function makeICS(items) {
  const z = (n) => String(n).padStart(2, '0'), stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', `PRODID:-//${APP_NAME}//ES`, 'CALSCALE:GREGORIAN'];
  for (const it of items) {
    const d = it.date.replace(/-/g, '');
    L.push('BEGIN:VEVENT', `UID:${it.uid || uid()}@knowly`, `DTSTAMP:${stamp}`);
    if (it.time) {
      const [h, mi] = it.time.split(':').map(Number), end = new Date(parseISO(it.date)); end.setHours(h, mi + (it.minutes || 30));
      L.push(`DTSTART:${d}T${z(h)}${z(mi)}00`, `DTEND:${isoDate(end).replace(/-/g, '')}T${z(end.getHours())}${z(end.getMinutes())}00`);
    } else L.push(`DTSTART;VALUE=DATE:${d}`, `DTEND;VALUE=DATE:${addDays(it.date, 1).replace(/-/g, '')}`);
    L.push(icsFold('SUMMARY:' + icsEsc(it.title)));
    if (it.desc) L.push(icsFold('DESCRIPTION:' + icsEsc(it.desc)));
    for (const mins of it.alarms || [it.time ? 10 : -9 * 60]) L.push('BEGIN:VALARM', 'ACTION:DISPLAY', icsFold('DESCRIPTION:' + icsEsc(it.title)), `TRIGGER:${mins >= 0 ? '-' : ''}PT${Math.max(1, Math.abs(mins))}M`, 'END:VALARM');
    L.push('END:VEVENT');
  }
  L.push('END:VCALENDAR');
  return L.join('\r\n');
}

/* =================== reminders =================== */
const EV_LABEL = { exam: 'Examen', homework: 'Deberes', read: 'Lectura', study: 'Estudio', other: 'Otro' };
function upcoming(days = 7) {
  const out = [];
  for (const e of ST.events) if (!e.done && daysUntil(e.date) >= 0 && daysUntil(e.date) <= days) out.push({ kind: 'event', id: e.id, title: e.title, type: e.type, date: e.date, subject: e.subject, hwId: e.hwId });
  for (const x of ST.exams) if (x.date && daysUntil(x.date) >= 0 && daysUntil(x.date) <= days) out.push({ kind: 'exam', id: x.id, title: x.title, type: 'exam', date: x.date, subject: x.subject });
  return out.sort((a, b) => a.date.localeCompare(b.date));
}
function remindersHTML() {
  const up = upcoming(3);
  if (!up.length) return '';
  return up.slice(0, 3).map((u) => `<div class="alert"><div class="when">${relDay(u.date)}</div><div class="grow"><b>${esc(u.title)}</b> <span class="muted">· ${EV_LABEL[u.type] || 'Tarea'}${u.subject ? ' · ' + esc(u.subject) : ''}</span></div>${u.kind === 'exam' ? `<a class="btn btn-primary btn-sm" href="#/exam/${u.id}">Estudiar</a>` : u.type === 'exam' ? `<button class="btn btn-primary btn-sm" data-prep="${u.id}">Preparar con IA</button>` : `<a class="btn btn-soft btn-sm" href="${u.hwId ? '#/hw/' + u.hwId : '#/calendar'}">${u.hwId ? 'Abrir' : 'Ver'}</a>`}</div>`).join('');
}
function bindReminders(v) { $$('[data-prep]', v).forEach((b) => (b.onclick = () => { const e = byId('events', b.dataset.prep); newExamFlow({ title: e.title, date: e.date, subject: e.subject, eventId: e.id }); })); }
function notifyDue() {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  let sent = {}; try { sent = JSON.parse(localStorage.getItem('knowly.notified') || '{}'); } catch (e) {}
  for (const u of upcoming(1)) {
    const k = u.id + ':' + todayISO();
    if (sent[k]) continue;
    try { new Notification(`${APP_NAME}: ${relDay(u.date)} — ${u.title}`, { body: u.type === 'exam' ? 'Abre la app: tu pack de estudio está listo.' : 'No te olvides 😉' }); } catch (e) {}
    sent[k] = 1;
  }
  try { localStorage.setItem('knowly.notified', JSON.stringify(sent)); } catch (e) {}
}

function composer(el, { tools, tool, placeholder, button, onSubmit, extraFoot = '', minRows }) {

  el.innerHTML = `<div class="composer" id="comp">
    ${tools.length > 1 ? `<div class="tools">${tools.map((x) => `<button class="chip ${x.id === cur ? 'on' : ''}" data-tool="${x.id}">${ic(x.icon)} ${x.label}${x.isNew ? '<span class="new">NUEVO</span>' : ''}</button>`).join('')}</div>` : ''}

      <div class="model-sel">${LOGO()}<select id="cmodel" aria-label="Modelo">${MODELS.map(([v, l]) => `<option value="${v}" ${SETTINGS.model === v ? 'selected' : ''}>${l.split(' (')[0]}</option>`).join('')}</select></div>
      <button class="btn btn-primary" id="cgo" disabled>${button || t().button}</button></div></div>`;
  $('.model-sel svg', el).style.cssText = 'width:22px;height:22px';
  const ta = $('#cta', el), goBtn = $('#cgo', el);
  const refresh = () => { goBtn.disabled = !ta.value.trim() && !att.length; $('#catt', el).innerHTML = att.map(attChip).join(''); $$('[data-rm]', el).forEach((b) => (b.onclick = () => { att = att.filter((a) => a.id !== b.dataset.rm); refresh(); })); };

  ta.onkeydown = (e) => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) goBtn.click(); };
  const add = async (files) => { att = att.concat(await filesToSources(files, att)); refresh(); };
  $('#cfile', el).onchange = (e) => { add([...e.target.files]); e.target.value = ''; };
  $('#ccam', el).onchange = (e) => { add([...e.target.files]); e.target.value = ''; };
  ta.addEventListener('paste', (e) => { const fs = [...(e.clipboardData?.files || [])]; if (fs.length) { e.preventDefault(); add(fs); } });
  const comp = $('#comp', el);
  comp.ondragover = (e) => { e.preventDefault(); comp.classList.add('drag'); };

async function homeSubmit({ tool, text: raw, sources }) {
  const { text, skills } = parseSkills(raw);
  if (tool === 'solver' || tool === 'board') {
    const h = { id: uid(), kind: tool === 'solver' ? 'solve' : 'board', question: text, sources, answer: '', board: null, chat: [], skillIds: skills.map((s) => s.id), createdAt: Date.now() };
    await save('history', h);
    go(`/${tool === 'solver' ? 'solve' : 'board'}/${h.id}`);
    return;
  }
  const srcs = [...sources]; if (text) srcs.unshift({ id: uid(), kind: 'text', name: 'Texto', mime: 'text/plain', data: text });
  createSetFlow({ sources: srcs, preset: tool, custom: skills.map((s) => '/' + s.slug).join(' ') });
}

}
function solutionHTML(t, streaming) {
  const lines = t.split('\n');
  let final = '', rest = t;
  const m = /^\s*\**\s*RESPUESTA\s*:?\**\s*:?\s*(.*)$/i.exec(lines[0] || '');
  if (m) { final = m[1]; rest = lines.slice(1).join('\n'); }
  return `${final ? `<div class="final"><small>Respuesta final</small><div class="v md">${md(final)}</div></div>` : ''}<div class="md sol ${streaming ? 'cursor' : ''}">${md(rest)}</div>`;
}

/* =================== CREATE SET FLOW =================== */
function createSetFlow({ sources = [], preset = '', custom = '' }) {
  const m = openModal(`<h2>Crear desde</h2>
    <div id="sbox"></div>
    <textarea class="inp custom-inp" id="custom" rows="2" placeholder="Personaliza el contenido (opcional): «preguntas tipo selectividad», «vocabulario para flashcards»… o escribe / para usar una skill">${esc(custom)}</textarea>

  const el = m.el;
  const box = sourceBox($('#sbox', el), { sources, hint: false, onChange: (s) => { $('#next', el).disabled = !s.length; } });
  $('#next', el).disabled = !box.count();

function nameSetFlow({ sources, preset, custom }) {
  let color = SET_COLORS[ST.sets.length % SET_COLORS.length];
  const pre = { flash: ['memo'], quiz: ['exam'], guide: ['understand'], cheat: ['exam'] }[preset] || [];
  const m = openModal(`<h2>Ponle nombre a tu set</h2><p class="lead">Un título que resuma el tema o el objetivo.</p>
    <div class="title-inp"><i id="tcol" style="background:${color}"></i><input id="tname" placeholder="Déjalo vacío y la IA elegirá un nombre"></div>
    <label class="lbl" style="margin-top:0">Color del set</label><div class="colors">${SET_COLORS.map((c) => `<button data-c="${c}" style="background:${c};color:${c}" class="${c === color ? 'on' : ''}">${c === color ? ic('check') : ''}</button>`).join('')}</div>
    <label class="lbl" style="margin-top:22px">¿Para qué lo quieres? (opcional)</label>
    <div class="checks">${Object.entries(FOCUS_LABELS).map(([k, l]) => `<label class="check"><input type="checkbox" value="${k}" ${pre.includes(k) ? 'checked' : ''}> ${l}</label>`).join('')}</div>
    <div class="row" style="justify-content:center;margin-top:30px"><button class="btn btn-primary btn-lg" id="create" style="min-width:280px">Crear set</button></div>`, { cls: 'mid' });
  const el = m.el;
  $$('[data-c]', el).forEach((b) => (b.onclick = () => { color = b.dataset.c; $$('[data-c]', el).forEach((x) => { x.classList.toggle('on', x === b); x.innerHTML = x === b ? ic('check') : ''; }); $('#tcol', el).style.background = color; }));
  $('#create', el).onclick = async () => {
    const title = $('#tname', el).value.trim();
    const focus = $$('.checks input:checked', el).map((i) => i.value);
    m.close();
    const ps = parseSkills(custom);
    const set = await generating('Creando tu set de estudio', (o) => genSet({ sources, title, color, focus, custom: ps.text }, { ...o, skills: ps.skills }), { expect: 9000, steps: ['Leyendo tu material', 'Detectando la materia', 'Escribiendo guías y temas', 'Ordenándolo en carpetas'] });
    if (!set) return;
    set.skillIds = ps.skills.map((s) => s.id);
    await save('sets', set);
    toast(`Guardado en «${set.subject}»`);
    setTimeout(() => runAutomations('upload', { set }), 600);
    go(`/set/${set.id}${preset && ['flash', 'quiz', 'cheat', 'guide'].includes(preset) ? '?go=' + preset : ''}`);
  };
}

const HW_KIND = { exercises: 'Ejercicios', reading: 'Lectura', writing: 'Redacción', language: 'Idiomas', project: 'Trabajo', exam_prep: 'Examen', other: 'Deberes' };

function calendarContextText() {
  const rows = [];
  for (const e of ST.events) if (!e.done && e.date >= todayISO() && daysUntil(e.date) <= 60) rows.push(`- id=${e.id} | ${EV_LABEL[e.type] || 'Evento'} | ${e.title} | ${e.date}${e.subject ? ' | ' + e.subject : ''}`);
  for (const x of ST.exams) if (x.date && x.date >= todayISO() && daysUntil(x.date) <= 60) rows.push(`- id=${x.id} | Examen | ${x.title} | ${x.date}${x.subject ? ' | ' + x.subject : ''}`);
  return rows.length ? rows.join('\n') : '(vacío)';
}
async function analyzeHomework({ sources, note = '', subject = '', due = '', asExam = false }, opts) {
  const subs = subjectsList();
  const prompt = `Hoy es ${fmtDate(todayISO(), true)} (${todayISO()}).
El estudiante te da este material como DEBERES (capturas, fotos o archivos; pueden ser varias páginas: léelas todas; si hay letra a mano, interprétala con cuidado). Prepáralos para que los ENTIENDA y los haga él mismo: explica, no te limites a dar resultados.
${note ? `Nota del estudiante: ${note}\n` : ''}${subject ? `Materia indicada por el estudiante: ${subject}\n` : ''}${due ? `Fecha de entrega indicada: ${due}\n` : ''}${asExam ? 'El estudiante dice que esto es material para un EXAMEN (usa kind = "exam_prep").\n' : ''}
Rellena el JSON:
- title, subject${subs.length ? ` (si encaja, reutiliza exactamente una de: ${subs.join(', ')})` : ''}, summary, overview (markdown), minutes.
- kind: exercises (ejercicios), reading (leer/estudiar un texto), writing (redacción/ensayo), language (ejercicios de idiomas: gramática, vocabulario), project, exam_prep (temario/apuntes/guía de un examen) u other.
- language: idioma en que están escritos los enunciados o el texto (de-DE si es alemán…).
- tasks: una por ejercicio o pregunta (máx. 14; agrupa apartados a), b), c) del mismo ejercicio).
  - statement: copia el enunciado literal; fórmulas en LaTeX con $.
  - concept: la idea clave.
  - hint: una pista, sin resolver.
  - steps: de 3 a 8 pasos que ENSEÑAN el razonamiento, no solo el cálculo (cada uno: qué se hace y por qué, con los números del ejercicio). En idiomas: explica la regla (caso, posición del verbo, género, conjugación…) y luego aplícala. En redacción: da un plan (estructura, ideas, conectores), NO escribas el texto entero.
  - answer: solo el resultado final (en idiomas, la frase o palabra correcta).
- Si hay un texto que leer o estudiar (p. ej. una lectura en alemán): reading = transcripción completa en su idioma, reading_translation = traducción al español, y vocab con 8-20 palabras útiles (en alemán, sustantivos con artículo: «der Hund»), con una frase de ejemplo corta en ese idioma. Si no, reading y reading_translation vacíos y vocab puede ser [] o vocabulario clave.
- due_date: SOLO si aparece escrita en el material; si no, "".
- Explica todo en español (salvo el contenido del idioma que se estudia).

CALENDARIO DEL ESTUDIANTE (próximos 60 días):
${calendarContextText()}
- related_id: si estos deberes tratan del mismo tema/materia que un examen o evento de esa lista, el id EXACTO (sin "id="); si no hay relación clara, "". related_reason: una frase.`;
  const content = [...sourcesBlocks(sources), { type: 'text', text: prompt }];
  return ai({ system: SYS(), messages: [{ role: 'user', content }], schema: SCHEMA.hw, max_tokens: 16000, ...opts });
}

async function createHomework({ sources, due = '', subject = '', note = '', asExam = false }) {

async function prepareHomework(id) {
  const hw = byId('homework', id); if (!hw) return;
  const r = await analyzeHomework({ sources: hw.sources, note: hw.note, subject: hw.subject, due: hw.due, asExam: hw.asExam });
  const subs = subjectsList(); const same = subs.find((x) => x.toLowerCase() === String(r.subject || '').toLowerCase());
  hw.title = r.title || hw.title; hw.subject = hw.subject || same || r.subject || 'General';
  hw.kind = r.kind || 'other'; hw.language = r.language || 'es-ES'; hw.minutes = r.minutes || 0;
  hw.summary = r.summary; hw.overview = r.overview;
  hw.tasks = (r.tasks || []).map((t) => ({ id: uid(), title: t.title, statement: t.statement, concept: t.concept, hint: t.hint, steps: t.steps || [], answer: t.answer, revealed: 0, done: false }));
  hw.reading = r.reading || ''; hw.readingTr = r.reading_translation || ''; hw.vocab = r.vocab || [];
  hw.due = hw.due || (/^\d{4}-\d{2}-\d{2}$/.test(r.due_date || '') && r.due_date >= todayISO() ? r.due_date : '');
  const rel = r.related_id && (byId('events', r.related_id) || byId('exams', r.related_id));
  if (rel) { hw.relatedId = rel.id; hw.relatedKind = byId('events', rel.id) ? 'event' : 'exam'; hw.relatedReason = r.related_reason || ''; }
  hw.status = 'ready'; hw.err = '';
  // the calendar entry
  if (hw.due && hw.kind !== 'exam_prep') {
    const ev = { id: uid(), title: `Deberes: ${hw.title}`, type: 'homework', date: hw.due, subject: hw.subject, done: false, hwId: hw.id };
    await save('events', ev); hw.eventId = ev.id;
  }
  await save('homework', hw);
  await addAlert({ title: `Deberes listos: ${hw.title}`, body: `${hw.tasks.length} ${hw.tasks.length === 1 ? 'tarea' : 'tareas'} explicadas paso a paso${hw.due ? ' · entrega ' + relDay(hw.due).toLowerCase() : ''}`, href: '#/hw/' + hw.id, kind: 'hw' });
  if (rel) {
    const when = rel.date ? ` (${fmtDate(rel.date)}, ${relDay(rel.date).toLowerCase()})` : '';
    await addAlert({ title: `Estos deberes entran en un examen: ${rel.title}`, body: `${hw.relatedReason || 'Mismo tema'}${when}`, href: '#/hw/' + hw.id, kind: 'exam' });
  }
  refreshHw(hw.id);
  runAutomations('homework', { hw, subject: hw.subject });
  if (hw.kind === 'exam_prep') {
    if (hw.due) await buildExamPack(hw.id, { auto: true });
    else await addAlert({ title: 'Parece material de un examen', body: 'Dime la fecha del examen y te preparo guía, test y flashcards.', href: '#/hw/' + hw.id, kind: 'exam' });
  }
}

/* ---------- exam pack: study set + flashcards + test + exam plan + reminders ---------- */
async function buildExamPack(id, { auto = false, opts = {} } = {}) {
  const hw = byId('homework', id); if (!hw) return;
  const o = { guide: true, cards: true, quiz: true, mock: true, remind: true, ...opts };
  const date = hw.examDate || hw.due || addDays(todayISO(), 7);
  const title = /examen/i.test(hw.title) ? hw.title : `Examen: ${hw.title}`;
  const run = async () => {
    const set = await genSet({ sources: hw.sources, title: hw.title, color: SET_COLORS[ST.sets.length % SET_COLORS.length], focus: ['memo', 'exam', 'understand'], custom: 'Material para un examen: prioriza lo que más probablemente se pregunta.' });
    set.subject = hw.subject || set.subject;
    await save('sets', set);
    if (o.cards) for (const t of allTopics(set)) { t.cards = await genCards(set, t); await save('sets', set); }
    if (o.quiz) for (const t of allTopics(set)) { t.quiz = await genQuiz(set, t, 6); await save('sets', set); }
    if (o.mock) { set.mock = await genQuiz(set, null, 10); await save('sets', set); }
    const r = await genExam({ title, date, subject: hw.subject, notes: hw.note || '', setIds: [set.id], sources: [] });
    const exam = examFromResult(r, { title, date, subject: hw.subject, notes: hw.note || '', setIds: [set.id], sources: [] });
    await save('exams', exam);
    hw.setId = set.id; hw.examId = exam.id; hw.examDate = date;
    let ev = hw.relatedKind === 'event' && byId('events', hw.relatedId);
    if (!ev) { ev = { id: uid(), title, type: 'exam', date, subject: hw.subject, done: false, hwId: hw.id }; }
    ev.examId = exam.id; await save('events', ev); hw.eventId = hw.eventId || ev.id;
    if (o.remind) for (const d of [3, 1]) if (daysUntil(date) >= d) {
      await addAlert({ title: d === 1 ? `Mañana: ${title}` : `En ${d} días: ${title}`, body: d === 1 ? 'Repaso final: mira tu chuleta y haz el simulacro.' : 'Tu guía, flashcards y test están listos para repasar.', href: '#/exam/' + exam.id, at: addDays(date, -d), kind: 'exam' });
      await save('events', { id: uid(), title: `Repasar: ${title}`, type: 'study', date: addDays(date, -d), time: '17:00', subject: hw.subject, done: false, hwId: hw.id });
    }
    hw.pack = true; await save('homework', hw);
    await addAlert({ title: `Pack de examen listo: ${hw.title}`, body: `Guía, ${o.cards ? 'flashcards, ' : ''}${o.quiz ? 'test, ' : ''}plan de estudio y avisos hasta el ${fmtDate(date)}.`, href: '#/exam/' + exam.id, kind: 'exam' });
    refreshHw(hw.id);
  };
  if (auto) return run();
  Jobs.add(`Pack de examen · ${hw.title}`, run);
  toast('Preparando tu pack de examen en segundo plano', 'info');
}

function openHwPlanner(hw) {

    <div class="row between wrap" style="margin-top:24px"><button class="btn btn-ghost" id="pics">${ic('dl')} Solo descargar .ics</button><button class="btn btn-primary" id="pgo">${ic('calplus')} Añadir al calendario</button></div>`, { cls: 'mid' });

      return { date: addDays(start, i), time, minutes: mins, title: `${isRead ? 'Leer' : 'Hacer'}: ${label}`, taskIds: part.map((t) => t.id) };
    });
  };
  $('#pics', m.el).onclick = () => downloadICS(hw.title, plan().map((p) => ({ title: p.title, date: p.date, time: p.time, minutes: p.minutes, desc: `${APP_NAME} · ${hw.summary || ''}` })));
  $('#pgo', m.el).onclick = async () => {
    for (const p of plan()) await save('events', { id: uid(), title: p.title, type: isRead ? 'read' : 'study', date: p.date, time: p.time, minutes: p.minutes, subject: hw.subject, done: false, hwId: hw.id, taskIds: p.taskIds });
    m.close(); toast('Añadido al calendario'); setTimeout(() => go('/calendar'), 500);
  };
}

/* ---------- text of a homework for prompts ---------- */
function hwText(hw, onlyTask) {
  let t = `DEBERES: ${hw.title} (${hw.subject || 'sin materia'}${hw.language ? ', idioma ' + hw.language : ''})\n${hw.summary || ''}\n\n${hw.overview || ''}\n`;
  for (const k of hw.tasks) {
    if (onlyTask && k.id !== onlyTask.id) continue;
    t += `\n## ${k.title}\nEnunciado: ${k.statement}\nIdea clave: ${k.concept}\nPasos:\n${(k.steps || []).map((s, i) => `${i + 1}. ${s}`).join('\n')}\nResultado: ${k.answer}\n`;
  }
  if (!onlyTask && hw.reading) t += `\n## Texto\n${hw.reading}\n`;
  return t;
}

const hwProgress = (h) => { const n = h.tasks.length; return n ? Math.round((h.tasks.filter((t) => t.done).length / n) * 100) : 0; };
function hwCard(h) {
  if (h.status === 'preparing') return `<div class="card hw-card prep"><div class="hw-top"><span class="hw-ico">${ic('hw')}</span><div class="grow"><b>${esc(h.title)}</b><div class="muted">Preparando… puedes seguir con otras cosas</div></div><span class="spin"></span></div><div class="bar indet"><i></i></div></div>`;
  if (h.status === 'error') return `<div class="card hw-card err"><div class="hw-top"><span class="hw-ico">${ic('x')}</span><div class="grow"><b>${esc(h.title)}</b><div class="muted">${esc(h.err || 'No se pudo preparar')}</div></div></div><div class="row" style="margin-top:12px;gap:8px"><button class="btn btn-primary btn-sm" data-retry="${h.id}">Reintentar</button><button class="btn btn-ghost btn-sm" data-del="${h.id}">Borrar</button></div></div>`;
  const p = hwProgress(h), rel = h.relatedId && (byId('events', h.relatedId) || byId('exams', h.relatedId));
  return `<a class="card hw-card spot" href="#/hw/${h.id}"><div class="hw-top"><span class="hw-ico">${ic(h.kind === 'reading' || h.kind === 'language' ? 'book' : h.kind === 'exam_prep' ? 'target' : 'hw')}</span><div class="grow"><b>${esc(h.title)}</b><div class="hw-sub">${h.subject ? `<span class="pill acc">${esc(h.subject)}</span>` : ''}${hwDueChip(h)}${rel ? `<span class="pill warn">${ic('target')} Relacionado con un examen</span>` : ''}</div></div></div><div class="hw-foot"><div class="bar"><i style="width:${p}%"></i></div><span class="muted">${h.tasks.filter((t) => t.done).length}/${h.tasks.length} tareas</span></div></a>`;
}
function pageHomework(v) {
  const all = [...ST.homework].sort((a, b) => (a.due || '9999').localeCompare(b.due || '9999') || b.createdAt - a.createdAt);
  const prep = all.filter((h) => h.status !== 'ready'), open = all.filter((h) => h.status === 'ready' && !h.done), done = all.filter((h) => h.status === 'ready' && h.done);
  v.innerHTML = `<div class="page narrow">
    <div class="hero"><div class="grow"><h1>Deberes<span>Sube la foto. Knowly lo prepara.</span></h1><p>Haz una captura de tus deberes y déjala trabajando: los explica paso a paso (sin hacértelos), mira si hay un examen relacionado, los pone en el calendario y te deja un tutor para las dudas.</p></div><button class="btn btn-primary btn-lg" id="hnew">${ic('upload')} Subir deberes</button></div>
    <div class="drop quick" id="hdrop"><h3>Suelta aquí capturas, fotos o PDF</h3><p class="muted">También puedes pegar con ⌘V / Ctrl+V.</p></div>
    ${prep.length ? `<h2 class="sec-title">En preparación</h2><div class="hw-grid">${prep.map(hwCard).join('')}</div>` : ''}
    <h2 class="sec-title">Pendientes</h2>${open.length ? `<div class="hw-grid">${open.map(hwCard).join('')}</div>` : '<p class="muted">Nada pendiente. Sube tus próximos deberes cuando los tengas.</p>'}
    ${done.length ? `<h2 class="sec-title">Hechos</h2><div class="hw-grid">${done.map(hwCard).join('')}</div>` : ''}</div>`;
  $('#hnew', v).onclick = () => openNewHomework({});
  const d = $('#hdrop', v);
  d.ondragover = (e) => { e.preventDefault(); d.classList.add('drag'); }; d.ondragleave = () => d.classList.remove('drag');
  d.ondrop = async (e) => { e.preventDefault(); d.classList.remove('drag'); openNewHomework({ files: [...e.dataTransfer.files] }); };
  const onPaste = (e) => { const f = [...(e.clipboardData ? e.clipboardData.files : [])]; if (f.length && !$('.overlay')) { e.preventDefault(); openNewHomework({ files: f }); } };
  document.addEventListener('paste', onPaste); CLEANUP.push(() => document.removeEventListener('paste', onPaste));
  $$('[data-retry]', v).forEach((b) => (b.onclick = () => { queueHomework(byId('homework', b.dataset.retry)); }));
  $$('[data-del]', v).forEach((b) => (b.onclick = async () => { await remove('homework', b.dataset.del); route(); }));
}
function openNewHomework({ sources = [], files = [], subject = '', due = '' }) {
  const m = openModal(`<h2>Subir deberes</h2><p class="lead">Fotos, capturas, PDF o el texto. Si son varias páginas, súbelas todas.</p>
    <div id="hbox"></div>
    <div class="row wrap" style="gap:14px;margin-top:18px"><div class="grow"><label class="lbl" style="margin-top:0">Entrega (opcional)</label><input class="inp" type="date" id="hd" value="${due}" min="${todayISO()}"></div><div class="grow"><label class="lbl" style="margin-top:0">Materia (opcional)</label><input class="inp" id="hs" value="${esc(subject)}" list="hsl" placeholder="La IA la detecta"><datalist id="hsl">${subjectsList().map((s) => `<option value="${esc(s)}">`).join('')}</datalist></div></div>
    <textarea class="inp" id="hn" rows="2" style="margin-top:14px" placeholder="¿Algo que deba saber? «No entiendo las fracciones», «el profe pidió resumir en 10 líneas»…"></textarea>
    <label class="check" style="margin-top:14px"><input type="checkbox" id="hx"> Es material para un examen (preparo guía, test y flashcards)</label>
    <div class="row between" style="margin-top:18px"><span class="muted row" style="gap:6px">${ic('info')} Se prepara en segundo plano</span><button class="btn btn-primary btn-lg" id="hgo" disabled>${ic('spark')} Preparar</button></div>`, { cls: 'wide' });
  const el = m.el;
  const box = sourceBox($('#hbox', el), { sources, hint: false, onChange: (s) => { $('#hgo', el).disabled = !s.length; } });
  if (files.length) box.addFiles(files);
  $('#hgo', el).disabled = !box.count();
  $('#hgo', el).onclick = async () => {
    const srcs = box.get(); if (!srcs.length) return;
    const hw = await createHomework({ sources: srcs, due: $('#hd', el).value, subject: $('#hs', el).value.trim(), note: $('#hn', el).value.trim(), asExam: $('#hx', el).checked });
    m.close();
    toast('Preparando tus deberes en segundo plano. Te aviso cuando estén.', 'info');
    if (!location.hash.startsWith('#/homework')) go('/homework'); else route();
    return hw;
  };
}

/* =================== detail page =================== */
function pageHw(v, id, q) {
  const hw = byId('homework', id);

    v.innerHTML = `<div class="page narrow"><a class="back" href="#/homework">${ic('left')} Deberes</a><div class="card" style="margin-top:24px;text-align:center;padding:48px 24px">${hw.status === 'error' ? `<h2>No se pudo preparar</h2><p class="muted">${esc(hw.err || '')}</p><button class="btn btn-primary" id="rt">Reintentar</button>` : `<span class="spin" style="width:32px;height:32px"></span><h2 style="margin-top:20px">Preparando «${esc(hw.title)}»…</h2><p class="muted">Puedes irte a otra sección: se queda trabajando y te avisa.</p>`}</div></div>`;
    const rt = $('#rt', v); if (rt) rt.onclick = () => { queueHomework(hw); route(); };
    if (hw.status === 'preparing') { const t = setInterval(() => { const h = byId('homework', id); if (h && h.status !== 'preparing') { clearInterval(t); route(); } }, 1500); CLEANUP.push(() => clearInterval(t)); }
    return;
  }
  const st = { view: q.t ? 'task' : 'overview', task: q.t || (hw.tasks[0] && hw.tasks[0].id), checked: {} };
  const persist = () => save('homework', hw);
  const lang = hw.language || 'es-ES';
