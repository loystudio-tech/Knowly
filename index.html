<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Knowly · Estudio con IA</title>
<meta name="description" content="Knowly: sube tus apuntes y obtén guías, flashcards, quizzes, simulacros, pizarra, podcast, skills y automatizaciones.">
<meta name="theme-color" content="#1b212d" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f6fa" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Knowly">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script>try{var s=JSON.parse(localStorage.getItem('knowly.settings')||'{}');if(s.theme)document.documentElement.dataset.theme=s.theme}catch(e){}</script>
<style>
:root{
  --bg:#0d0c14;--bg2:#12101d;--panel:rgba(20,18,32,.72);--card:#171526;--card2:#1f1c31;--card3:#29253f;
  --line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);--edge:rgba(255,255,255,.09);
  --text:#f4f2ff;--text2:#cbc6e3;--muted:#8e89aa;
  --accent:#8b5cf6;--accent2:#a78bfa;--accent3:#c4b5fd;--accent-strong:#7c3aed;
  --accent-soft:rgba(139,92,246,.15);--accent-soft2:rgba(139,92,246,.28);--glow:rgba(139,92,246,.45);
  --grad:linear-gradient(135deg,#a07bff 0%,#8b5cf6 45%,#6d28d9 100%);
  --good:#22c55e;--good-soft:rgba(34,197,94,.14);--warn:#f5a524;--warn-soft:rgba(245,165,36,.15);--bad:#f4645f;--bad-soft:rgba(244,100,95,.14);
  --paper:#fbf8f1;--paper-ink:#2b2a33;
  --shadow:0 18px 50px -12px rgba(0,0,0,.55);--shadow-sm:0 6px 18px -6px rgba(0,0,0,.45);
  --r-lg:26px;--r:20px;--r-sm:14px;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-h:'Bricolage Grotesque','Inter',system-ui,sans-serif;
  --font-hand:'Caveat','Bradley Hand','Comic Sans MS',cursive;
  --ease:cubic-bezier(.2,.8,.2,1);
  --aurora-o:.55;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f7f5ff;--bg2:#efebff;--panel:rgba(255,255,255,.74);--card:#ffffff;--card2:#f5f1ff;--card3:#ebe4ff;
  --line:rgba(76,29,149,.08);--line2:rgba(76,29,149,.15);--edge:rgba(76,29,149,.10);
  --text:#1c1830;--text2:#3d3756;--muted:#716b8c;
  --accent:#7c3aed;--accent2:#7c3aed;--accent3:#6d28d9;--accent-strong:#6d28d9;
  --accent-soft:rgba(124,58,237,.09);--accent-soft2:rgba(124,58,237,.17);--glow:rgba(124,58,237,.30);
  --shadow:0 18px 50px -14px rgba(76,29,149,.22);--shadow-sm:0 6px 18px -8px rgba(76,29,149,.25);
  --aurora-o:.7;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden;font-feature-settings:'cv11','ss01'}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
a{color:var(--accent2)}
h1,h2,h3,h4{font-family:var(--font-h);margin:0;line-height:1.15;letter-spacing:-.022em;font-weight:700}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hidden{display:none!important}
::selection{background:var(--accent-soft2)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:10px;border:3px solid transparent;background-clip:padding-box}
:focus-visible{outline:2px solid var(--accent2);outline-offset:2px;border-radius:10px}
kbd{font-family:var(--font);font-size:11.5px;font-weight:600;padding:2px 6px;border-radius:6px;background:var(--card3);border:1px solid var(--line2);color:var(--text2)}

/* ---------- aurora (the one bold moment) ---------- */
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;opacity:var(--aurora-o)}
.aurora i{position:absolute;border-radius:50%;filter:blur(90px);will-change:transform}
.aurora i:nth-child(1){width:52vw;height:52vw;left:-12vw;top:-26vw;background:radial-gradient(circle,rgba(139,92,246,.55),transparent 65%);animation:drift1 28s ease-in-out infinite alternate}
.aurora i:nth-child(2){width:42vw;height:42vw;right:-14vw;top:-8vw;background:radial-gradient(circle,rgba(99,102,241,.45),transparent 65%);animation:drift2 34s ease-in-out infinite alternate}
.aurora i:nth-child(3){width:38vw;height:38vw;left:30vw;bottom:-30vw;background:radial-gradient(circle,rgba(217,70,239,.30),transparent 65%);animation:drift3 40s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(14vw,10vw) scale(1.15)}}
@keyframes drift2{to{transform:translate(-10vw,14vw) scale(.9)}}
@keyframes drift3{to{transform:translate(-12vw,-10vw) scale(1.2)}}
.aurora::after{content:'';position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1px);background-size:3px 3px;mix-blend-mode:overlay}

/* ---------- layout ---------- */
.app{display:flex;height:100vh;height:100dvh;position:relative;z-index:1}
.sidebar{width:280px;flex:none;background:var(--panel);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px 14px;transition:width .25s var(--ease),padding .25s var(--ease);overflow:hidden;padding-top:max(20px,env(safe-area-inset-top))}
.sb-top{display:flex;align-items:center;justify-content:space-between;padding:0 8px 18px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--font-h);font-weight:700;font-size:22px;white-space:nowrap;letter-spacing:-.03em;text-decoration:none;color:inherit}
.logo svg{width:36px;height:36px;flex:none;filter:drop-shadow(0 6px 14px var(--glow))}
.icon-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--muted);transition:background .15s,color .15s,transform .15s}
.icon-btn:hover{background:var(--card2);color:var(--text)}
.icon-btn:active{transform:scale(.94)}
.search-btn{display:flex;align-items:center;gap:10px;width:100%;height:42px;padding:0 12px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--muted);margin-bottom:16px;font-size:14px;white-space:nowrap;transition:border-color .15s}
.search-btn:hover{border-color:var(--line2);color:var(--text2)}
.search-btn kbd{margin-left:auto}
.nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto;margin:0 -4px;padding:0 4px}
.nav-label{font-size:12.5px;font-weight:600;color:var(--muted);padding:16px 14px 6px;white-space:nowrap}
.nav a{position:relative;display:flex;align-items:center;gap:13px;padding:11px 14px;border-radius:13px;color:var(--text2);text-decoration:none;font-weight:600;font-size:15px;white-space:nowrap;transition:background .15s,color .15s}
.nav a:hover{background:var(--card);color:var(--text)}
.nav a.on{background:var(--card2);color:var(--text)}
.nav a.on::before{content:'';position:absolute;left:-4px;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--grad);box-shadow:0 0 12px var(--glow)}
.nav a.on svg{color:var(--accent2)}
.nav .badge{margin-left:auto;font-size:11.5px;font-weight:700;min-width:22px;height:22px;padding:0 7px;border-radius:99px;background:var(--accent);color:#fff;display:grid;place-items:center}
.sb-bottom{border-top:1px solid var(--line);padding-top:12px;display:flex;align-items:center;gap:6px}
.user{flex:1;display:flex;align-items:center;gap:10px;padding:7px;border-radius:12px;font-weight:600;color:var(--text2);white-space:nowrap;overflow:hidden;min-width:0}
.user:hover{background:var(--card)}
.user span{overflow:hidden;text-overflow:ellipsis}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--grad);display:grid;place-items:center;color:#fff;font-size:14px;font-weight:700;flex:none}
.streak{display:flex;align-items:center;gap:4px;font-weight:700;font-size:13px;color:#ff9b45;padding:0 6px}
.streak svg{width:17px;height:17px;stroke:#ff9b45}
.sidebar.mini{width:76px;padding-left:12px;padding-right:12px}
.sidebar.mini .logo span,.sidebar.mini .nav a span,.sidebar.mini .nav .badge,.sidebar.mini .user span,.sidebar.mini .sb-collapse,.sidebar.mini .nav-label,.sidebar.mini .search-btn span,.sidebar.mini .search-btn kbd,.sidebar.mini .streak{display:none}
.sidebar.mini .sb-top{justify-content:center;padding:0 0 18px}
.sidebar.mini .search-btn{justify-content:center;padding:0}
.sidebar.mini .nav a{justify-content:center;padding:12px 0}
.sidebar.mini .nav-label{display:block;height:1px;padding:0;margin:10px 8px;background:var(--line);font-size:0}
.sidebar.mini .sb-bottom{flex-direction:column}
.sidebar.mini .user{justify-content:center;padding:6px;flex:none}
.main{flex:1;min-width:0;overflow:auto;position:relative;scroll-behavior:smooth}
#view>*{animation:pageIn .38s var(--ease)}
@keyframes pageIn{from{opacity:0;transform:translateY(8px)}}
.page{max-width:1400px;margin:0 auto;padding:44px 52px 90px}
.page.narrow{max-width:1180px}
.mtop{display:none}
.bnav{display:none}

/* ---------- surfaces ---------- */
.card{background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(180deg,var(--edge),transparent 70%) border-box;border:1px solid transparent;border-radius:var(--r-lg)}
:root[data-theme="light"] .card{box-shadow:0 1px 2px rgba(76,29,149,.04),0 8px 24px -16px rgba(76,29,149,.18)}
.spot{position:relative;overflow:hidden;isolation:isolate}
@media (hover:hover){
  .spot::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),rgba(167,139,250,.14),transparent 45%);z-index:-1}
  .spot:hover::after{opacity:1}
}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.sec-title{font-size:25px;margin:48px 0 18px}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:48px 0 18px}
.sec-head .sec-title{margin:0}
.link{color:var(--accent2);font-weight:600;font-size:15px;text-decoration:none}
.link:hover{text-decoration:underline}
.empty{padding:40px;text-align:center;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--card3);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--grad);border-radius:99px;transition:width .6s var(--ease)}
.skel{border-radius:10px;background:linear-gradient(90deg,var(--card2) 0%,var(--card3) 50%,var(--card2) 100%);background-size:200% 100%;animation:shimmer 1.4s linear infinite;height:14px;margin:10px 0}
@keyframes shimmer{to{background-position:-200% 0}}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 22px;border-radius:99px;font-weight:600;font-size:15px;transition:transform .15s var(--ease),box-shadow .2s,background .2s,filter .2s;white-space:nowrap;text-decoration:none;position:relative}
.btn svg.i{width:18px;height:18px}
.btn:active:not(:disabled){transform:scale(.97)}
.btn-primary{background:var(--grad);color:#fff;box-shadow:0 8px 22px -6px var(--glow),inset 0 1px 0 rgba(255,255,255,.25)}
.btn-primary:hover:not(:disabled){filter:brightness(1.08);box-shadow:0 12px 28px -6px var(--glow),inset 0 1px 0 rgba(255,255,255,.25)}
.btn-primary:disabled{background:var(--card3);color:var(--muted);box-shadow:none;cursor:not-allowed}
.btn-soft{background:var(--accent-soft);color:var(--accent2)}
.btn-soft:hover{background:var(--accent-soft2)}
.btn-ghost{background:var(--card2);color:var(--text);border:1px solid var(--line)}
.btn-ghost:hover{background:var(--card3)}
.btn-line{border:1px solid var(--line2);color:var(--text)}
.btn-line:hover{background:var(--card2)}
.btn-white{background:#fff;color:#2a1660}
.btn-white:hover{filter:brightness(.96)}
.btn-sm{height:36px;padding:0 14px;font-size:14px}
.btn-lg{height:54px;padding:0 30px;font-size:16.5px}
.btn-danger{background:var(--bad-soft);color:var(--bad)}
.btn:disabled{cursor:not-allowed;opacity:.85}
.chip{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 15px;border-radius:12px;border:1px solid var(--line2);color:var(--text2);font-weight:500;transition:background .15s,border-color .15s,color .15s;white-space:nowrap;position:relative}
.chip:hover{background:var(--card2);color:var(--text)}
.chip.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 70%,transparent);color:var(--accent2)}
.chip .new{position:absolute;top:-9px;right:-6px;background:linear-gradient(135deg,#ff7a7a,#f43f5e);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;box-shadow:0 4px 10px rgba(244,63,94,.4)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:4px 11px;border-radius:99px;background:var(--card3);color:var(--text2);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.acc{background:var(--accent-soft);color:var(--accent2)}
.count{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:99px;font-size:12px;background:var(--card3);margin-left:6px}
input.inp,textarea.inp,select.inp{width:100%;background:var(--card2);border:1px solid var(--line2);border-radius:14px;padding:12px 14px;outline:none;transition:border-color .15s,box-shadow .15s}
input.inp:focus,textarea.inp:focus,select.inp:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
label.lbl{display:block;font-weight:600;font-size:14px;margin:16px 0 8px;color:var(--text2)}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.switch{position:relative;width:46px;height:28px;border-radius:99px;background:var(--card3);transition:background .2s;flex:none}
.switch::after{content:'';position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .25s var(--ease)}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(18px)}
.seg2{display:flex;background:var(--card2);border-radius:14px;padding:4px;gap:4px}
.seg2 button{flex:1;padding:10px;border-radius:10px;font-weight:600;color:var(--text2);transition:.15s}
.seg2 button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow-sm)}

/* ---------- home ---------- */
.home-top{display:flex;justify-content:flex-end;gap:10px;margin:-18px 0 0}
.home-hero{text-align:center;margin:26px 0 28px}
.home-hero .hi{font-size:16px;color:var(--muted);font-weight:500;margin-bottom:10px}
.home-title{font-size:clamp(34px,4.4vw,58px);font-weight:800;letter-spacing:-.04em;background:linear-gradient(180deg,var(--text) 30%,var(--accent3));-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:4px}
.seg{position:relative;display:flex;width:max-content;margin:0 auto 30px;background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:5px;gap:2px}
.seg button{position:relative;z-index:1;display:flex;align-items:center;gap:8px;height:44px;padding:0 20px;border-radius:99px;font-weight:600;font-size:15.5px;color:var(--text2);transition:color .2s}
.seg button.on{color:#fff}
.seg .thumb{position:absolute;top:5px;bottom:5px;border-radius:99px;background:var(--grad);box-shadow:0 6px 18px -4px var(--glow);transition:left .35s var(--ease),width .35s var(--ease)}
.composer{position:relative;max-width:1300px;margin:0 auto;background:var(--card);border-radius:28px;padding:18px;display:flex;flex-direction:column;min-height:330px;border:1px solid var(--line2);transition:border-color .2s,box-shadow .3s}
.composer::before{content:'';position:absolute;inset:-1px;border-radius:inherit;padding:1.5px;background:conic-gradient(from var(--ang,0deg),transparent 0 60%,#a78bfa 75%,#e879f9 85%,transparent 95%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:opacity .4s;pointer-events:none}
.composer:focus-within{border-color:transparent;box-shadow:0 20px 60px -20px var(--glow)}
.composer:focus-within::before{opacity:1;animation:spinang 4s linear infinite}
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
@keyframes spinang{to{--ang:360deg}}
.composer.drag{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.composer .tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.composer .ta-wrap{display:flex;gap:10px;align-items:flex-start;flex:1;position:relative}
.composer .tag{flex:none;margin-top:7px;background:var(--accent-soft);color:var(--accent2);font-weight:600;font-size:13.5px;padding:3px 10px;border-radius:8px}
.composer textarea{flex:1;border:0;outline:none;background:transparent;resize:none;font-size:18px;min-height:140px;padding:5px 0;line-height:1.6}
.composer textarea::placeholder,.chat-in input::placeholder{color:var(--muted)}
.composer .foot{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.active-skills{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0}
.skill-pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:5px 10px;border-radius:10px;background:linear-gradient(135deg,rgba(167,139,250,.22),rgba(232,121,249,.14));color:var(--accent2);border:1px solid var(--accent-soft2)}
.skill-pill svg.i{width:15px;height:15px}
.sq-btn{width:46px;height:46px;border-radius:14px;border:1px solid var(--line2);display:grid;place-items:center;color:var(--text2);transition:.15s;flex:none}
.sq-btn:hover{background:var(--card2);color:var(--text)}
.sq-btn:active{transform:scale(.95)}
.model-sel{display:flex;align-items:center;gap:8px;font-weight:600;padding:0 10px;height:40px;border-radius:12px;color:var(--text2)}
.model-sel select{background:transparent;border:0;outline:none;font-weight:600;cursor:pointer}
.model-sel select option{background:var(--card)}
.attach-list{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0}
.att{position:relative;display:flex;align-items:center;gap:8px;background:var(--card2);border:1px solid var(--line2);border-radius:12px;padding:6px 30px 6px 6px;font-size:13px;max-width:240px;animation:pop .2s var(--ease)}
.att img{width:40px;height:40px;object-fit:cover;border-radius:8px}
.att .ficon{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent2)}
.att span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att button{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.att button:hover{background:var(--card3);color:var(--text)}
.att button svg{width:14px;height:14px}
.slash{position:absolute;z-index:60;min-width:300px;max-width:420px;max-height:300px;overflow:auto;background:var(--card);border:1px solid var(--line2);border-radius:16px;box-shadow:var(--shadow);padding:6px;animation:pop .15s var(--ease)}
.slash .it{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:10px;text-align:left}
.slash .it.on,.slash .it:hover{background:var(--accent-soft)}
.slash .it b{font-size:14px}
.slash .it small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slash .head{font-size:12px;color:var(--muted);padding:6px 10px 4px;font-weight:600}
.sk-ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#a78bfa,#e879f9);color:#fff;flex:none;font-size:17px}
.examples{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.ex-card{padding:14px;text-align:left;transition:transform .25s var(--ease)}
.ex-card:hover{transform:translateY(-3px)}
.ex-art{height:180px;border-radius:14px;background:var(--card2);overflow:hidden;display:grid;place-items:center;padding:12px}
.ex-art svg{width:100%;height:100%}
.ex-card h4{font-size:18px;margin:14px 6px 8px}
.ex-card .pill{margin:0 6px 4px}
.feat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.feat{padding:14px}
.feat .ex-art{height:200px;display:block;padding:14px;font-size:11px}
.feat h4{font-size:18px;margin:14px 6px 8px}
.mini-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center;font-size:10px;margin-top:8px}
.mini-cal b{font-weight:500;color:var(--muted);font-size:8px}
.mini-cal i{font-style:normal;padding:4px 0;border-radius:6px;background:var(--card3)}
.mini-cal i.t{background:var(--accent);color:#fff}.mini-cal i.x{outline:2px solid var(--bad)}

/* solution */
.solve-wrap{max-width:960px;margin:0 auto}
.q-card{background:var(--card2);border-radius:18px;padding:16px 18px;margin-bottom:18px;white-space:pre-wrap;border:1px solid var(--line)}
.final{position:relative;overflow:hidden;background:linear-gradient(135deg,rgba(139,92,246,.22),rgba(139,92,246,.04));border:1px solid var(--accent-soft2);border-radius:18px;padding:16px 20px;margin-bottom:22px}
.final small{display:block;font-weight:700;color:var(--accent2);font-size:13px;margin-bottom:4px}
.final .v{font-size:21px;font-weight:600;color:var(--text)}
.sol{counter-reset:step}
.sol h3{counter-increment:step;position:relative;padding-left:46px;font-size:18px;margin:26px 0 10px}
.sol h3::before{content:counter(step);position:absolute;left:0;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;background:var(--accent-soft);border:2px solid var(--accent);color:var(--accent2);display:grid;place-items:center;font-size:14px;font-weight:700;font-family:var(--font)}
.sol h3+*{margin-left:46px}
.follow{display:flex;gap:10px;margin-top:22px;position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:20px 0 14px}
.follow input{flex:1}

/* ---------- markdown ---------- */
.md{line-height:1.7;color:var(--text2);overflow-wrap:anywhere}
.md>:first-child{margin-top:0}.md>:last-child{margin-bottom:0}
.md h1,.md h2,.md h3,.md h4{color:var(--text);margin:22px 0 10px}
.md h1{font-size:24px}.md h2{font-size:21px}.md h3{font-size:18px}
.md p{margin:0 0 12px}
.md ul,.md ol{padding-left:22px;margin:0 0 12px}
.md li{margin:5px 0}
.md li::marker{color:var(--accent2)}
.md strong{color:var(--text)}
.md code{background:var(--card3);padding:2px 6px;border-radius:6px;font-size:.92em}
.md pre{background:var(--card2);padding:14px;border-radius:12px;overflow:auto}
.md pre code{background:none;padding:0}
.md table{border-collapse:collapse;width:100%;margin:10px 0;font-size:14px;display:block;overflow:auto}
.md th,.md td{border:1px solid var(--line2);padding:8px 10px;text-align:left}
.md th{background:var(--card2)}
.md blockquote{margin:0 0 12px;padding:8px 16px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0}
.md details{border:1px solid var(--line2);border-radius:12px;padding:10px 14px;margin:8px 0 14px;background:var(--card2)}
.md summary{cursor:pointer;font-weight:600;color:var(--accent2)}
.md .katex-display{overflow-x:auto;overflow-y:hidden;padding:4px 0}
.cursor::after{content:'';display:inline-block;width:8px;height:18px;background:var(--accent2);margin-left:3px;vertical-align:-3px;animation:blink 1s steps(2) infinite;border-radius:2px}
@keyframes blink{50%{opacity:0}}

/* ---------- study hub ---------- */
.hub-top{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px}
.jump{display:flex;align-items:center;gap:28px;padding:30px 34px}
.jump h3{font-size:23px;margin-bottom:12px}
.jump .meta{display:flex;gap:20px;color:var(--muted);font-size:15px;margin-bottom:16px;align-items:center;flex-wrap:wrap}
.jump .meta span{display:flex;align-items:center;gap:7px}
.review-card{position:relative;overflow:hidden;padding:26px 28px;border-radius:var(--r-lg);background:linear-gradient(140deg,#7c3aed,#5b21b6 60%,#3b1a80);color:#fff;display:flex;flex-direction:column;gap:6px;box-shadow:0 20px 50px -18px rgba(124,58,237,.6)}
.review-card::after{content:'';position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 65%)}
.review-card .n{font-family:var(--font-h);font-size:46px;font-weight:800;line-height:1}
.review-card p{margin:0;opacity:.85}
.review-card .btn{align-self:flex-start;margin-top:10px}
.qtools{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.qt{position:relative;overflow:hidden;border-radius:var(--r-lg);padding:28px 34px;min-height:140px;display:flex;align-items:center;justify-content:space-between;text-align:left;color:#fff;transition:transform .3s var(--ease),box-shadow .3s;text-decoration:none;isolation:isolate;box-shadow:inset 0 1px 0 rgba(255,255,255,.22)}
.qt::after{content:'';position:absolute;right:-70px;top:-40px;width:230px;height:230px;border-radius:50%;background:rgba(255,255,255,.12);z-index:-1;transition:transform .5s var(--ease)}
.qt::before{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.22) 48%,transparent 62%);transform:translateX(-120%);transition:transform .8s var(--ease);z-index:-1}
@media (hover:hover){.qt:hover{transform:translateY(-4px);box-shadow:0 22px 40px -18px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.22)}.qt:hover::before{transform:translateX(120%)}.qt:hover::after{transform:scale(1.12)}.qt:hover .qt-art{transform:rotate(-2deg) scale(1.06)}}
.qt>div:first-child{flex:1;min-width:0;padding-right:14px}
.qt h3{font-size:clamp(21px,1.8vw,28px);font-weight:700;color:#fff}
.qt p{margin:4px 0 0;font-size:15.5px;opacity:.88}
.qt-art{position:relative;width:70px;height:78px;border-radius:16px;background:#fff;display:grid;place-items:center;transform:rotate(-7deg);flex:none;box-shadow:0 10px 20px -6px rgba(0,0,0,.3);transition:transform .4s var(--ease)}
.qt-art svg.i{width:38px;height:38px;stroke-width:2.2}
.qt-art::before{content:'';position:absolute;inset:-7px -9px auto auto;width:18px;height:18px;background:#fff;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
.subjects{display:flex;gap:8px;flex-wrap:wrap;margin:-4px 0 18px}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:18px}
.set-card{padding:24px 26px;min-height:180px;display:flex;flex-direction:column;text-align:left;transition:transform .25s var(--ease);text-decoration:none;color:inherit}
.set-card:hover{transform:translateY(-2px)}
.set-card .emoji{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:23px;margin-bottom:14px}
.set-card h3{font-size:20px;margin-bottom:8px}
.set-card .sub{color:var(--muted);font-size:14px;margin-bottom:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.set-card .foot{display:flex;align-items:center;gap:14px;margin-top:20px;color:var(--muted);font-size:13.5px}
.set-card .foot .bar{flex:1}
.new-card{display:flex;align-items:center;justify-content:center;gap:16px;min-height:180px;color:var(--accent2);font-size:20px;font-weight:600;border:1.5px dashed var(--line2)!important;background:transparent!important;border-radius:var(--r-lg);transition:background .2s,border-color .2s}
.new-card:hover{background:var(--accent-soft)!important;border-color:var(--accent)!important}
.new-card .plus{width:54px;height:54px;border-radius:50%;background:var(--card2);display:grid;place-items:center;color:var(--text)}
.alert{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:18px;background:var(--accent-soft);border:1px solid var(--accent-soft2);margin-bottom:10px;flex-wrap:wrap}
.alert .when{font-weight:700;color:var(--accent2)}
#rem:not(:empty){margin-bottom:26px}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(6,5,14,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:grid;place-items:center;z-index:50;padding:20px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--panel);backdrop-filter:blur(30px) saturate(1.4);-webkit-backdrop-filter:blur(30px) saturate(1.4);border:1px solid var(--line2);border-radius:28px;width:min(620px,100%);max-height:calc(100dvh - 40px);overflow:auto;padding:34px 40px;position:relative;box-shadow:var(--shadow);animation:pop .25s var(--ease)}
:root[data-theme="light"] .modal{background:rgba(255,255,255,.92)}
.modal.wide{width:min(1180px,100%)}
.modal.mid{width:min(860px,100%)}
@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}}
.modal .x{position:absolute;right:20px;top:20px}
.modal h2{font-size:27px;margin-bottom:6px}
.modal .lead{color:var(--muted);margin:0 0 20px}
.src-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0 20px}
.src-tab{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 10px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;font-weight:600;font-size:16px;transition:.2s var(--ease)}
.src-tab:hover{background:var(--card2);transform:translateY(-2px)}
.src-tab.on{border-color:var(--accent);background:var(--card2);box-shadow:0 0 0 3px var(--accent-soft)}
.src-ico{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 8px 16px -8px rgba(0,0,0,.5)}
.src-ico svg.i{width:26px;height:26px;stroke-width:2.1}
.drop{border-radius:22px;background:var(--card);border:1.5px dashed var(--line2);padding:40px 20px;text-align:center;transition:.2s}
.drop.drag{border-color:var(--accent);background:var(--accent-soft)}
.drop h3{font-size:21px;margin:16px 0 6px}
.drop-art{display:flex;justify-content:center}
.drop-art div{width:52px;height:64px;border-radius:10px;margin:0 -8px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:20px;font-family:var(--font-h);box-shadow:0 6px 14px rgba(0,0,0,.25);transition:transform .3s var(--ease)}
.drop:hover .drop-art div:nth-child(1){transform:rotate(-18deg) translateX(-6px)}
.drop:hover .drop-art div:nth-child(5){transform:rotate(18deg) translateX(6px)}
.colors{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.colors button{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#fff;transition:transform .15s}
.colors button:hover{transform:scale(1.1)}
.colors button.on{box-shadow:0 0 0 3px var(--bg),0 0 0 5px currentColor}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:12px 30px;margin-top:8px}
.check{display:flex;align-items:center;gap:12px;font-size:16px;cursor:pointer}
.check input{appearance:none;-webkit-appearance:none;width:24px;height:24px;border:2px solid var(--line2);border-radius:7px;display:grid;place-items:center;cursor:pointer;flex:none;transition:.15s;margin:0}
.check input:checked{background:var(--accent);border-color:var(--accent)}
.check input:checked::after{content:'';width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.title-inp{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:22px}
.title-inp i{width:24px;height:24px;border-radius:6px;flex:none;transition:background .2s}
.title-inp input{flex:1;border:0;outline:none;background:transparent;font-size:19px;font-weight:600;min-width:0}
.gen{text-align:center;padding:16px 0 6px}
.gen-orb{position:relative;width:96px;height:96px;margin:0 auto 22px}
.gen-orb::before{content:'';position:absolute;inset:-6px;border-radius:30px;background:conic-gradient(from 0deg,#a78bfa,#e879f9,#6366f1,#a78bfa);animation:spin 2.4s linear infinite;filter:blur(10px);opacity:.8}
.gen-orb div{position:absolute;inset:0;border-radius:26px;background:var(--grad);display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.gen-orb svg{width:46px;height:46px;stroke:#fff;animation:breathe 1.8s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{50%{transform:scale(1.1)}}
.gen .bar{max-width:380px;margin:18px auto 8px}
.gen-steps{display:flex;flex-direction:column;gap:8px;max-width:300px;margin:16px auto 18px;text-align:left}
.gen-steps div{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14.5px;transition:color .3s}
.gen-steps div i{width:20px;height:20px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;flex:none;transition:.3s}
.gen-steps div.on{color:var(--text)}
.gen-steps div.on i{border-color:var(--accent);border-right-color:transparent;animation:spin .8s linear infinite}
.gen-steps div.done{color:var(--text2)}
.gen-steps div.done i{background:var(--good);border-color:var(--good);animation:none}
.gen-steps div.done i::after{content:'';width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.spin{width:18px;height:18px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;flex:none}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:var(--card3);color:var(--text);padding:12px 18px 12px 14px;border-radius:16px;box-shadow:var(--shadow);z-index:90;font-weight:500;max-width:min(560px,92vw);animation:toastIn .35s var(--ease);border:1px solid var(--line2)}
.toast .ti{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--good);color:#fff;flex:none}
.toast .ti svg{width:15px;height:15px;stroke-width:2.6}
.toast.err .ti{background:var(--bad)}
.toast.info .ti{background:var(--accent)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,16px) scale(.96)}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:95}

/* ---------- command palette ---------- */
.pal-ov{place-items:start center;padding-top:12vh}
.pal{width:min(640px,100%);padding:0;overflow:hidden}
.pal-in{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.pal-in input{flex:1;border:0;outline:none;background:transparent;font-size:18px;min-width:0}
.pal-list{max-height:min(420px,60vh);overflow:auto;padding:8px}
.pal-it{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:12px;text-align:left;color:var(--text2)}
.pal-it .pi{width:32px;height:32px;border-radius:10px;background:var(--card2);display:grid;place-items:center;flex:none;font-size:16px}
.pal-it.on{background:var(--accent-soft);color:var(--text)}
.pal-it.on .pi{background:var(--accent);color:#fff}
.pal-it small{margin-left:auto;color:var(--muted);font-size:12.5px;white-space:nowrap}
.pal-sec{font-size:12px;font-weight:600;color:var(--muted);padding:10px 12px 4px}
.pal-foot{display:flex;gap:14px;padding:10px 18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}

/* ---------- jobs (background automations) ---------- */
.jobs{position:fixed;right:22px;bottom:22px;z-index:45;width:320px;background:var(--panel);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--line2);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;animation:pop .25s var(--ease)}
.jobs-head{display:flex;align-items:center;gap:10px;padding:12px 14px;font-weight:600;font-size:14px;cursor:pointer}
.jobs-list{padding:0 10px 10px;display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto}
.job{display:flex;align-items:center;gap:10px;font-size:13px;padding:8px 10px;border-radius:10px;background:var(--card2)}
.job .st{width:18px;height:18px;display:grid;place-items:center;flex:none}
.job.ok .st{color:var(--good)}.job.err .st{color:var(--bad)}
.job .st svg{width:16px;height:16px;stroke-width:2.6}
.jobs.min .jobs-list{display:none}

/* ---------- set page ---------- */
.set-layout{display:grid;grid-template-columns:360px minmax(0,1fr) 390px;gap:18px;padding:26px 30px;height:100vh;height:100dvh;min-height:0}
.pane{background:var(--panel);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:28px;min-height:0;overflow:auto}
:root[data-theme="light"] .pane{background:rgba(255,255,255,.85)}
.set-left{padding:24px 24px}
.back{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:99px;padding:6px 16px 6px 12px;font-weight:500;font-size:14.5px;text-decoration:none;color:var(--text);transition:background .15s}
.back:hover{background:var(--card2)}
.set-left h1{font-size:26px;font-weight:700;margin:24px 0 20px;line-height:1.25}
.tabs{display:flex;gap:26px;border-bottom:1px solid var(--line);margin-bottom:18px;position:relative}
.tabs button{padding:0 0 12px;font-weight:600;font-size:16px;color:var(--muted);border-bottom:2.5px solid transparent;margin-bottom:-1px;transition:color .2s,border-color .2s}
.tabs button:hover{color:var(--text2)}
.tabs button.on{color:var(--text);border-color:var(--accent)}
.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
.filters button{height:36px;padding:0 11px;border-radius:99px;border:1px solid var(--line2);font-weight:500;font-size:14px;color:var(--text2);transition:.15s}
.filters button.on{border-color:var(--accent);color:var(--accent2);background:var(--accent-soft)}
.side-item{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:1px solid var(--line2);border-radius:14px;font-weight:500;font-size:15px;margin-bottom:8px;text-align:left;transition:.15s}
.side-item:hover,.side-item.on{background:var(--card2)}
.side-item.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sec-h{display:flex;align-items:center;gap:10px;width:100%;padding:10px 4px 8px 12px;border-left:3px solid var(--accent);font-weight:700;font-size:14.5px;text-align:left;margin-top:14px;color:var(--text)}
.sec-h .grow{line-height:1.4}
.sec-h svg{transition:transform .25s var(--ease)}
.sec-h.closed svg{transform:rotate(-90deg)}
.topic{display:flex;align-items:center;gap:12px;width:100%;padding:11px 13px;border-radius:12px;text-align:left;font-size:15px;margin:2px 0;color:var(--text2);transition:background .15s}
.topic:hover{background:var(--card2)}
.topic.on{background:var(--accent-soft);color:var(--accent2);font-weight:600}
.dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--muted);flex:none;display:grid;place-items:center}
.dot.mastered{border-color:var(--good);background:var(--good)}
.dot.mastered::after{content:'';width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.dot.review{border-color:var(--warn);background:conic-gradient(var(--warn) 50%,transparent 0)}
.set-center{padding:34px 38px}
.topic-head{display:flex;gap:24px;align-items:flex-start;margin-bottom:24px}
.topic-head h2{font-size:31px;margin-bottom:12px}
.topic-head p{margin:0;color:var(--text2);font-size:16.5px;line-height:1.65}
.ring{flex:none;text-align:center;font-size:12px;color:var(--muted)}
.ring svg{width:84px;height:84px;display:block;margin:0 auto 4px}
.ring circle.prog{transition:stroke-dashoffset 1s var(--ease)}
.guide-box{border:1px solid var(--line2);border-radius:24px;padding:24px 28px;margin-bottom:28px;background:var(--card)}
.guide-box .tabs{border:0;margin-bottom:16px}
.guide-box .tabs button{font-size:19px;font-family:var(--font-h)}
.stats{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.stat{display:flex;align-items:center;gap:7px;border:1px solid var(--line2);border-radius:99px;padding:6px 13px;font-weight:600;font-size:14px}
.guide-body{max-height:300px;overflow:hidden;position:relative;font-size:16px}
.guide-body.open{max-height:none}
.guide-body:not(.open)::after{content:'';position:absolute;left:0;right:0;bottom:0;height:90px;background:linear-gradient(transparent,var(--card))}
.practice{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.pcard{border:1px solid var(--line2);border-radius:24px;padding:22px 24px;background:linear-gradient(180deg,var(--card2),var(--card));display:flex;flex-direction:column}
.pcard h3{display:flex;align-items:center;gap:10px;font-size:21px;margin-bottom:12px}
.pcard h3 svg{color:var(--accent2);width:24px;height:24px}
.pcard .row{justify-content:space-between;color:var(--text2);margin-bottom:12px}
.pcard .btn{width:100%;margin-top:auto}
.pcard>p{margin:0 0 16px}
.chat{display:flex;flex-direction:column;padding:0}
.chat-head{display:flex;align-items:center;gap:6px;padding:16px 18px 10px}
.chat-head b{font-size:16.5px;flex:1;font-family:var(--font-h)}
.msgs{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:92%;padding:11px 15px;border-radius:18px;font-size:15px;animation:pop .25s var(--ease)}
.msg.u{align-self:flex-end;background:var(--grad);color:#fff;border-bottom-right-radius:6px;white-space:pre-wrap}
.msg.a{align-self:flex-start;background:var(--card2);border-bottom-left-radius:6px;border:1px solid var(--line)}
.msg.a .md{font-size:15px;color:var(--text)}
.chat-hello{margin:auto;text-align:center;padding:20px}
.chat-hello .logo svg{width:56px;height:56px}
.chat-hello h3{font-size:21px;margin:16px 0 8px}
.chat-hello p{color:var(--text2);margin:0}
.sugs{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.sugs button{border:1px solid var(--line2);border-radius:12px;padding:9px 12px;font-size:14px;text-align:left;color:var(--text2);transition:.15s}
.sugs button:hover{background:var(--card2);border-color:var(--accent-soft2)}
.chat-in{display:flex;gap:8px;padding:12px 14px 14px;align-items:center;position:relative}
.chat-in .box{flex:1;display:flex;align-items:center;border:1px solid var(--line2);border-radius:99px;padding:0 6px 0 16px;background:var(--card);transition:border-color .15s,box-shadow .15s}
.chat-in .box:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.chat-in input{flex:1;border:0;outline:none;background:transparent;height:46px;min-width:0}
.mic-on{background:var(--bad)!important;color:#fff!important;animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(244,100,95,.15)}}
.chat-fab{display:none}
.chat-close{display:none}
.sources-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.src-thumb{border-radius:12px;overflow:hidden;background:var(--card2);border:1px solid var(--line2);text-align:left}
.src-thumb img{width:100%;height:110px;object-fit:cover;display:block}
.src-thumb div{padding:8px 10px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src-thumb .ph{height:110px;display:grid;place-items:center;color:var(--accent2);background:var(--accent-soft)}

/* flashcards / quiz */
.runner{max-width:820px;margin:0 auto}
.runner-top{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.runner-top .bar{flex:1}
.flip{perspective:1600px;height:360px;cursor:pointer;margin-bottom:22px}
.flip-in{position:relative;width:100%;height:100%;transition:transform .6s var(--ease);transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:36px;text-align:center;font-size:24px;font-weight:600;border:1px solid var(--line2);background:var(--card2);overflow:auto;box-shadow:var(--shadow-sm)}
.face .md{color:var(--text);font-size:21px;font-weight:500}
.face small{position:absolute;top:18px;left:24px;font-size:13px;color:var(--muted);font-weight:600}
.face.back{transform:rotateY(180deg);background:linear-gradient(135deg,rgba(139,92,246,.28),var(--card2))}
.fc-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:15px 18px;border:1.5px solid var(--line2);border-radius:16px;margin-bottom:10px;font-size:16px;transition:.15s;background:var(--card)}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt .k{width:32px;height:32px;border-radius:10px;background:var(--card3);display:grid;place-items:center;font-weight:700;flex:none}
.opt.ok{border-color:var(--good);background:var(--good-soft);animation:okpop .4s var(--ease)}.opt.ok .k{background:var(--good);color:#fff}
.opt.no{border-color:var(--bad);background:var(--bad-soft);animation:shake .4s}.opt.no .k{background:var(--bad);color:#fff}
@keyframes okpop{40%{transform:scale(1.015)}}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.opt .md{color:var(--text)}
.qtext{font-size:21px;font-weight:600;margin-bottom:22px}
.qtext .md{color:var(--text);font-size:21px}
.expl{border-radius:16px;padding:16px 18px;background:var(--card2);margin:10px 0 18px;border:1px solid var(--line);animation:pop .25s var(--ease)}
.score{text-align:center;padding:28px 20px}
.score .big{font-family:var(--font-h);font-size:68px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* whiteboard */
.board-wrap{max-width:1180px;margin:0 auto}
.paper{background:var(--paper);color:var(--paper-ink);border-radius:24px;padding:40px 54px;min-height:480px;background-image:radial-gradient(#d9d4c6 1px,transparent 1px);background-size:22px 22px;box-shadow:var(--shadow);font-family:var(--font-hand)}
.paper h2{font-family:var(--font-hand);font-size:46px;font-weight:700;margin-bottom:20px;color:#3b2f7a;letter-spacing:0}
.bstep{margin:0 0 26px -20px;padding-left:16px;border-left:4px solid transparent;transition:opacity .4s,border-color .3s;animation:write .7s var(--ease)}
.bstep.dim{opacity:.45}
.bstep.cur{border-left-color:#a78bfa}
@keyframes write{from{opacity:0;clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.bstep h3{font-family:var(--font-hand);font-size:33px;font-weight:700;color:#5b21b6;margin-bottom:8px;letter-spacing:0}
.bstep .md{font-family:var(--font-hand);font-size:27px;color:var(--paper-ink);line-height:1.45}
.bstep .md strong{color:#1e1b2e}
.bstep .md li::marker{color:#7c3aed}
.bstep .md code{background:#efe9d9}
.bstep .art{max-width:360px;margin:6px 0 4px}
.bstep .art svg{width:100%;height:auto}
.board-ctrl{display:flex;align-items:center;gap:10px;justify-content:center;margin:20px 0;flex-wrap:wrap}
.narr{text-align:center;color:var(--text2);font-size:17px;min-height:52px;max-width:860px;margin:0 auto}

/* exams */
.hero{display:flex;align-items:flex-end;gap:30px;margin:6px 0 50px}
.hero h1{font-size:clamp(38px,4.6vw,62px);font-weight:800;line-height:1.02;letter-spacing:-.045em}
.hero h1 span{display:block;font-size:.58em;letter-spacing:-.03em;margin-top:.25em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.08em}
.hero p{font-size:18px;color:var(--text2);max-width:720px;margin:18px 0 0;line-height:1.6}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px}
.exam-card{overflow:hidden;text-align:left;transition:transform .25s var(--ease);display:flex;flex-direction:column;text-decoration:none;color:inherit}
.exam-card:hover{transform:translateY(-2px)}
.exam-card .top{padding:28px 28px;background:linear-gradient(135deg,rgba(139,92,246,.42),rgba(139,92,246,.05));display:flex;align-items:center;gap:14px}
.exam-card .top b{font-size:20px;color:var(--text);font-family:var(--font-h);font-weight:700;letter-spacing:-.02em}
.exam-card .ico{min-width:52px;height:52px;border-radius:14px;background:var(--grad);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;flex:none;font-weight:800;font-family:var(--font-h);font-size:20px;line-height:1;box-shadow:0 8px 18px -6px var(--glow)}
.exam-card .ico small{font-size:10px;font-weight:600;font-family:var(--font);opacity:.85;margin-top:2px}
.exam-card .bot{padding:20px 28px 24px;display:flex;flex-direction:column;gap:10px;color:var(--text2)}
.exam-card .bot span{display:flex;align-items:center;gap:8px}
.dashed{border:1.5px dashed var(--line2);background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-height:240px;font-weight:600;font-size:18px;border-radius:var(--r-lg);transition:.2s}
.dashed:hover{background:var(--accent-soft);border-color:var(--accent)}
.dashed .plus{width:56px;height:56px;border-radius:50%;background:var(--card2);display:grid;place-items:center}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin:16px 0 24px}
.wday{border-radius:16px;padding:12px 6px;text-align:center;background:var(--card2);border:1.5px solid transparent;transition:.15s}
.wday:hover{border-color:var(--line2)}
.wday small{display:block;color:var(--muted);font-size:12px;font-weight:600}
.wday b{font-size:20px;font-family:var(--font-h)}
.wday.today{background:var(--grad);color:#fff;box-shadow:0 8px 20px -8px var(--glow)}.wday.today small{color:#ede9fe}
.wday.sel{border-color:var(--accent2)}
.wday.exam{border-color:var(--bad);background:var(--bad-soft)}
.wday.past{opacity:.45}
.wday .dots{height:6px;display:flex;justify-content:center;gap:3px;margin-top:4px}
.wday .dots i{width:5px;height:5px;border-radius:50%;background:var(--accent2)}
.wday.today .dots i{background:#fff}
.task{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--line2);border-radius:14px;margin-bottom:10px;cursor:pointer;transition:.15s}
.task:hover{background:var(--card2)}
.task.done span{text-decoration:line-through;color:var(--muted)}
.ttable{width:100%;border-collapse:collapse}
.ttable th{font-size:13px;color:var(--muted);text-align:left;padding:10px 12px;font-weight:600}
.ttable td{padding:16px 12px;border-top:1px solid var(--line);vertical-align:middle}
.ttable td .bar{width:120px}
.mock{padding:24px;display:flex;flex-direction:column;gap:10px}
.mock .ico{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent2);display:grid;place-items:center}
.mock h3{font-size:20px}
.mock .big{font-family:var(--font-h);font-size:34px;font-weight:800;color:var(--accent2)}

/* calendar */
.cal-layout{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:22px}
.cal{padding:24px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-grid .dn{text-align:center;font-size:12.5px;color:var(--muted);font-weight:600;padding:6px 0}
.cday{min-height:92px;border-radius:14px;background:var(--card2);padding:8px;text-align:left;display:flex;flex-direction:column;gap:4px;border:1.5px solid transparent;overflow:hidden;transition:.15s}
.cday:hover{border-color:var(--line2)}
.cday.other{opacity:.35}
.cday.today{border-color:var(--accent)}
.cday.sel{background:var(--accent-soft)}
.cday .n{font-weight:600;font-size:14px}
.ev{font-size:11.5px;padding:2px 7px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.ev.exam{background:var(--bad-soft);color:var(--bad)}.ev.homework{background:var(--accent-soft);color:var(--accent2)}.ev.other{background:var(--good-soft);color:var(--good)}
.ev-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;margin-bottom:10px}
.ev-row .d{width:44px;text-align:center;flex:none}
.ev-row .d b{display:block;font-size:20px;font-family:var(--font-h);line-height:1}
.ev-row .d small{color:var(--muted);font-size:11.5px}

/* review */
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,14px);grid-auto-columns:14px;justify-content:start;gap:4px;overflow-x:auto;padding-bottom:4px}
.heat i{width:14px;height:14px;border-radius:4px;background:var(--card3)}
.heat i.l1{background:rgba(139,92,246,.35)}.heat i.l2{background:rgba(139,92,246,.6)}.heat i.l3{background:#8b5cf6}.heat i.l4{background:#c4b5fd}
.statbox{padding:22px 24px}
.statbox .n{font-family:var(--font-h);font-size:38px;font-weight:800;line-height:1.05}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}

/* skills & automations */
.sk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.sk-card{padding:22px 24px;display:flex;flex-direction:column;gap:10px;text-decoration:none;color:inherit;transition:transform .25s var(--ease);min-height:170px}
.sk-card:hover{transform:translateY(-2px)}
.sk-card .slug{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13.5px;color:var(--accent2);background:var(--accent-soft);padding:3px 8px;border-radius:8px;align-self:flex-start}
.sk-card p{margin:0;color:var(--text2);font-size:14.5px}
.tpl-row{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 4px}
.tpl{border:1px solid var(--line2);border-radius:14px;padding:10px 14px;text-align:left;font-size:14px;max-width:260px;transition:.15s}
.tpl:hover{background:var(--card2);border-color:var(--accent-soft2)}
.tpl b{display:block;margin-bottom:2px}
.tpl small{color:var(--muted)}
.auto-card{padding:22px 24px;display:flex;gap:18px;align-items:flex-start}
.auto-card h3{font-size:19px;margin-bottom:8px}
.flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--text2)}
.flow .tr{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-weight:600}
.flow .ac{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:10px;background:var(--accent-soft);color:var(--accent2);font-weight:600}
.flow svg.i{width:15px;height:15px}
.trig-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.trig{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:14px;border:1px solid var(--line2);border-radius:16px;transition:.15s}
.trig:hover{background:var(--card2)}
.trig.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px var(--accent-soft)}
.trig b{display:block;font-size:15px}
.trig small{color:var(--muted);font-size:13px}
.act-row{display:flex;gap:10px;align-items:center;padding:12px;border:1px solid var(--line2);border-radius:14px;margin-bottom:8px;background:var(--card);flex-wrap:wrap;animation:pop .2s var(--ease)}
.act-row .num{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:12.5px;font-weight:700;flex:none}
.act-row select.inp,.act-row input.inp{width:auto;flex:1;min-width:140px;padding:9px 12px}
.act-row textarea.inp{flex-basis:100%;padding:10px 12px}
.runs{font-size:12.5px;color:var(--muted);margin-top:8px}

/* handwriting */
.ink-wrap{border-radius:18px;overflow:hidden;border:1px solid var(--line2);background:#fffefb;touch-action:none}
.ink-wrap canvas{display:block;width:100%;height:min(62vh,560px);touch-action:none;cursor:crosshair;background-image:linear-gradient(#eef0f6 1px,transparent 1px);background-size:100% 34px}
.ink-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.ink-color{width:30px;height:30px;border-radius:50%;border:3px solid transparent}
.ink-color.on{box-shadow:0 0 0 2px var(--accent)}

/* writing */
.wtools{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 20px;overflow-x:auto}
.wtools button{display:flex;align-items:center;gap:8px;padding:19px 14px 15px;font-weight:600;font-size:15px;color:var(--text2);border-bottom:2.5px solid transparent;white-space:nowrap;transition:.15s}
.wtools button.on{color:var(--accent2);border-color:var(--accent)}
.wpanes{display:grid;grid-template-columns:1fr 1fr;min-height:600px}
.wpane{padding:26px 32px;display:flex;flex-direction:column;position:relative}
.wpane+.wpane{border-left:1px solid var(--line)}
.wpane h3{font-size:19px;margin-bottom:12px}
.wpane textarea{flex:1;border:0;outline:none;background:transparent;resize:none;font-size:17px;line-height:1.65;min-height:300px}
.wfoot{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:16px;margin-top:12px}

/* live notes */
.notes-layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:22px}
.rec{padding:40px;text-align:center}
.rec-btn{width:120px;height:120px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;margin:10px auto 18px;box-shadow:0 14px 34px -8px var(--glow);transition:.2s}
.rec-btn svg.i{width:48px;height:48px}
.rec-btn.on{background:var(--bad);animation:pulse 1.2s infinite}
.transcript{text-align:left;min-height:220px;max-height:420px;overflow:auto;background:var(--card2);border-radius:18px;padding:18px 20px;font-size:17px;line-height:1.7;margin-top:22px;white-space:pre-wrap;outline:none;border:1px solid var(--line)}
.transcript i{color:var(--muted)}
.note-item{display:block;width:100%;text-align:left;padding:14px 16px;border-radius:14px;border:1px solid var(--line);margin-bottom:10px;transition:.15s}
.note-item:hover,.note-item.on{background:var(--card2)}
.note-item small{color:var(--muted)}

/* podcast */
.pod{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow:auto;padding-right:6px}
.pline{display:flex;gap:12px;padding:10px 12px;border-radius:14px;transition:background .3s;cursor:pointer}
.pline.cur{background:var(--accent-soft)}
.pline .who{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;color:#fff}
.pod-player{display:flex;align-items:center;gap:14px;margin:18px 0}
.play-big{width:64px;height:64px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;box-shadow:0 10px 24px -8px var(--glow);flex:none}
.play-big svg.i{width:28px;height:28px}
.eq{display:flex;gap:3px;align-items:flex-end;height:18px}
.eq i{width:3px;background:var(--accent2);border-radius:2px;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}.eq i:nth-child(4){animation-delay:.1s}
@keyframes eq{0%,100%{height:4px}50%{height:18px}}

/* more sheet (mobile) */
.sheet-ov{place-items:end center;padding:0}
.sheet{width:100%;border-radius:26px 26px 0 0;padding:14px 18px calc(18px + env(safe-area-inset-bottom));max-height:80dvh;animation:sheetIn .3s var(--ease)}
@keyframes sheetIn{from{transform:translateY(40px);opacity:0}}
.sheet-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.sheet-grid a,.sheet-grid button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 6px;border-radius:16px;background:var(--card2);color:var(--text);text-decoration:none;font-weight:600;font-size:13.5px;text-align:center}

/* ---------- responsive ---------- */
@media (max-width:1250px){
  .set-layout{grid-template-columns:340px minmax(0,1fr);padding:22px}
  .set-layout .chat{position:fixed;right:16px;bottom:16px;top:16px;width:min(420px,calc(100vw - 32px));z-index:40;box-shadow:var(--shadow);display:none}
  .set-layout .chat.open{display:flex;animation:pop .25s var(--ease)}
  .chat-close{display:grid}
  .chat-fab{display:grid;position:fixed;right:22px;bottom:22px;width:60px;height:60px;border-radius:50%;background:var(--grad);color:#fff;place-items:center;z-index:39;box-shadow:0 12px 30px -8px var(--glow);transition:transform .2s var(--ease)}
  .chat-fab:hover{transform:scale(1.06)}
  .chat-fab svg.i{width:26px;height:26px}
}
@media (max-width:1400px){
  .examples,.feat-grid{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:1200px){
  .qtools{grid-template-columns:repeat(2,1fr)}
  .page{padding:34px 30px 90px}
  .cal-layout{grid-template-columns:1fr}
  .hub-top{grid-template-columns:1fr}
  .set-layout{grid-template-columns:300px minmax(0,1fr)}
}
@media (max-width:1000px){
  .set-layout{display:block;padding:14px;height:auto}
  .set-layout .pane{margin-bottom:14px;overflow:visible}
  .notes-layout{grid-template-columns:1fr}
  .wpanes{grid-template-columns:1fr}
  .wpane+.wpane{border-left:0;border-top:1px solid var(--line)}
  .trig-grid{grid-template-columns:1fr}
  .stat-grid{grid-template-columns:1fr 1fr}
}
@media (max-width:700px){
  .sidebar{display:none}
  .mtop{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));border-bottom:1px solid var(--line);background:var(--panel);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);position:sticky;top:0;z-index:20}
  .mtop .logo{font-size:20px}.mtop .logo svg{width:32px;height:32px}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--panel);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);z-index:30;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bnav a,.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);text-decoration:none;padding:6px 0;border-radius:12px}
  .bnav a.on{color:var(--accent2)}
  .main{padding-bottom:80px}
  .page{padding:20px 16px 100px}
  .home-top{margin:0}
  .seg{width:100%}.seg button{flex:1;justify-content:center;padding:0 8px;font-size:14px;height:42px}.seg button svg{display:none}
  .composer{min-height:280px;padding:14px;border-radius:22px}
  .composer textarea{font-size:16px}
  .examples,.feat-grid,.qtools,.sets,.practice,.lib,.sk-grid{grid-template-columns:1fr}
  .qt{padding:22px 24px;min-height:112px}
  .jump{flex-direction:column;align-items:stretch;padding:22px;gap:16px}
  .sec-title{font-size:22px;margin:32px 0 14px}.sec-head{margin:32px 0 14px}
  .set-left{padding:20px}.set-center{padding:22px 18px}
  .set-left h1{font-size:23px;margin:18px 0 14px}
  .topic-head{flex-direction:column-reverse;gap:10px}.topic-head h2{font-size:25px}
  .modal{padding:26px 20px;border-radius:22px}
  .modal h2{font-size:23px}
  .src-tabs{grid-template-columns:repeat(2,1fr)}
  .checks{grid-template-columns:1fr}
  .hero{flex-direction:column;align-items:flex-start;margin-bottom:30px}.hero p{font-size:16px}
  .paper{padding:24px 20px}.paper h2{font-size:34px}.bstep h3{font-size:26px}.bstep .md{font-size:22px}
  .flip{height:300px}
  .face{font-size:19px;padding:24px}
  .cday{min-height:56px;padding:5px}.cday .ev{font-size:0;padding:0;height:5px;border-radius:3px}
  .week{gap:4px}.wday{padding:8px 2px}.wday b{font-size:16px}
  .ttable td .bar{width:60px}
  .chat-fab{bottom:92px}
  .jobs{left:12px;right:12px;width:auto;bottom:88px}
  .stat-grid{grid-template-columns:1fr}
  .slash{min-width:0;left:0!important;right:0}
  .toast{bottom:calc(88px + env(safe-area-inset-bottom))}
}
/* touch (iPad / iPhone): bigger targets, no iOS zoom on focus */
@media (pointer:coarse){
  .icon-btn{width:44px;height:44px}
  .chip{height:44px}
  .filters button{height:40px}
  input.inp,textarea.inp,select.inp,.chat-in input,.composer textarea,.wpane textarea,.title-inp input,.pal-in input{font-size:16px}
  .btn-sm{height:40px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .aurora i{animation:none}
}
@media print{
  .sidebar,.mtop,.bnav,.no-print,.aurora,.chat-fab,.jobs{display:none!important}
  body{overflow:visible;background:#fff;color:#000}
  .main{overflow:visible}
  .md{color:#000}
}

/* =========================================================
   ESTILO "TAL CUAL" (colores medidos de las capturas)
   ========================================================= */
:root,:root[data-theme="dark"]{
  --bg:#1b212d;--bg-deep:#141821;--panel:#1b212d;--card:#242c3c;--card2:#2a3242;--card3:#2f3543;--composer:#222a38;--art:#202733;
  --line:#2f3543;--line2:#474c58;--edge:transparent;
  --text:#ffffff;--text2:#c9ccd3;--muted:#8b909c;
  --accent:#007aff;--accent2:#5aa9ff;--accent3:#a0ceff;--accent-strong:#0066d6;
  --accent-soft:#324b68;--accent-soft2:#3b6c9f;--glow:rgba(0,122,255,.35);
  --grad:#007aff;--nav-on:#323842;--seg:#324b68;--guide:#1e2636;--pcard1:#1d283b;--pcard2:#1d2739;--unavail:#28394f;
  --exam-top:linear-gradient(135deg,#312a53 0%,#23233b 100%);--exam-ico:#996aea;--exam-title:#9d6bff;
  --shadow:0 14px 35px -10px rgba(0,0,0,.6);--shadow-sm:0 4px 10px -6px rgba(0,0,0,.5);
  --font-h:'Poppins','Inter',system-ui,sans-serif;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f4f6fa;--bg-deep:#eceff5;--panel:#ffffff;--card:#ffffff;--card2:#f1f4f9;--card3:#e6eaf1;--composer:#ffffff;--art:#f1f4f9;
  --line:#e4e8ef;--line2:#cfd5df;--edge:transparent;
  --text:#141821;--text2:#3c4250;--muted:#6b7180;
  --accent:#007aff;--accent2:#0a6fe0;--accent3:#cfe5ff;--accent-strong:#0066d6;
  --accent-soft:#e3eefc;--accent-soft2:#cfe2fb;--glow:rgba(0,122,255,.25);
  --grad:#007aff;--nav-on:#eef1f6;--seg:#e3eaf5;--guide:#f7f9fc;--pcard1:#f3f7fd;--pcard2:#ffffff;--unavail:#e3eaf5;
  --exam-top:linear-gradient(135deg,#e9e1ff 0%,#f5f2ff 100%);--exam-ico:#996aea;--exam-title:#7c3aed;
  --shadow:0 14px 35px -14px rgba(20,24,33,.18);--shadow-sm:0 4px 10px -8px rgba(20,24,33,.2);
  color-scheme:light;
}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg)}
h1,h2,h3,h4{font-family:var(--font-h);letter-spacing:-.01em;font-weight:600}
.aurora{display:none}
#view>*{animation:fadeOnly .2s ease}
@keyframes fadeOnly{from{opacity:0}}

/* sidebar */
.sidebar{width:259px;background:var(--panel);backdrop-filter:none;-webkit-backdrop-filter:none;border-right:1px solid var(--line);padding:21px 15.5px 0}
.sb-top{padding:4px 4px 21px}
.logo{font-family:'Poppins',sans-serif;font-size:15px;font-weight:600;letter-spacing:0}
.logo svg{width:25.5px;height:25.5px;filter:none}
.search-btn,.nav-label,.sidebar .streak{display:none!important}
.nav{gap:5.5px}
.nav a{padding:10.5px 12.5px;border-radius:10px;font-family:'Poppins',sans-serif;font-weight:500;font-size:12.5px;color:var(--text);gap:11.5px}
.nav a svg.i{width:16px;height:16px;stroke-width:1.7}
.nav a:hover{background:var(--nav-on)}
.nav a.on{background:var(--nav-on)}
.nav a.on::before{display:none}
.nav a.on svg{color:var(--text)}
.nav .badge{background:var(--seg);color:var(--accent3);font-family:'Inter',sans-serif;font-size:9px;font-weight:500;height:17px;padding:0 7px}
.sb-bottom{border-top:1px solid var(--line);margin:0 -22px;padding:11.5px 15.5px 12.5px}
.user{font-weight:500;font-size:11.5px;color:var(--text2)}
.avatar{background:#2f80ed;width:21px;height:21px}
#sbtheme{background:var(--card3);border-radius:7px}
.sidebar.mini{width:56.5px;padding:21px 8.5px 0}
.sidebar.mini .nav a{padding:9px 0}
.sidebar.mini .nav a.on{background:#13549e;color:#fff}
:root[data-theme="light"] .sidebar.mini .nav a.on{background:var(--accent-soft);color:var(--accent)}
.sidebar.mini .nav a.on svg{color:inherit}
.sidebar.mini .sb-bottom{margin:0 -12px;padding:10px 8.5px}

/* surfaces */
.card{background:var(--card);border:0;border-radius:17px}
:root[data-theme="light"] .card{border:1px solid var(--line);box-shadow:none}
.spot::after{display:none}
.page{max-width:1042px;padding:34px 45px 63.5px}
.sec-title{font-size:22.5px;font-weight:600;margin:36.5px 0 15.5px}
.sec-head{margin:36.5px 0 15.5px}
.link{color:var(--accent3);font-size:14px;font-weight:500}
:root[data-theme="light"] .link{color:var(--accent)}

/* buttons */
.btn{font-family:'Poppins',sans-serif;font-weight:500}
.btn:active:not(:disabled){transform:none}
.btn-primary{background:var(--accent);box-shadow:none}
.btn-primary:hover:not(:disabled){background:#1a86ff;filter:none;box-shadow:none}
.btn-primary:disabled{background:var(--card3);color:var(--muted)}
.btn-soft{background:var(--seg);color:var(--accent3)}
:root[data-theme="light"] .btn-soft{color:var(--accent)}
.btn-ghost{background:var(--card3);border:0}
.btn-light{background:var(--accent3);color:#1b212d}
.btn-light:hover{filter:brightness(1.05)}
.chip{border-radius:7px;border:1px solid var(--line2);color:var(--text2);font-size:11.5px;height:32.5px;padding:0 11.5px}
.chip.on{background:var(--seg);border-color:var(--seg);color:var(--accent2)}
.chip .new{background:#ff4d4f;box-shadow:none;font-size:7.5px;top:-11px;right:-8px;padding:2px 5.5px}
.pill{border-radius:5.5px}
.pill.acc{background:var(--seg);color:var(--accent2)}
.sq-btn{border-radius:8.5px;border:1px solid var(--line2)}
input.inp,textarea.inp,select.inp{background:var(--card);border-color:var(--line2)}
:root[data-theme="light"] input.inp,:root[data-theme="light"] textarea.inp,:root[data-theme="light"] select.inp{background:#fff}

/* home */
.home-top{margin:-24px 0 0}
.home-top .btn{background:transparent;border:0;color:var(--text2);font-family:'Inter',sans-serif;font-size:12px;font-weight:500}
.home-hero{margin:18.5px 0 18.5px}
.home-hero .hi{display:none}
.home-title{font-family:'Inter',sans-serif;font-size:clamp(22.5px,4.2vw,41px);font-weight:700;letter-spacing:-.02em;color:var(--text);background:none;-webkit-background-clip:initial;background-clip:initial}
.seg{background:var(--seg);border:0;padding:4px}
.seg button{font-family:'Inter',sans-serif;font-size:12.5px;font-weight:500;color:var(--text2);height:32.5px}
.seg button.on{color:#fff}
.seg .thumb{background:var(--accent);box-shadow:0 0 0 4px rgba(0,122,255,.25)}
.composer{background:var(--composer);border:1px solid var(--line2);border-radius:19.5px;max-width:959px;min-height:262px;padding:12.5px}
.composer::before{display:none}
.composer:focus-within{border-color:var(--line2);box-shadow:none}
.composer .tag{background:var(--seg);color:var(--accent2);font-size:11.5px;padding:4px 7px}
.composer textarea{font-size:13.5px}
.model-sel{font-family:'Inter',sans-serif;font-size:11.5px;color:var(--text)}
.examples{gap:17px;max-width:959px}
.ex-card{background:var(--composer);border:1px solid var(--line);padding:8.5px;border-radius:17px}
.ex-card:hover{transform:none;border-color:var(--line2)}
.ex-art{background:var(--art);border:1px solid var(--line);height:141px}
.ex-card h4{font-family:'Inter',sans-serif;font-weight:600;font-size:15px}
.ex-card .pill{font-size:10.5px;font-weight:500;padding:4px 7px}
.feat{background:var(--composer);border:1px solid var(--line)}
.solve-wrap .final{background:var(--seg);border:0}

/* study hub */
.jump{padding:28px 41px;border-radius:17px}
.jump h3{font-family:'Inter',sans-serif;font-size:21px;font-weight:600}
.jump .meta{font-size:13.5px;color:var(--muted)}
.jump .btn{background:var(--accent3);color:#1b212d;height:53.5px;padding:0 31px;font-family:'Inter',sans-serif;font-size:16px;font-weight:500;box-shadow:none}
:root[data-theme="light"] .jump .btn{background:var(--accent);color:#fff}
.jump .bar{height:8.5px;background:#485162}
:root[data-theme="light"] .jump .bar{background:var(--card3)}
.jump .bar>i{background:var(--accent3)}
:root[data-theme="light"] .jump .bar>i{background:var(--accent)}
.review-card{background:linear-gradient(135deg,#2f80ed,#1556b8);box-shadow:none}
.qtools{gap:10px}
.qt{border-radius:17px;padding:21px 39.5px;min-height:104px;box-shadow:none}
.qt::before{display:none}
.qt::after{right:-110px;top:-60px;width:190px;height:190px;background:rgba(255,255,255,.13)}
.qt:hover{transform:none!important;box-shadow:none!important;filter:brightness(1.04)}
.qt h3{font-family:'Poppins',sans-serif;font-size:clamp(17px,2.1vw,24px);font-weight:600}
.qt p{font-family:'Poppins',sans-serif;font-size:13.5px;opacity:.85}
.qt-art{width:43.5px;height:49.5px;border-radius:8.5px;background:rgba(0,0,0,.18);border:3.5px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.12);transform:rotate(-4deg);color:#fff!important}
.qt-art svg.i{width:24px;height:24px;stroke:#fff;stroke-width:2.4}
.qt-art::before{inset:-10px -10px auto auto;width:11.5px;height:11.5px}
.qt:hover .qt-art{transform:rotate(-4deg)!important}
.sets{grid-template-columns:repeat(2,1fr);gap:11.5px}
.set-card{background:var(--card);border-radius:17px;padding:19.5px 21px;min-height:139.5px}
.set-card:hover{transform:none;background:var(--card2)}
.set-card .emoji{display:none}
.set-card h3{font-family:'Inter',sans-serif;font-size:19px;font-weight:600}
.set-card .foot .bar{max-width:60.5px;background:#485162}
.new-card{background:var(--card)!important;border:0!important;color:var(--accent3);font-family:'Inter',sans-serif;font-size:19px;font-weight:500;min-height:139.5px}
:root[data-theme="light"] .new-card{color:var(--accent);border:1px solid var(--line)!important}
.new-card .plus{width:48px;height:48px;background:var(--card3);color:var(--accent3)}
.new-card:hover{background:var(--card2)!important}
.alert{background:var(--seg);border:0}
.alert .when{color:var(--accent3)}
:root[data-theme="light"] .alert .when{color:var(--accent)}

/* modal */
.overlay{background:rgba(10,12,16,.6);backdrop-filter:blur(5.5px);-webkit-backdrop-filter:blur(5.5px)}
.modal{background:var(--panel);backdrop-filter:none;-webkit-backdrop-filter:none;border:0;border-radius:19.5px;padding:31px 35px}
:root[data-theme="light"] .modal{background:#fff}
.modal h2{font-family:'Poppins',sans-serif;font-size:21px;font-weight:600}
.modal .x{right:21px;top:21px}
.modal .x svg.i{width:18.5px;height:18.5px;color:var(--text)}
.src-tabs{grid-template-columns:repeat(4,1fr);gap:12.5px;margin:21px 0 19.5px}
.src-tab{background:var(--card);border:2px solid transparent;border-radius:11.5px;font-family:'Inter',sans-serif;font-size:16px;font-weight:600;padding:15.5px 7px}
.src-tab:hover{transform:none;background:var(--card2)}
.src-tab.on{border-color:var(--accent2);background:#27333f;box-shadow:none}
:root[data-theme="light"] .src-tab.on{background:var(--accent-soft)}
.src-ico{box-shadow:none;border-radius:7px;width:38px;height:38px}
.drop{background:var(--card);border:0;border-radius:17px;padding:39.5px 14px}
.drop h3{font-family:'Inter',sans-serif;font-size:19px;font-weight:600}
.drop .btn-ghost{background:#2f3a4f;color:var(--accent3);font-size:17px;height:43.5px;padding:0 28px;border-radius:8.5px}
:root[data-theme="light"] .drop .btn-ghost{background:var(--accent-soft);color:var(--accent)}
#custom{border:1.5px solid var(--accent2)!important;background:transparent!important;border-radius:15.5px!important;font-size:15.5px!important;color:var(--accent2)!important}
#custom::placeholder{color:var(--accent2)}
.title-inp{background:var(--card);border:0}
.colors button{border-radius:5.5px;width:24px;height:24px}
.colors button.on{box-shadow:none;outline:2px solid #fff;outline-offset:-2px}
.check input{border-radius:4px;border:2px solid var(--line2)}
.gen-orb::before{display:none}
.gen-orb div{background:var(--accent)}
.toast{background:var(--card3);border:0}

/* set page */
body:has(.set-layout) .main,body:has(.wpanes) .main{background:var(--bg-deep)}
.set-layout{grid-template-columns:352px minmax(0,1fr) 352px;gap:15.5px;padding:24px 24px}
.pane{background:var(--panel);backdrop-filter:none;-webkit-backdrop-filter:none;border:0;border-radius:21px}
:root[data-theme="light"] .pane{background:#fff;border:1px solid var(--line)}
.set-left{padding:21px 25.5px}
.back{font-size:13.5px;padding:5px 12.5px 5px 10px;border-color:var(--line2)}
.set-left h1{font-family:'Inter',sans-serif;font-size:23px;font-weight:500;line-height:1.38;margin:22.5px 0 18.5px}
.tabs button{font-family:'Inter',sans-serif;font-size:15px;font-weight:600;border-bottom-width:3px}
.tabs button.on{border-color:var(--accent2)}
.filters button{height:28px;border-radius:69.5px;border-color:var(--line2);font-size:12.5px;color:var(--text)}
.filters button.on{border-color:var(--accent2);background:transparent;color:var(--accent2)}
.filters .count{background:var(--card3)}
.side-item{border-color:var(--line2);border-radius:10px;font-size:14px;padding:10.5px 12.5px}
.side-item.on{border-color:var(--accent2);box-shadow:none;background:transparent}
.sec-h{text-transform:uppercase;font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;border-left:4px solid var(--accent2);letter-spacing:0;margin-top:12.5px;padding:4px 4px 4px 10px}
.topic{font-family:'Inter',sans-serif;font-size:14px;padding:10px 12.5px;color:var(--text)}
.topic.on{background:var(--seg);color:var(--accent2);font-weight:500}
.dot{border-color:var(--text2)}
.set-center{padding:28px 36.5px}
.topic-head h2{font-family:'Poppins',sans-serif;font-size:25.5px;font-weight:600}
.topic-head p{font-size:15px;color:var(--text2)}
.ring{font-size:10px}
.guide-box{background:var(--guide);border:1px solid var(--line);border-radius:19.5px;padding:24px 24px}
.guide-box .tabs button{font-family:'Inter',sans-serif;font-size:17.5px}
.stat{border-color:var(--line2);font-size:13.5px;font-weight:600;padding:5.5px 11.5px}
.guide-body{font-size:14px}
.guide-body.md{color:var(--text)}
.guide-body:not(.open)::after{background:linear-gradient(transparent,var(--guide))}
#gall{height:43.5px;padding:0 59px;font-family:'Inter',sans-serif;font-size:15.5px;font-weight:600}
.practice{gap:25.5px}
.pcard{background:linear-gradient(180deg,var(--pcard1),var(--pcard2));border:1px solid var(--line);border-radius:19.5px;padding:19.5px 25.5px}
.pcard h3{font-family:'Poppins',sans-serif;font-size:22px}
.pcard h3 svg{width:22.5px;height:22.5px;color:var(--accent)}
.pcard .row{font-size:15px}
.pcard .btn-soft{background:var(--unavail);color:var(--accent2)}
.chat-head{padding:21px 24px 4px}
.chat-head b{font-family:'Inter',sans-serif;font-size:15px}
.msgs{padding:11.5px 21px}
.chat-hello .logo svg{width:41px;height:41px}
.chat-hello h3{font-family:'Inter',sans-serif;font-size:17px}
.chat-hello p{font-size:14px}
.chat-in{padding:11.5px 21px 19.5px}
.chat-in .box{background:transparent;border-color:var(--line2);border-radius:69.5px}
.chat-in .box:focus-within{box-shadow:none;border-color:var(--accent2)}
.chat-in input{font-size:13.5px;height:36.5px}
.msg.u{background:var(--accent)}
.chat-fab{background:#2f80ed!important;box-shadow:none!important}

/* exams */
.hero h1{font-family:'Inter',sans-serif;font-size:clamp(28px,5vw,55px);font-weight:700;letter-spacing:-.025em;line-height:1.12}
.hero h1 span{font-size:1em;margin-top:0;letter-spacing:-.025em;background:none;-webkit-background-clip:initial;background-clip:initial;color:var(--accent)}
.hero p{font-family:'Inter',sans-serif;font-size:17px;color:var(--muted);max-width:633.5px}
.lib{grid-template-columns:repeat(auto-fill,minmax(281.5px,401.5px));gap:25.5px}
.exam-card{background:var(--panel);border:1px solid var(--line);border-radius:21px}
.exam-card:hover{transform:none}
.exam-card .top{background:var(--exam-top);padding:34px 24px}
.exam-card .top b{color:var(--exam-title);font-family:'Inter',sans-serif;font-size:17.5px;font-weight:500}
.exam-card .ico{background:var(--exam-ico);border-radius:5.5px;min-width:32.5px;height:32.5px;box-shadow:none;font-size:12px}
.exam-card .bot{padding:21px 24px 24px;font-size:13.5px;gap:11.5px}
.dashed{background:var(--panel);border:1.5px dashed var(--line2);border-radius:21px;font-family:'Inter',sans-serif;font-size:17px;font-weight:500}
.dashed .plus{background:#293549;width:48px;height:48px;color:var(--text2)}
:root[data-theme="light"] .dashed .plus{background:var(--card3)}
.dashed:hover{background:var(--card)}
.wday.today{background:var(--accent);box-shadow:none}
.mock .big,.score .big{background:none;-webkit-background-clip:initial;background-clip:initial;color:var(--accent2)}
.statbox .n{font-family:'Inter',sans-serif;font-weight:700}
