  const left = $('#left', v), center = $('#center', v), chatEl = $('#chat', v);
  $('#fab', v).onclick = () => chatEl.classList.toggle('open');
  const task = () => hw.tasks.find((t) => t.id === st.task);
  const busyBtn = (b, label = 'Preparando…') => { b.disabled = true; b.innerHTML = `<span class="spin"></span> ${label}`; };
  const syncDone = async () => {
    const all = hw.tasks.length && hw.tasks.every((t) => t.done);
    if (all && !hw.done) { hw.done = true; confetti(); toast('¡Deberes terminados! 🎉'); logActivity(2); }
    if (!all) hw.done = false;
    const ev = hw.eventId && byId('events', hw.eventId); if (ev && ev.type === 'homework') { ev.done = !!hw.done; await save('events', ev); }
    await persist();
  };

  const drawLeft = () => {
    left.innerHTML = `<div class="row between"><a class="back" href="#/homework">${ic('left')} Deberes</a><div class="row" style="gap:2px"><button class="icon-btn" id="ren" title="Renombrar">${ic('edit')}</button><button class="icon-btn" id="del" title="Borrar">${ic('trash')}</button></div></div>
      <h1>${esc(hw.title)}</h1>
      <div class="hw-sub" style="margin:-6px 0 14px">${hw.subject ? `<span class="pill acc">${esc(hw.subject)}</span>` : ''}${hwDueChip(hw)}${hw.minutes ? `<span class="pill">${ic('clock')} ~${hw.minutes} min</span>` : ''}</div>
      <div class="bar" style="margin-bottom:14px"><i style="width:${hwProgress(hw)}%"></i></div>
      <button class="side-item ${st.view === 'overview' ? 'on' : ''}" data-v="overview">${ic('layers')} Resumen</button>
      ${hw.reading ? `<button class="side-item ${st.view === 'reading' ? 'on' : ''}" data-v="reading">${ic('book')} Lectura</button>` : ''}
      ${(hw.vocab || []).length ? `<button class="side-item ${st.view === 'vocab' ? 'on' : ''}" data-v="vocab">${ic('abc')} Vocabulario <span class="count">${hw.vocab.length}</span></button>` : ''}
      <button class="side-item ${st.view === 'board' ? 'on' : ''}" data-v="board">${ic('board')} Pizarra con voz</button>
      ${hw.tasks.length ? `<button class="sec-h"><span class="grow">Tareas</span></button>` : ''}
      ${hw.tasks.map((t) => `<button class="topic ${st.view === 'task' && st.task === t.id ? 'on' : ''}" data-t="${t.id}"><span class="dot ${t.done ? 'mastered' : t.revealed ? 'review' : 'new'}"></span><span class="grow">${esc(t.title)}</span></button>`).join('')}
      <div class="sources-sec"><button class="side-item" id="srcs">${ic('clip')} Material subido <span class="count">${hw.sources.length}</span></button></div>`;
    $$('[data-v]', left).forEach((b) => (b.onclick = () => { st.view = b.dataset.v; drawAll(); }));
    $$('[data-t]', left).forEach((b) => (b.onclick = () => { st.view = 'task'; st.task = b.dataset.t; drawAll(); if (innerWidth < 820) center.scrollIntoView({ behavior: 'smooth' }); }));
    $('#ren', left).onclick = () => { const n = prompt('Nombre de los deberes', hw.title); if (n && n.trim()) { hw.title = n.trim(); const s = prompt('Materia', hw.subject || ''); if (s !== null) hw.subject = s.trim(); persist(); drawLeft(); } };
    $('#del', left).onclick = async () => { if (await confirmBox(`Se borrarán «${hw.title}» y su evento del calendario.`)) { if (hw.eventId) await remove('events', hw.eventId); await remove('homework', hw.id); go('/homework'); } };
    $('#srcs', left).onclick = () => { const mm = openModal(`<h2>Material subido</h2><div class="sources-grid">${hw.sources.map((s) => `<button class="src-thumb" data-src="${s.id}">${srcThumb(s) ? `<img src="${srcThumb(s)}" alt="">` : `<span class="ph">${ic(srcIcon(s))}</span>`}<div>${esc(s.name)}</div></button>`).join('')}</div>`, { cls: 'mid' }); $$('[data-src]', mm.el).forEach((b) => (b.onclick = () => openSource(hw.sources.find((x) => x.id === b.dataset.src)))); };
  };

  const speakBtn = (text, l, cls = '') => `<button class="icon-btn say ${cls}" data-say="${esc(text)}" data-lang="${esc(l || lang)}" title="Escuchar">${ic('vol')}</button>`;
  const bindSay = (root) => $$('[data-say]', root).forEach((b) => (b.onclick = (e) => { e.stopPropagation(); Speech.stop(); Speech.say(b.dataset.say, { lang: b.dataset.lang }); }));

  const drawOverview = () => {
    const r = rel(), pending = hw.tasks.filter((t) => !t.done).length;
    const rd = r && r.date ? daysUntil(r.date) : null;
    center.innerHTML = `<div class="topic-head"><div class="grow"><span class="pill acc" style="margin-bottom:12px">${HW_KIND[hw.kind] || 'Deberes'}${hw.subject ? ' · ' + esc(hw.subject) : ''}</span><h2>${esc(hw.title)}</h2><p class="muted">${esc(hw.summary || '')}</p></div>${ring(hwProgress(hw), 'Hecho')}</div>
      ${r ? `<div class="callout warn"><span class="ci">${ic('target')}</span><div class="grow"><b>Esto entra en un examen: ${esc(r.title)}</b><div>${esc(hw.relatedReason || '')}${r.date ? ` · ${fmtDate(r.date, true)}${rd !== null ? ' (' + relDay(r.date).toLowerCase() + ')' : ''}` : ''}</div></div>${hw.examId ? `<a class="btn btn-primary btn-sm" href="#/exam/${hw.examId}">Ver plan</a>` : `<button class="btn btn-primary btn-sm" id="pack">Preparar el examen</button>`}</div>` : ''}
      ${hw.kind === 'exam_prep' && !r ? `<div class="callout warn"><span class="ci">${ic('target')}</span><div class="grow"><b>Parece material de un examen</b><div>${hw.examId ? 'Tienes el pack preparado.' : 'Elige la fecha y te preparo guía, flashcards, test y avisos.'}</div></div>${hw.examId ? `<a class="btn btn-primary btn-sm" href="#/exam/${hw.examId}">Ver plan</a>` : `<button class="btn btn-primary btn-sm" id="pack">Preparar</button>`}</div>` : ''}
      ${hw.pack && hw.setId ? `<div class="callout"><span class="ci">${ic('check')}</span><div class="grow"><b>Pack de examen listo</b><div>Guía, flashcards y test en tu set de estudio${hw.examId ? ', y el plan en Exámenes' : ''}.</div></div><a class="btn btn-soft btn-sm" href="#/set/${hw.setId}">Abrir set</a>${hw.examId ? `<a class="btn btn-soft btn-sm" href="#/exam/${hw.examId}">Plan</a>` : ''}<a class="btn btn-soft btn-sm" id="mail" href="${mailtoPack(hw)}">${ic('send')} Email</a></div>` : ''}
      <div class="guide-box"><div class="md">${md(hw.overview)}</div></div>
      <h2 style="font-size:22px;margin:26px 0 14px">Qué quieres hacer</h2>
      <div class="practice">
        <div class="pcard"><h3>${ic('hw')} Empezar por la primera tarea</h3><p class="muted" style="margin:0">${pending ? `Te quedan ${pending} ${pending === 1 ? 'tarea' : 'tareas'}. Te la explico paso a paso, sin darte la solución de golpe.` : 'Ya has terminado todas. Puedes repasarlas.'}</p><button class="btn btn-primary" id="go1" ${hw.tasks.length ? '' : 'disabled'}>${pending ? 'Empezar' : 'Repasar'}</button></div>
        <div class="pcard"><h3>${ic('board')} Pizarra con voz</h3><p class="muted" style="margin:0">Una clase que se escribe sola mientras te lo explica en voz alta${hw.language && !/^es/i.test(hw.language) ? ' (con la pronunciación en ' + esc(hw.language) + ')' : ''}.</p><button class="btn btn-primary" id="brd">${hw.board ? 'Ver clase' : 'Crear clase'}</button></div>
        <div class="pcard"><h3>${ic('calplus')} Calendario</h3><p class="muted" style="margin:0">${hw.due ? `Entrega ${fmtDate(hw.due, true)}.` : 'Sin fecha de entrega.'} Elige cuándo ${hw.reading ? 'leerlo' : 'hacerlo'} y te lo recuerdo.</p><div class="row" style="gap:8px"><button class="btn btn-ghost" id="plan">Planificar</button>${hw.due ? '' : '<button class="btn btn-ghost" id="setdue">Poner entrega</button>'}</div></div>
        <div class="pcard"><h3>${ic('cards')} Estudiarlo</h3><p class="muted" style="margin:0">Convierte estos deberes en un set con guía, flashcards y quiz.</p><div class="row" style="gap:8px"><button class="btn btn-ghost" id="mkset">Crear set</button>${(hw.vocab || []).length ? '<button class="btn btn-ghost" id="mkvoc">Solo vocabulario</button>' : ''}</div></div>
      </div>`;
    const set = (id, fn) => { const e = $('#' + id, center); if (e) e.onclick = fn; };
    set('go1', () => { const t = hw.tasks.find((x) => !x.done) || hw.tasks[0]; st.view = 'task'; st.task = t.id; drawAll(); });
    set('brd', (e) => hwBoard(e.currentTarget, null));
    set('plan', () => openHwPlanner(hw));
    set('setdue', () => { const mm = openModal(`<h2>Fecha de entrega</h2><input class="inp" type="date" id="dd" min="${todayISO()}"><div class="row" style="justify-content:flex-end;margin-top:18px"><button class="btn btn-primary" id="ok">Guardar</button></div>`, { cls: 'mid' }); $('#ok', mm.el).onclick = async () => { const d = $('#dd', mm.el).value; if (!d) return; hw.due = d; const ev = { id: uid(), title: `Deberes: ${hw.title}`, type: 'homework', date: d, subject: hw.subject, done: false, hwId: hw.id }; await save('events', ev); hw.eventId = ev.id; await persist(); mm.close(); drawAll(); }; });
    set('pack', () => openExamPackDialog(hw));
    set('mkset', async () => {
      const set2 = await generating('Creando tu set de estudio', (o) => genSet({ sources: hw.sources, title: hw.title, color: SET_COLORS[ST.sets.length % SET_COLORS.length], focus: ['understand', 'memo'], custom: 'A partir de estos deberes: teoría necesaria y ejercicios tipo.' }, o), { expect: 9000, steps: ['Leyendo tus deberes', 'Detectando la materia', 'Escribiendo guías y temas', 'Ordenándolo en carpetas'] });
      if (!set2) return; set2.subject = hw.subject || set2.subject; await save('sets', set2); go('/set/' + set2.id);
    });
    set('mkvoc', async () => {

      const s2 = { id: uid(), title: `Vocabulario · ${hw.title}`, color: SET_COLORS[ST.sets.length % SET_COLORS.length], focus: ['memo'], custom: '', subject: hw.subject || 'Idiomas', emoji: '🔤', language: lang, overview: `Vocabulario de **${hw.title}**.`, createdAt: Date.now(), lastOpenedAt: Date.now(), sources: [], chat: [], mock: null, cheat: '', podcast: null, sections: [{ id: uid(), title: 'Vocabulario', topics: [{ id: uid(), title: 'Palabras clave', summary: `${cards.length} palabras de los deberes`, guide: hw.vocab.map((x) => `- **${x.term}** — ${x.translation}${x.example ? `  \n  _${x.example}_` : ''}`).join('\n'), review: '', cards, quiz: [] }] }] };
      await save('sets', s2); go('/set/' + s2.id);
    });
  };

  async function hwBoard(btn, t) {
    const key = t ? t.id : 'all', holder = t || hw, field = t ? 'board' : 'board';
    if (!holder[field]) {
      if (btn) busyBtn(btn, 'Preparando la clase…');
      try {
        const extra = `\n\nExplica cómo se hace, paso a paso, para que el estudiante lo ENTIENDA (no solo el resultado).${hw.language && !/^es/i.test(hw.language) ? ` Los deberes son de ${hw.language}: explica en español y usa say_foreign/foreign_language para pronunciar las palabras y frases en ese idioma.` : ''}`;
        holder[field] = await genBoard(hwText(hw, t) + extra);
        await persist();
      } catch (e) { toast(e.message, true); drawCenter(); return; }
    }
    openBoard(holder[field]); drawCenter();
  }

  const drawTask = () => {
    const t = task(); if (!t) { st.view = 'overview'; return drawOverview(); }
    const n = t.steps.length, rev = clamp(t.revealed || 0, 0, n), idx = hw.tasks.indexOf(t);
    center.innerHTML = `<div class="topic-head"><div class="grow"><span class="pill" style="margin-bottom:12px">Tarea ${idx + 1} de ${hw.tasks.length}</span><h2>${esc(t.title)}</h2></div><label class="done-toggle ${t.done ? 'on' : ''}"><input type="checkbox" id="dn" ${t.done ? 'checked' : ''}> ${ic('check')} ${t.done ? 'Hecha' : 'Marcar como hecha'}</label></div>
      <div class="guide-box"><div class="md">${md(t.statement)}</div></div>
      ${t.concept ? `<div class="callout"><span class="ci">${ic('spark')}</span><div class="grow"><b>La idea clave</b><div class="md">${md(t.concept)}</div></div></div>` : ''}
      <div class="try-box"><label class="lbl" style="margin-top:0">Inténtalo tú primero</label><textarea class="inp" id="mine" rows="3" placeholder="Escribe tu intento (aunque no estés seguro). Te digo dónde vas bien y dónde fallas, sin darte la solución.">${esc(t.mine || '')}</textarea><div class="row between" style="margin-top:10px"><div class="row" style="gap:8px">${t.hint ? `<button class="btn btn-ghost btn-sm" id="hint">${ic('wand')} ${t.hintShown ? 'Ocultar pista' : 'Dame una pista'}</button>` : ''}</div><button class="btn btn-primary btn-sm" id="chk">${ic('check')} Corregir mi intento</button></div>${t.hintShown ? `<div class="callout" style="margin-top:12px"><span class="ci">${ic('wand')}</span><div class="grow md">${md(t.hint)}</div></div>` : ''}<div id="fb"></div></div>
      <h3 class="sec-title" style="margin:26px 0 12px">Paso a paso ${n ? `<span class="muted" style="font-size:15px;font-weight:500">· ${rev}/${n}</span>` : ''}</h3>
      <div class="steps">${t.steps.slice(0, rev).map((s, i) => `<div class="stepc"><span class="sn">${i + 1}</span><div class="grow md">${md(s)}</div><div class="step-act">${speakBtn(plain(s), 'es-ES')}<button class="btn btn-ghost btn-sm" data-ask="${i}">No lo entiendo</button></div></div>`).join('')}</div>
      <div class="row" style="gap:10px;margin-top:12px">${rev < n ? `<button class="btn btn-primary" id="next">${rev ? 'Siguiente paso' : 'Ver el primer paso'} ${ic('down')}</button>` : ''}${rev > 0 && rev < n ? `<button class="btn btn-ghost" id="all">Ver todos</button>` : ''}</div>
      ${rev >= n && n ? `<div class="answer-box"><b>Resultado</b><div class="md">${md(t.answer)}</div></div>` : n ? `<p class="muted" style="margin-top:14px">El resultado aparece al terminar los pasos.</p>` : `<div class="answer-box"><b>Resultado</b><div class="md">${md(t.answer)}</div></div>`}
      <div class="row wrap" style="gap:10px;margin-top:22px"><button class="btn btn-soft" id="tb">${ic('board')} ${t.board ? 'Ver en la pizarra' : 'Explícamelo en la pizarra con voz'}</button><button class="btn btn-ghost" id="similar">${ic('refresh')} Ejercicio parecido para practicar</button>${idx < hw.tasks.length - 1 ? `<button class="btn btn-ghost" id="nx">Siguiente tarea ${ic('right')}</button>` : ''}</div><div id="sim"></div>`;
    bindSay(center);

SCHEMA.pack = S.obj({
  items: S.arr(S.obj({
    index: S.int('Número del archivo (1, 2, 3…) tal y como se te dieron'),
    subject: S.str('Clase o materia, 1-3 palabras en español'),

const BP_KIND = {
  explanation: ['Explicaciones', 'book', '#4f8bff'], exercises: ['Ejercicios', 'list', '#a06cf5'], homework: ['Deberes', 'hw', '#f2902d'],
  exam: ['Exámenes', 'target', '#f2625d'], notes: ['Apuntes', 'text', '#2fb86b'], other: ['Otros', 'folder', '#8b95a8'],
};

/* ---------- classes (subjects) ---------- */
function subjectRec(name) { const n = String(name || '').trim().toLowerCase(); return ST.subjects.find((s) => s.name.toLowerCase() === n || (s.aliases || []).some((a) => a.toLowerCase() === n)); }
async function ensureSubject(name) {
  name = String(name || '').trim(); if (!name) return '';
  const r = subjectRec(name); if (r) return r.name;
  const used = new Set(ST.subjects.map((s) => s.color));
  const s = { id: uid(), name, color: SET_COLORS.find((c) => !used.has(c)) || SET_COLORS[ST.subjects.length % SET_COLORS.length], aliases: [] };
  await save('subjects', s); return s.name;
}
function subjectColor(name) { const r = subjectRec(name); if (r) return r.color; const k = [...new Set(ST.sets.map((s) => s.subject))].indexOf(name); return SET_COLORS[(k < 0 ? 5 : k) % SET_COLORS.length]; }
async function renameSubject(oldName, newName) {
  newName = newName.trim(); if (!newName || newName === oldName) return;
  const target = subjectRec(newName), src = subjectRec(oldName);
  const final = target ? target.name : newName;
  for (const store of ['items', 'sets', 'exams', 'homework', 'events']) for (const x of ST[store]) if ((x.subject || '').toLowerCase() === oldName.toLowerCase()) { x.subject = final; await save(store, x); }
  if (target && src && target !== src) { target.aliases = [...new Set([...(target.aliases || []), oldName, ...(src.aliases || [])])]; await save('subjects', target); await remove('subjects', src.id); }
  else if (src) { src.aliases = (src.aliases || []).filter((a) => a.toLowerCase() !== newName.toLowerCase()); src.name = final; await save('subjects', src); }
  else if (!target) await ensureSubject(final);
}
function openClasses(after) {

    <div class="cls-list">${names.map((n) => { const r = subjectRec(n); const c = ST.items.filter((i) => i.subject === n).length; return `<div class="cls-row" data-n="${esc(n)}"><input type="color" value="${subjectColor(n)}" data-col="${esc(n)}" title="Color"><input class="inp" value="${esc(n)}" data-ren="${esc(n)}"><span class="muted">${c} ${c === 1 ? 'archivo' : 'archivos'}</span><button class="btn btn-ghost btn-sm" data-merge="${esc(n)}" ${names.length < 2 ? 'disabled' : ''}>Unir con…</button></div>${r && r.aliases && r.aliases.length ? `<div class="cls-al muted">También: ${r.aliases.map(esc).join(', ')}</div>` : ''}`; }).join('') || '<p class="muted">Aún no hay clases. Se crean solas cuando subes cosas.</p>'}</div>
    <div class="row" style="margin-top:16px;gap:10px"><input class="inp" id="newc" placeholder="Nueva clase (ej: Alemán)"><button class="btn btn-soft" id="addc">${ic('plus')} Añadir</button></div>

/* ---------- classification ---------- */
const quickHash = (s) => { let h = 5381; const str = String(s); const step = Math.max(1, Math.floor(str.length / 4000)); for (let i = 0; i < str.length; i += step) h = ((h << 5) + h + str.charCodeAt(i)) | 0; return h + ':' + str.length; };
async function addToBackpack(files, extraSources = []) {
  files = [...files];
  const srcs = [...extraSources];
  for (const f of files) {
    try { srcs.push(await fileToSource(f)); } catch (e) { toast(e.message, true); }
  }
  const fresh = [];
  for (const s of srcs) {
    const hash = quickHash(s.kind === 'video' ? (s.frames[0] || {}).data : s.data);
    if (ST.items.some((i) => i.hash === hash) || fresh.some((i) => i.hash === hash)) { toast(`«${s.name}» ya está en la mochila`, 'info'); continue; }
    fresh.push({ id: uid(), source: s, name: s.name, hash, subject: '', kind: 'other', title: s.name.replace(/\.[^.]+$/, ''), topic: '', summary: '', text: '', status: 'new', createdAt: Date.now() });
  }
  if (!fresh.length) return;
  if (fresh.length > BP_MAX) { toast(`Máximo ${BP_MAX} archivos a la vez; sube el resto en otra tanda.`, true); fresh.length = BP_MAX; }
  for (const it of fresh) await save('items', it);
  BP_REDRAW && BP_REDRAW();
  sortItems(fresh.map((i) => i.id));
  return fresh;
}
function sortItems(ids) {
  const todo = ids.map((id) => byId('items', id)).filter(Boolean);
  todo.forEach((i) => { i.status = 'sorting'; save('items', i); });
  BP_REDRAW && BP_REDRAW();
  Jobs.add(`Clasificando ${todo.length} ${todo.length === 1 ? 'archivo' : 'archivos'} de la mochila`, async () => {
    const BATCH = 4; let failed = 0;
    for (let i = 0; i < todo.length; i += BATCH) {
      const batch = todo.slice(i, i + BATCH).filter((x) => byId('items', x.id));
      try { await classifyBatch(batch); }
      catch (e) { failed += batch.length; for (const it of batch) { it.status = 'error'; it.err = e.message; await save('items', it); } }
      BP_REDRAW && BP_REDRAW();
    }
    const ok = todo.filter((i) => i.status === 'done');
    if (ok.length) {
      const subs = [...new Set(ok.map((i) => i.subject).filter(Boolean))];
      await addAlert({ title: `Mochila ordenada: ${ok.length} ${ok.length === 1 ? 'archivo' : 'archivos'}`, body: subs.join(', ') || 'Sin clase', href: '#/backpack', kind: 'auto' });
      for (const sub of subs) runAutomations('backpack', { items: ok.filter((i) => i.subject === sub), subject: sub });
    }
    if (failed) throw new Error(`${failed} sin clasificar (puedes reintentarlo)`);
  });
}
async function classifyBatch(batch) {
  const classes = ST.subjects.map((s) => `- ${s.name}${s.aliases && s.aliases.length ? ` (también: ${s.aliases.join(', ')})` : ''}`).concat([...new Set(ST.sets.map((s) => s.subject))].filter((n) => !subjectRec(n)).map((n) => `- ${n}`));
  const content = [];
  batch.forEach((it, k) => { content.push({ type: 'text', text: `=== ARCHIVO ${k + 1}: ${it.name} ===` }, ...sourceBlock(it.source)); });
  content.push({ type: 'text', text: `Son ${batch.length} archivos de un estudiante (capturas, fotos de pizarra, páginas, PDF, deberes, exámenes…). Para CADA uno, en orden:
- kind:
  · explanation = explica teoría (pizarra con apuntes, libro, diapositiva, resumen), aunque incluya algún ejemplo resuelto.
  · exercises = enunciados de ejercicios o problemas para resolver (típico: numerados 1, 2, 3 o con letras A, B, C / a), b), c)). Una pizarra con ejercicios con letras o números va aquí, NO en explanation.
  · homework = pone "deberes", "para casa", fecha de entrega, o es una hoja de tarea asignada.
  · exam = un examen, control o prueba (hecho o por hacer), o el temario de un examen.
  · notes = apuntes personales sueltos. other = lo demás.
- subject: la clase. Usa EXACTAMENTE una de las del estudiante si encaja; si no, crea un nombre corto. No separes ni unas materias por tu cuenta: sigue las clases que ya tiene.
${classes.length ? 'Clases del estudiante:\n' + classes.join('\n') : 'El estudiante aún no tiene clases: crea nombres sencillos (Matemáticas, Física, Lengua, Alemán…).'}
- title, topic, summary, language.
- text: transcribe TODO el contenido con fidelidad (máx. ~1500 palabras por archivo). Fórmulas en LaTeX con $.
Devuelve un elemento por archivo con su "index".` });
  const r = await ai({ system: SYS(), messages: [{ role: 'user', content }], schema: SCHEMA.pack, max_tokens: 14000 });
  const got = new Map((r.items || []).map((x) => [x.index, x]));
  for (let k = 0; k < batch.length; k++) {
    const it = batch[k], x = got.get(k + 1);
    if (!x) { it.status = 'error'; it.err = 'La IA no devolvió este archivo'; await save('items', it); continue; }
    it.subject = await ensureSubject(x.subject); it.kind = x.kind || 'other'; it.title = x.title || it.title; it.topic = x.topic || ''; it.language = x.language || ''; it.summary = x.summary || ''; it.text = x.text || '';
    it.status = 'done'; it.err = ''; await save('items', it);
  }
}

/* ---------- turning items into sources / actions ---------- */
function itemsToSources(items) {
  const out = [];
  for (const it of items) {
    if (it.text && it.text.length > 200) out.push({ id: uid(), kind: 'text', name: `${it.title} (${it.subject || 'sin clase'})`, mime: 'text/plain', data: `# ${it.title}\nClase: ${it.subject}${it.topic ? ' · Tema: ' + it.topic : ''}\n\n${it.text}` });
    else out.push({ ...it.source, id: uid() });          // mostly graphical: keep the picture
  }
  if (out.length <= MAX_SOURCES) return out;
  // too many: pack text sources together
  const txt = out.filter((s) => s.kind === 'text'), rest = out.filter((s) => s.kind !== 'text');
  const room = Math.max(1, MAX_SOURCES - rest.length), per = Math.ceil(txt.length / room), packed = [];
  for (let i = 0; i < txt.length; i += per) packed.push({ id: uid(), kind: 'text', name: `Apuntes ${packed.length + 1}`, mime: 'text/plain', data: txt.slice(i, i + per).map((s) => s.data).join('\n\n---\n\n') });
  return [...rest, ...packed].slice(0, MAX_SOURCES);
}
const itemsText = (items) => items.map((it) => `### ${it.title} [${BP_KIND[it.kind][0]}${it.topic ? ' · ' + it.topic : ''}]\n${it.text || it.summary || '(sin texto)'}`).join('\n\n');

      ${items.some((i) => !i.subject && i.status === 'done') ? `<button class="side-item ${st.subject === '__none' ? 'on' : ''}" data-s="__none">${ic('folder')} <span class="grow">Sin clase</span><span class="count">${items.filter((i) => !i.subject).length}</span></button>` : ''}

    $$('[data-k]', v).forEach((b) => (b.onclick = () => { st.kind = b.dataset.k; st.sel.clear(); draw(); }));
    $('#bpgrid', v).innerHTML = shown.length ? `<div class="bp-head row between wrap"><span class="muted">${shown.length} ${shown.length === 1 ? 'archivo' : 'archivos'}${st.subject && st.subject !== '__none' ? ' de ' + esc(st.subject) : ''}</span><div class="row" style="gap:8px"><button class="btn btn-ghost btn-sm" id="bpall">${ic('checksq')} Seleccionar todo</button></div></div><div class="bp-grid">${shown.map(itemCard).join('')}</div>` : `<div class="empty-state"><span class="es-ico">${ic('backpack')}</span><h3>${items.length ? 'Nada con ese filtro' : 'Tu mochila está vacía'}</h3><p class="muted">${items.length ? 'Prueba con otra clase o tipo.' : 'Suelta arriba tus capturas y fotos: se ordenan solas.'}</p></div>`;

  const itemCard = (i) => {

      <div class="bp-th">${th ? `<img src="${th}" alt="">` : `<div class="bp-ph">${i.source && i.source.kind === 'text' ? `<small>${esc((i.source.data || '').slice(0, 140))}</small>` : ic(i.source ? srcIcon(i.source) : 'file')}</div>`}${i.status === 'sorting' || i.status === 'new' ? '<div class="bp-wait"><span class="spin"></span></div>' : i.status === 'error' ? `<div class="bp-wait err">${ic('x')}</div>` : ''}</div>
      <div class="bp-info"><b>${esc(i.status === 'done' ? i.title : i.name)}</b>${i.status === 'done' ? `<div class="bp-tags"><span class="pill" style="background:${k[2]}22;color:${k[2]}">${BP_ONE[i.kind] || k[0]}</span>${i.subject ? `<span class="pill" style="background:${subjectColor(i.subject)}22;color:${subjectColor(i.subject)}">${esc(i.subject)}</span>` : ''}</div>${i.topic ? `<small class="muted">${esc(i.topic)}</small>` : ''}` : `<small class="muted">${i.status === 'error' ? 'No se pudo clasificar' : 'Clasificando…'}</small>`}</div></div>`;
  };
  const selected = () => [...st.sel].map((id) => byId('items', id)).filter(Boolean);
  const bar = () => {
    const b = $('#bpbar', v), sel = selected();
    b.classList.toggle('hidden', !sel.length);

    b.innerHTML = `<b>${sel.length} ${sel.length === 1 ? 'seleccionado' : 'seleccionados'}</b><span class="grow"></span>
      <button class="btn btn-soft btn-sm" data-a="cards">${ic('cards')} Flashcards</button><button class="btn btn-soft btn-sm" data-a="quiz">${ic('quiz')} Quiz</button><button class="btn btn-soft btn-sm" data-a="set">${ic('guide')} Guía de estudio</button>
      <button class="btn btn-soft btn-sm" data-a="review">${ic('book')} Repasar</button><button class="btn btn-soft btn-sm" data-a="ex">${ic('list')} Ejercicios</button><button class="btn btn-soft btn-sm" data-a="exam">${ic('target')} Preparar examen</button>
      <button class="btn btn-ghost btn-sm" data-a="skill">${ic('slash')} Crear skill</button><button class="btn btn-ghost btn-sm" data-a="hw">${ic('hw')} Como deberes</button>

    $$('[data-a]', b).forEach((x) => (x.onclick = () => act(x.dataset.a, selected(), subj)));

  async function act(a, sel, subj) {

        <div class="row between wrap" style="margin-top:18px;gap:10px"><div class="row" style="gap:8px"><button class="btn btn-danger btn-sm" id="idel">${ic('trash')}</button><button class="btn btn-ghost btn-sm" id="ire">${ic('refresh')} Reclasificar</button></div><button class="btn btn-primary" id="isave">${ic('check')} Guardar</button></div></div></div>`, { cls: 'wide' });

/* =================== slash assist (/skill autocomplete) =================== */
function slashAssist(input, onChange) {
  if (!input || input._slash) return; input._slash = true;
  let box = null, items = [], idx = 0, frag = null;
  const close = () => { if (box) { box.remove(); box = null; } frag = null; };
  const caretWord = () => {
    const pos = input.selectionStart ?? input.value.length;
    const before = input.value.slice(0, pos);
    const m = /(^|\s)\/([a-z0-9-]*)$/i.exec(before);
    return m ? { start: pos - m[2].length - 1, end: pos, q: m[2].toLowerCase() } : null;
  };
  const pick = (s) => {
    if (!frag) return;
    if (!s) { close(); go('/skills?new=1'); return; }
    const v = input.value;
    input.value = v.slice(0, frag.start) + '/' + s.slug + ' ' + v.slice(frag.end);
    const p = frag.start + s.slug.length + 2; input.setSelectionRange(p, p);
    close(); input.dispatchEvent(new Event('input', { bubbles: true })); input.focus();
  };
  const render = () => {
    frag = caretWord();
    if (!frag) return close();
    const nq = frag.q;
    items = ST.skills.filter((s) => !nq || s.slug.includes(nq) || s.name.toLowerCase().includes(nq)).sort((a, b) => (b.uses || 0) - (a.uses || 0)).slice(0, 8);
    idx = Math.min(idx, Math.max(0, items.length - 1));
    if (!box) { box = document.createElement('div'); box.className = 'slash'; document.body.appendChild(box); }
    const r = input.getBoundingClientRect();
    const up = r.bottom + 310 > innerHeight;
    box.style.left = Math.max(8, Math.min(r.left, innerWidth - 430)) + 'px';
    box.style.top = up ? '' : r.bottom + 6 + 'px';
    box.style.bottom = up ? innerHeight - r.top + 6 + 'px' : '';
    box.innerHTML = `<div class="head">Skills</div>${items.length ? items.map((s, k) => `<button class="it ${k === idx ? 'on' : ''}" data-k="${k}"><span class="sk-ico">${esc(s.emoji || '✨')}</span><span class="grow"><b>/${esc(s.slug)}</b><small>${esc(s.description || s.name)}</small></span></button>`).join('') : ''}<button class="it" data-new><span class="sk-ico" style="background:var(--card3);color:var(--text)">${ic('plus')}</span><span class="grow"><b>Crear skill</b><small>Enséñale a ${APP_NAME} cómo quieres las cosas</small></span></button>`;
    $$('[data-k]', box).forEach((b) => b.addEventListener('mousedown', (e) => { e.preventDefault(); pick(items[+b.dataset.k]); }));
    $('[data-new]', box).addEventListener('mousedown', (e) => { e.preventDefault(); pick(null); });
  };
  input.addEventListener('input', () => { render(); onChange && onChange(); });
  input.addEventListener('blur', () => setTimeout(close, 120));
  (input.parentElement || input).addEventListener('keydown', (e) => {
    if (!box || e.target !== input) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); e.stopImmediatePropagation(); idx = (idx + (e.key === 'ArrowDown' ? 1 : -1) + Math.max(1, items.length)) % Math.max(1, items.length); render(); }
    else if ((e.key === 'Enter' || e.key === 'Tab') && items.length) { e.preventDefault(); e.stopImmediatePropagation(); pick(items[idx]); }
    else if (e.key === 'Escape') { e.stopImmediatePropagation(); close(); }
  }, true);
}

function openInk(onUse) {
  let color = '#1f1b2e', width = 3, eraser = false;
  const strokes = []; let cur = null;
  const m = openModal(`<h2>Escribe a mano</h2><p class="lead">Con Apple Pencil, el dedo o el ratón. Luego lo resuelvo o lo uso como apunte.</p>

      <button class="chip" id="kpen">${ic('draw')} Lápiz</button><button class="chip" id="kera">${ic('eraser')} Goma</button><span class="grow"></span><button class="icon-btn" id="kundo" title="Deshacer">${ic('undo')}</button><button class="icon-btn" id="kclr" title="Borrar todo">${ic('trash')}</button></div>

    <div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-primary" id="kuse">${ic('check')} Usar</button></div>`, { cls: 'wide' });
  const cv = $('#ink', m.el), ctx = cv.getContext('2d');
  const fit = () => { const r = cv.getBoundingClientRect(), d = devicePixelRatio || 1; cv.width = r.width * d; cv.height = r.height * d; ctx.setTransform(d, 0, 0, d, 0, 0); redraw(); };
  const drawStroke = (s) => {
    ctx.globalCompositeOperation = s.eraser ? 'destination-out' : 'source-over';
    ctx.strokeStyle = s.color; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (let k = 1; k < s.pts.length; k++) { const a = s.pts[k - 1], b = s.pts[k]; ctx.lineWidth = s.eraser ? 22 : s.width * (0.45 + (b.p || 0.5)); ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
    ctx.globalCompositeOperation = 'source-over';
  };
  const redraw = () => { ctx.clearRect(0, 0, cv.width, cv.height); strokes.forEach(drawStroke); };
  const pt = (e) => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top, p: e.pointerType === 'pen' ? e.pressure : 0.5 }; };
  cv.addEventListener('pointerdown', (e) => { e.preventDefault(); cv.setPointerCapture(e.pointerId); cur = { color, width, eraser: eraser || e.button === 5, pts: [pt(e)] }; strokes.push(cur); });
  cv.addEventListener('pointermove', (e) => { if (!cur) return; e.preventDefault(); const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e]; for (const ev of evs) cur.pts.push(pt(ev)); const n = cur.pts.length; drawStroke({ ...cur, pts: cur.pts.slice(Math.max(0, n - evs.length - 1)) }); });
  const end = () => { cur = null; };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
  $$('[data-c]', m.el).forEach((b) => (b.onclick = () => { color = b.dataset.c; eraser = false; $$('[data-c]', m.el).forEach((x) => x.classList.toggle('on', x === b)); $('#kpen', m.el).classList.add('on'); $('#kera', m.el).classList.remove('on'); }));
  $('#kpen', m.el).onclick = () => { eraser = false; $('#kpen', m.el).classList.add('on'); $('#kera', m.el).classList.remove('on'); };
  $('#kera', m.el).onclick = () => { eraser = true; $('#kera', m.el).classList.add('on'); $('#kpen', m.el).classList.remove('on'); };
  $('#kpen', m.el).classList.add('on');
  $('#kundo', m.el).onclick = () => { strokes.pop(); redraw(); };
  $('#kclr', m.el).onclick = () => { strokes.length = 0; redraw(); };
  $('#kuse', m.el).onclick = () => {
    if (!strokes.length) return toast('Escribe algo primero', true);
    const out = document.createElement('canvas'); out.width = cv.width; out.height = cv.height;
    const o = out.getContext('2d'); o.fillStyle = '#fff'; o.fillRect(0, 0, out.width, out.height); o.drawImage(cv, 0, 0);
    const data = out.toDataURL('image/jpeg', 0.9).split(',')[1];

    m.close();
  };

  const ro = new ResizeObserver(() => { const keep = strokes.slice(); fit(); strokes.splice(0, strokes.length, ...keep); redraw(); }); ro.observe(cv);
}

/* =================== background jobs (automations) =================== */
const Jobs = {
  list: [], running: false, el: null, min: false,
  add(label, fn) { this.list.push({ id: uid(), label, fn, st: 'wait' }); this.paint(); this.run(); },
  async run() {
    if (this.running) return; this.running = true;
    let j;
    while ((j = this.list.find((x) => x.st === 'wait'))) {
      j.st = 'run'; this.paint();
      try { await j.fn(j); j.st = 'ok'; } catch (e) { j.st = 'err'; j.err = e.message; console.warn('auto', e); }
      this.paint();
    }
    this.running = false;
    setTimeout(() => { if (!this.running && this.list.every((x) => x.st !== 'wait' && x.st !== 'run')) { this.list = []; this.paint(); } }, 7000);
  },
  paint() {
    if (!this.list.length) { this.el && this.el.remove(); this.el = null; return; }
    if (!this.el) { this.el = document.createElement('div'); this.el.className = 'jobs no-print'; document.body.appendChild(this.el); }
    const done = this.list.filter((x) => x.st === 'ok' || x.st === 'err').length;
    const busy = this.list.some((x) => x.st === 'run');
    this.el.classList.toggle('min', this.min);
    this.el.innerHTML = `<div class="jobs-head">${busy ? '<span class="spin" style="color:var(--accent2)"></span>' : `<span style="color:var(--good)">${ic('check')}</span>`}<span class="grow">${busy ? 'Automatizando…' : 'Automatizaciones hechas'} ${done}/${this.list.length}</span>${ic(this.min ? 'right' : 'down')}</div><div class="jobs-list">${this.list.map((x) => `<div class="job ${x.st}" title="${esc(x.err || '')}"><span class="st">${x.st === 'run' ? '<span class="spin" style="width:14px;height:14px"></span>' : x.st === 'ok' ? ic('check') : x.st === 'err' ? ic('x') : ic('clock')}</span><span class="grow">${esc(x.label)}</span></div>`).join('')}</div>`;
    $('.jobs-head', this.el).onclick = () => { this.min = !this.min; this.paint(); };
  },
};

function norm(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
function openPalette() {
  if ($('.pal')) return;
  const base = [
    ...NAV.map(([h, i, l]) => ({ sec: 'Ir a', icon: ic(i), label: l, run: () => go(h) })),

    { sec: 'Acciones', icon: ic('slash'), label: 'Nueva skill', run: () => skillForm() },
    { sec: 'Acciones', icon: ic('zap'), label: 'Nueva automatización', run: () => autoForm() },
    { sec: 'Acciones', icon: ic('draw'), label: 'Escribir a mano y resolver', run: () => openInk(async (s) => { const h = { id: uid(), kind: 'solve', question: '', sources: [s], answer: '', chat: [], skillIds: [], createdAt: Date.now() }; await save('history', h); go('/solve/' + h.id); }) },
    { sec: 'Acciones', icon: ic(SETTINGS.theme === 'dark' ? 'sun' : 'moon'), label: 'Cambiar tema claro/oscuro', run: () => $('#sbtheme').click() },
    { sec: 'Acciones', icon: ic('sliders'), label: 'Ajustes', run: () => openSettings() },
    ...ST.sets.map((s) => ({ sec: 'Sets', icon: esc(s.emoji || '📘'), label: s.title, hint: s.subject, run: () => go('/set/' + s.id) })),
    ...ST.exams.map((e) => ({ sec: 'Exámenes', icon: ic('exam'), label: e.title, hint: fmtDate(e.date), run: () => go('/exam/' + e.id) })),
    ...ST.skills.map((s) => ({ sec: 'Skills', icon: esc(s.emoji || '✨'), label: `/${s.slug} · ${s.name}`, hint: 'Usar en el Solver', run: () => go(`/?tool=solver&skill=${encodeURIComponent(s.slug)}`) })),
  ];
  const m = openModal(`<div class="pal-in">${ic('search')}<input id="pq" placeholder="Busca sets, exámenes, skills o acciones…" autocomplete="off"><kbd>esc</kbd></div><div class="pal-list" id="pl"></div><div class="pal-foot"><span><kbd>↑</kbd> <kbd>↓</kbd> moverte</span><span><kbd>↵</kbd> abrir</span><span><kbd>⌘</kbd> <kbd>K</kbd> abrir/cerrar</span></div>`, { cls: 'pal', closable: true });
  m.el.parentElement.classList.add('pal-ov');
  $('.x', m.el)?.remove();
  let res = [], idx = 0;
  const paint = () => {
    const q = norm($('#pq', m.el).value.trim());
    res = (q ? base.filter((x) => norm(x.label + ' ' + (x.hint || '') + ' ' + x.sec).includes(q)) : base.filter((x) => x.sec !== 'Sets' || true).slice(0, 40)).slice(0, 60);
    idx = Math.min(idx, Math.max(0, res.length - 1));
    let last = '';
    $('#pl', m.el).innerHTML = res.length ? res.map((x, k) => { const head = x.sec !== last ? `<div class="pal-sec">${x.sec}</div>` : ''; last = x.sec; return `${head}<button class="pal-it ${k === idx ? 'on' : ''}" data-k="${k}"><span class="pi">${x.icon}</span><span class="grow" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(x.label)}</span>${x.hint ? `<small>${esc(x.hint)}</small>` : ''}</button>`; }).join('') : '<p class="empty">Sin resultados</p>';
    $$('[data-k]', m.el).forEach((b) => { b.onclick = () => { m.close(); res[+b.dataset.k].run(); }; b.onmousemove = () => { if (idx !== +b.dataset.k) { idx = +b.dataset.k; $$('.pal-it', m.el).forEach((x) => x.classList.toggle('on', +x.dataset.k === idx)); } }; });
    $('.pal-it.on', m.el)?.scrollIntoView({ block: 'nearest' });
  };
  const inp = $('#pq', m.el);
  inp.oninput = () => { idx = 0; paint(); };
  inp.onkeydown = (e) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); idx = Math.min(res.length - 1, idx + 1); paint(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); idx = Math.max(0, idx - 1); paint(); }
    else if (e.key === 'Enter' && res[idx]) { e.preventDefault(); const r = res[idx]; m.close(); r.run(); }
  };
  paint(); setTimeout(() => inp.focus(), 30);
}

/* ---------- helpers ---------- */
const clone = (x) => JSON.parse(JSON.stringify(x));

}

const newAct = (type) => ({ t: 'act', type, ...paramDefaults(ACT[type].params) });

}

  for (const e of ST.events) if (e.type === 'exam' && !e.done && !(e.examId && byId('exams', e.examId))) out.push({ kind: 'event', id: e.id, title: e.title, date: e.date, subject: e.subject, event: e });

}
function nextExam(subject) { return examList().filter((x) => x.date >= todayISO() && (!subject || sameSubj(x.subject, subject))).sort((a, b) => a.date.localeCompare(b.date))[0]; }
function ctxSet(ctx) {

  return sub ? [...ST.sets].filter((s) => sameSubj(s.subject, sub)).sort((a, b) => (b.lastOpenedAt || 0) - (a.lastOpenedAt || 0))[0] : null;

/* ---------- conditions ---------- */
function evalCond(c, ctx) {
  const ex = ctx.exam || ctx.event || null, sub = ctxSubject(ctx);
  switch (c.type) {
    case 'subject_is': return !c.value || sameSubj(c.value, sub);
    case 'days_to_exam': {
      const e = ex || nextExam(sub); if (!e) return false;
      const d = daysUntil(e.date), n = +c.n || 0;
      return c.op === '=' ? d === n : c.op === '>=' ? d >= n : d <= n && d >= 0;
    }
    case 'exam_soon': { const e = nextExam(sub); return !!e && daysUntil(e.date) <= (+c.n || 7); }
    case 'score_below': return ctx.pct != null && ctx.pct < (+c.n || 50);
    case 'cards_due': return dueCards().length > (+c.n || 0);
    case 'kind_is': return !!(ctx.items && ctx.items.some((i) => i.kind === c.value));
    case 'hw_due': return ST.homework.some((h) => h.due && !h.done && daysUntil(h.due) >= 0 && daysUntil(h.due) <= (+c.n || 2) && (!sub || sameSubj(h.subject, sub)));

/* ---------- daily / countdown checks ---------- */
function checkDaily() {
  const now = new Date(), hm = now.toTimeString().slice(0, 5), t = todayISO(), dow = now.getDay();
  for (const a of ST.automations) {
    if (!a.enabled) continue;
    const tr = a.trigger;
    if (tr.type === 'daily') {
      if (hm >= (tr.time || '08:00') && a.lastDay !== t && (!tr.dow || tr.dow.includes(dow))) { a.lastDay = t; save('automations', a); startAutomation(a, {}); }
    } else if (tr.type === 'exam_countdown') {
      if (hm < (tr.time || '07:30')) continue;
      const n = +tr.n || 0;
      for (const x of examList()) {
        if (daysUntil(x.date) !== n || (tr.subject && !sameSubj(tr.subject, x.subject))) continue;
        const key = `${x.id}:${t}`; a.fired = a.fired || {};
        if (a.fired[key]) continue;
        a.fired[key] = 1; for (const k of Object.keys(a.fired)) if (!k.endsWith(t)) delete a.fired[k];
        save('automations', a);
        startAutomation(a, { exam: x.exam, event: x.event, subject: x.subject, days: n });
      }
    }
  }
}

function describeParams(specs, obj) {

    const val = p.type === 'select' ? (p.opts.find((o) => o[0] === v) || [, v])[1] : p.type === 'skill' ? (byId('skills', v) ? '/' + byId('skills', v).slug : '') : p.type === 'dow' ? v.map((d) => 'DLMXJVS'[d]).join('') : v;
    return `${p.pre ? p.pre + ' ' : ''}${val}${p.post ? ' ' + p.post : ''}`;
  }).filter(Boolean).join(' ');
}
function triggerText(t) { const d = TRIG[t.type]; return `${d.label} ${describeParams(d.params, t)}`.trim(); }
function autoFlowHTML(a) {
  const steps = [];

  walk(a.blocks || []);
  return `<div class="flow"><span class="tr">${ic(TRIG[a.trigger.type].icon)} ${esc(triggerText(a.trigger))}</span>${ic('right')}${steps.join('')}</div>`;
}
function testContext(a) {

      const kids = [...slot.children].filter((c) => c.classList.contains('blk') && c.dataset.loc !== drag.from);
      let idx = kids.length, before = null;
      for (let i = 0; i < kids.length; i++) { const r = kids[i].getBoundingClientRect(); if (ev.clientY < r.top + r.height / 2) { idx = i; before = kids[i]; break; } }
      slot.classList.add('hot');

      drag.target = { path, idx, kids: kids.map((k) => k.dataset.loc) };

      window.removeEventListener('pointermove', place); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up);
      ghost.remove(); marker.remove(); document.body.classList.remove('ab-dragging'); $$('.slot.hot', el).forEach((s) => s.classList.remove('hot'));

  });
  document.addEventListener('pointermove', (e) => { const el = e.target.closest && e.target.closest('.spot'); if (!el) return; const r = el.getBoundingClientRect(); el.style.setProperty('--mx', e.clientX - r.left + 'px'); el.style.setProperty('--my', e.clientY - r.top + 'px'); }, { passive: true });
  let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { const top = '/' + ((location.hash.slice(2).split(/[/?]/)[0]) || ''); $('#sb').classList.toggle('mini', SETTINGS.sidebarMini || ['/set', '/exam', '/exams', '/writing', '/board'].includes(top) || (innerWidth < 1200 && innerWidth > 700)); }, 150); });
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  window.addEventListener('beforeunload', (e) => { if (AI_BUSY) { e.preventDefault(); e.returnValue = ''; } });
})();
</script>
