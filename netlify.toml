[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"

# El botón "Deploy to Netlify" pedirá estas variables al desplegar.
[template.environment]
  ANTHROPIC_API_KEY = "Tu API key de Anthropic (console.anthropic.com/settings/keys)"
  APP_PASSWORD = "Una contraseña que elijas: la pondrás en Ajustes de la app"
